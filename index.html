\n<td>Curved deck on straight girders (2022–2024)<\/td>\n<td>BrR User Guide modeling is time-consuming for large radii; ACEC\nplotted span vs. radius showing where the edge offset is under 1 inch;\ndecisions remain case by case.<\/td>\n<td>Offer the L²/8R check and a conservative maximum-overhang\nsimplification, with LRS concurrence.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CT-TLC and new paving equipment (2022–2024)<\/td>\n<td>The Roadtec SB-3000 material transfer vehicle has axle loads\nexceeding the CT-TLC MTV (based on the SB-2500). CTDOT is monitoring\nindustry use; a second notional vehicle was considered; <strong>CT-TLC\nis being added back into the Load Rating Manual.<\/strong><\/td>\n<td>Strong DSDC and submittal-review scenario (see <a class=\"xref\" href=\"#con/submittals/u143\" title=\"N2 · During construction, the contractor submits a paving train with a Roadtec SB-3000 MTV. What do you do?\">CN 1.4<\/a>).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Proof calculations for approved software (2022–2023)<\/td>\n<td>Unclear which outputs need proof calculations and what inputs may be\nused; CTDOT to develop guidance. The load rating web page now reiterates\nthat approved-software users must still meet BLRM 12.2.6.<\/td>\n<td>Describe a proportionate proof package: hand-check governing\nsections using software forces, verify distribution and dead load\nindependently.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pour sequence (2023–2025)<\/td>\n<td>Without records, assume the whole deck was placed at once. CTDOT is\nworking to capture pour sequence in as-builts, possibly through a\nConstruction Directive.<\/td>\n<td>Note it in design documents and record it during DSDC.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Software list and BrR versions (2022–2025)<\/td>\n<td>CTDOT posts its software versions. <strong>Ratings in newer versions\nare not accepted.<\/strong> BrR 7.6.1 is now the Department version (it\nwas being tested in July 2025). Version changes in shear (7.3 → 7.5) and\nLTB (each version since 7.6) moved 25–30% of results by more than 10%.\nBrR 7.6.1 also changed cross-frame modeling, development length, and\nCb.<\/td>\n<td>Confirm the version at kickoff; explain differences when an update\nchanges a rating on file. The specific 10th Edition LTB changes are\nsummarized under <a class=\"xref\" href=\"#lr/software/u34\" title=\"Q25 · How do you address software errors, version changes, or unexpected output — for example, a BrR upgrade that moves a rating by more than 10%?\">LR 9.2<\/a>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Rating stages (Dec 2024)<\/td>\n<td>Reports will be designated As Designed, As Inspected, or As\nConstructed (a federal driver once a bridge opens); a pulldown on the\nrating form; District Construction provides as-builts; a submission is\nneeded even if only the stage changes; ratings updated for code changes\nat the same time.<\/td>\n<td>Explain how HDR carries a rating through all three stages on a\ndesign task (see <a class=\"xref\" href=\"#lr/qa/u74\" title=\"Q63 · How do you carry a load rating from design through construction, and update it after rehabilitation or construction changes?\">LR 4.5<\/a>).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Culvert fill (Dec 2024)<\/td>\n<td>New code evaluates the percentage of live load transmitted through\nfill. <strong>Pending: the depth beyond which a buried structure need\nnot be rated increases from 8 ft to 14 ft.<\/strong><\/td>\n<td>See <a class=\"xref\" href=\"#lr/other/u26\" title=\"Q17 · How do you rate a culvert or buried structure, and when does one under deep fill need a rating?\">LR 8.2<\/a>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Report standardization (Dec 2024)<\/td>\n<td>Industry suggested a summary table for all rated elements (not just\ncontrolling and &lt; 1.0), bookmarked and summarized appendices, and a\nreport template. CTDOT agreed to discuss internally.<\/td>\n<td>Offer these as improvements HDR can apply without changing policy\n(see <a class=\"xref\" href=\"#lr/qa/u75\" title=\"Q64 · What makes a load-rating package reproducible, repeatable, and acceptable on first submission?\">LR 4.6<\/a>).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Updating ratings on file by other firms (Dec 2024)<\/td>\n<td>NY/NJ Level 1/Level 2 approach considered insufficient for CTDOT.\nConnecticut sealing rule: a licensee may seal documents not prepared\nunder their supervision only with a thorough written evaluation retained\nfor at least six years.<\/td>\n<td>See <a class=\"xref\" href=\"#lr/qa/u16\" title=\"Q7 · How will you review load ratings prepared by others — including one you are asked to update, or one that looks wrong?\">LR 4.4<\/a>.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Major bridge rating repeatability (July 2025)<\/td>\n<td>Ratings of major bridges not repeatable between evaluations; also\nobserved in MA, RI, and VT. Causes: QC, software and code changes,\ninspection and plan accuracy, modeling approach, assumptions, and\nsettings. Consequences have included strain gauging, coupon tests,\nemergency declarations, overlay milling, strengthening, and national\nexperts. CTDOT has implemented peer reviews, as-built ratings, and\nmanual updates.<\/td>\n<td>This is the most important current theme. See <a class=\"xref\" href=\"#lr/qa/u75\" title=\"Q64 · What makes a load-rating package reproducible, repeatable, and acceptable on first submission?\">LR 4.6<\/a>.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>FHWA-HIF-24-113 vehicle standardization (July 2025)<\/td>\n<td>CTDOT does not plan to reduce its vehicle set; it values the\nvehicles for comparative review.<\/td>\n<td>Don’t propose trimming CT vehicles.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Common comments list (July 2025)<\/td>\n<td>LRS maintains a list of common review comments.<\/td>\n<td>Ask for it at kickoff; build it into the QC checklist.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Railroad bridges (July 2023)<\/td>\n<td>Not handled by the LRS or covered by the BLRM; organizational\ndiscussion ongoing.<\/td>\n<td>HDR’s AREMA and MBTA rail rating experience is an asset if rail work\narises.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Precision and significant digits (Mar 2024)<\/td>\n<td>Reports give RFs to three significant figures; guidance is silent on\ninput precision.<\/td>\n<td>Refine only where it changes a decision (ties to the “when to stop”\ntheme).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "num": "LR 7.19", "home": ["lr", "ctdot"], "old": "§20"}, {"id": "u141", "title": "New Interview Questions from the v2 Review (N1–N22)", "kind": "ref", "html": "\n<p><em>v4: <a class=\"xref\" href=\"#lr/qa/u74\" title=\"Q63 · How do you carry a load rating from design through construction, and update it after rehabilitation or construction changes?\">LR 4.5<\/a>, <a class=\"xref\" href=\"#lr/qa/u16\" title=\"Q7 · How will you review load ratings prepared by others — including one you are asked to update, or one that looks wrong?\">LR 4.4<\/a>, <a class=\"xref\" href=\"#lr/software/u34\" title=\"Q25 · How do you address software errors, version changes, or unexpected output — for example, a BrR upgrade that moves a rating by more than 10%?\">LR 9.2<\/a>, <a class=\"xref\" href=\"#lr/qa/u75\" title=\"Q64 · What makes a load-rating package reproducible, repeatable, and acceptable on first submission?\">LR 4.6<\/a>, <a class=\"xref\" href=\"#lr/other/u26\" title=\"Q17 · How do you rate a culvert or buried structure, and when does one under deep fill need a rating?\">LR 8.2<\/a>, <a class=\"xref\" href=\"#pq/full/u82\" title=\"Prior Q2 · Overhead and side-mounted sign structures\">PQ 2.2<\/a>, <a class=\"xref\" href=\"#lr/steel/u71\" title=\"Q59 · Beam ends with section loss are driving the rating. How do you evaluate them?\">LR 5.11<\/a>, <a class=\"xref\" href=\"#lr/steel/u25\" title=\"Q16 · How do you handle critical connections and gusset plates, and when must they be rated?\">LR 5.9<\/a>, <a class=\"xref\" href=\"#lr/qa/u75\" title=\"Q64 · What makes a load-rating package reproducible, repeatable, and acceptable on first submission?\">LR 4.6<\/a>, and <a class=\"xref\" href=\"#lr/qa/u74\" title=\"Q63 · How do you carry a load rating from design through construction, and update it after rehabilitation or construction changes?\">LR 4.5<\/a> were merged\ninto the matching earlier questions (see the merge map).<\/em><\/p>\n<p>These questions come from the solicitation wording, gaps in the\nproposal, the CTDOT manuals, and the ACEC minutes. Each follows the\nprior-round style: process, CTDOT specifics, judgment, and an\nexample.<\/p>\n", "num": "LR 7.9", "home": ["lr", "ctdot"], "old": "§21"}, {"id": "u142", "title": "Cross-frames on a skewed steel bridge are rating below 1.0. How do you handle it?", "kind": "qa", "html": "\n<p><strong>Recommended response<\/strong><\/p>\n<p>Low cross-frame ratings on skewed Connecticut bridges are common and\nusually reflect stiffness attracting load into members never designed as\nprimary members, plus newer capacity provisions. We first confirm the\nresult is real, then follow CTDOT’s accepted approach and agree on the\neffort up front.<\/p>\n<p><strong>Key points<\/strong><\/p>\n<ul>\n<li><p>Verify geometry, connection eccentricity, member K-factors,\nsingle-angle compression treatment, connection capacity, and BrR version\nbehavior (7.6.1 changed cross-frame modeling).<\/p><\/li>\n<li><p>Check for field distress. CTDOT allows a system factor of 1.20\nfor diaphragms and cross-frames in straight girder bridges when no\nbracing member shows distress (BLRM 4.1.3.4).<\/p><\/li>\n<li><p>If members still rate low, the accepted refinement is iterative\nremoval of low-rated members and re-analysis until the remaining members\nrate above 1.0, typically 3–4 cycles; the final iteration is used for\nall member ratings.<\/p><\/li>\n<li><p>Pending manual change discussed with ACEC: for straight girders\nskewed over 30°, diaphragms will still be rated but reported in a\nseparate component summary table, and iteration to convergence will no\nlonger be required. Confirm current LRS direction before\nstarting.<\/p><\/li>\n<li><p>Propose at scoping a set number of iterations and a check-in with\nthe LRS before extra cycles.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> What does removing a cross-frame\ndo to girder lateral stability and flange lateral bending? (Answer:\ncheck the girders for the revised unbraced length and redistributed\nforces, and flag field replacement or retrofit needs rather than\ntreating removal as “free.”)<\/p>\n", "num": "LR 5.12", "home": ["lr", "steel"], "old": "N1"}, {"id": "u143", "title": "During construction, the contractor submits a paving train with a Roadtec SB-3000 MTV. What do you do?", "kind": "qa", "html": "\n<p><strong>Recommended response<\/strong><\/p>\n<p>Treat it as a structural submittal, not paperwork. The SB-3000’s MTV\naxles, about 70 kips each in the trains we have seen, exceed the MTV\naxles behind CTDOT’s CT-TLC notional vehicle, which was based on the\nolder SB-2500. We check whether the actual train is enveloped by the\nCT-TLC rating on file; if not, we rate the actual configuration and set\noperating restrictions.<\/p>\n<p><strong>Key points<\/strong><\/p>\n<ul>\n<li><p>Compare the submitted axle loads and spacings (for example, 69.9\nk and 67.3 k MTV axles, about 85 ft overall) with the CT-TLC (279.6 k on\n9 axles). Total weight is similar, but concentrated axles can govern\nshort spans, floor systems, decks, and beam ends.<\/p><\/li>\n<li><p>Rate the actual train with CT-TLC parameters: special limited\ncrossing, single trip, mixed with traffic, one-lane distribution, IM =\n0; include beam ends and cross-frames where applicable. BRSDM targets RF\n≥ 1.10 for CT-TLC on new and major rehabilitation projects.<\/p><\/li>\n<li><p>If short, specify conditions: equipment spacing, one piece of\nheavy equipment per span, travel path over girder lines, reduced hopper\nload, crossing the bridge empty, steel plates, or an alternate\nMTV.<\/p><\/li>\n<li><p>Coordinate with the District and Standard Specification 1.07.05\nLoad Restrictions; document the acceptance conditions in the submittal\nresponse.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> Who owns the calculation — the\ncontractor or the designer? (Answer: the contractor submits the\nequipment data and working drawings; the designer or the LRS reviews\nagainst the rating and contract load restrictions; any approval is\nconditional and documented.)<\/p>\n", "num": "CN 1.4", "home": ["con", "submittals"], "old": "N2"}, {"id": "u144", "title": "When would you simplify a curved deck on straight girders?", "kind": "qa", "html": "\n<p><strong>Recommended response<\/strong><\/p>\n<p>When the geometric effect is too small to change the rating. The edge\noffset is about L²/8R — for a 40-ft span at a 2,500-ft radius it is\nabout an inch. Below that, a conservative simplification such as using\nthe maximum overhang captures the effect at far less modeling effort. It\nremains a case-by-case decision with LRS concurrence.<\/p>\n", "num": "LR 5.13", "home": ["lr", "steel"], "old": "N8"}, {"id": "u145", "title": "On a major rehabilitation, the design inventory rating with the new deck is 1.14. What now?", "kind": "qa", "html": "\n<p><strong>Recommended response<\/strong><\/p>\n<p>For a major structure rehabilitation, CTDOT’s minimum design\ninventory RF is 1.20. A result between 1.00 and 1.20 requires either\nstrengthening or a bridge design variance; below 1.00 requires a design\nexception. We would identify the controlling member and limit state,\nevaluate practical strengthening or dead-load reductions, and bring the\noptions to the CTDOT project manager before requesting a variance.<\/p>\n<p><strong>Key points<\/strong><\/p>\n<ul>\n<li><p>The BRSDM uses this exact case as its example.<\/p><\/li>\n<li><p>The target applies to Strength, Service, and Fatigue.<\/p><\/li>\n<li><p>Design inventory cannot be used to show the controlling “design\nloading structural capacity” criterion is met; that is a design check to\nthe BDS.<\/p><\/li>\n<\/ul>\n", "num": "LR 7.6", "home": ["lr", "ctdot"], "old": "N9"}, {"id": "u146", "title": "What proof calculations do you provide with an approved-software rating?", "kind": "qa", "html": "\n<p><strong>Recommended response<\/strong><\/p>\n<p>Enough for the LRS to verify the model without re-running it. BLRM\n12.2.6 requires calculations for anything not done by the rating\nprogram, and full sample calculations for every Excel equation type and\nfunction. For BrR or refined models, we provide hand checks of dead\nload, distribution, and at least the governing section capacity and\nrating factor using software forces.<\/p>\n", "num": "LR 4.9", "home": ["lr", "qa"], "old": "N10"}, {"id": "u147", "title": "Who reviews the load rating for a temporary bridge?", "kind": "qa", "html": "\n<p><strong>Recommended response<\/strong><\/p>\n<p>Under the BRSDM, the temporary bridge rating package is part of the\ncontractor’s working drawings. The project’s structural designer reviews\nit; the LRS does not. After review, the designer emails the LRS with the\nsubject “Temporary Bridge Working Drawing Review Completed” and a link.\nAll vehicle classes apply, but design inventory is not required for\nservice under three years, and CT-TLC is not required if the bridge will\nnot see paving loads. Minimum RF is 1.00.<\/p>\n", "num": "LR 7.7", "home": ["lr", "ctdot"], "old": "N11"}, {"id": "u148", "title": "How are emergency vehicles rated in Connecticut?", "kind": "qa", "html": "\n<p><strong>Recommended response<\/strong><\/p>\n<p>Type EV2 and EV3 are rated for all structures using the legal\nprocedure with γLL = 1.30 for all strength limit states. In refined\nanalysis, one EV occupies one lane with legal vehicles in the other\nlanes; lane load applies for long spans, negative moment, and interior\nreactions; striped lanes are not used. Report single-axle or tandem tons\nand gross tons.<\/p>\n", "num": "LR 2.6", "home": ["lr", "legal"], "old": "N15"}, {"id": "u149", "title": "Would you recommend reducing CTDOT’s rating vehicles in line with FHWA’s standardization guidance?", "kind": "qa", "html": "\n<p><strong>Recommended response<\/strong><\/p>\n<p>No. CTDOT has said it values its current vehicles for comparative\nreviews and does not plan to reduce them. We would run the full CTDOT\nset and use our experience with other states’ vehicles only to inform,\nnot replace, it.<\/p>\n", "num": "LR 2.7", "home": ["lr", "legal"], "old": "N17"}, {"id": "u150", "title": "Could this contract include railroad bridges?", "kind": "qa", "html": "\n<p><strong>Recommended response<\/strong><\/p>\n<p>Possibly. Railroad bridge ratings are not currently handled by the\nLRS or covered by the BLRM, and CTDOT has been discussing how rail\nratings will be handled. HDR rates rail bridges for the MBTA under AREMA\nand the MBE and reviews Amtrak-impacting designs, so we can support\nwhatever approach CTDOT sets.<\/p>\n", "num": "LR 8.3", "home": ["lr", "other"], "old": "N18"}, {"id": "u151", "title": "How do PCI, ACI, ASTM, and AISC documents factor into your work?", "kind": "qa", "html": "\n<p>See the <a class=\"xref\" href=\"#de/codes/u131\" title=\"§18 · Familiarity with Codes, Standards, Manuals, and Specifications\">DE 8.2<\/a> addition. Lead with the example that CTDOT accepts\nPCI Northeast guidance for NEXT beam distribution but does not accept\nPCI prestress-loss methods in ratings.<\/p>\n", "num": "DE 8.1", "home": ["de", "codes"], "old": "N19"}, {"id": "u152", "title": "What would you do in the first 30 days of this contract?", "kind": "qa", "html": "\n<p><strong>Recommended response<\/strong><\/p>\n<p>Set up the controls that make every task order consistent.<\/p>\n<p><strong>Key points<\/strong><\/p>\n<ul>\n<li><p>Kickoff with the LRS and Bridge Design: current manual status,\npending revisions, accepted BrR version (7.6.1) and templates, common\ncomment list, and communication protocol for low ratings.<\/p><\/li>\n<li><p>Governing-criteria matrix (BRSDM, BLRM, directives, DPDM, AASHTO\neditions).<\/p><\/li>\n<li><p>Submit the QA/QC plan (BLRM 14.1 allows CTDOT to request it) and\nset up QC and QA reviewers with Connecticut PE certification.<\/p><\/li>\n<li><p>Software environment: BrR 7.6.1, MIDAS 2025, LARSA 2024.R,\ncurrent CT programs (including CT-Steel vB3.14), and CTDOT vehicle\nlibraries.<\/p><\/li>\n<li><p>Staffing forecast with named backups; task-order tracking\nlog.<\/p><\/li>\n<\/ul>\n", "num": "PM 3.4", "home": ["pm", "delivery"], "old": "N20"}, {"id": "u153", "title": "How does rating practice in Connecticut differ from other New England states where you have worked?", "kind": "qa", "html": "\n<p><strong>Recommended response<\/strong><\/p>\n<p>Answer with what is specific to Connecticut rather than\ncharacterizing other agencies.<\/p>\n<p><strong>Key points<\/strong><\/p>\n<ul>\n<li><p>LRFR only, with the full CTDOT legal, SHV, permit, EV, and CT-TLC\nfleet; notional vehicles cannot substitute.<\/p><\/li>\n<li><p>CTDOT-specific rules: condition-factor bonus for measured loss,\nsystem-factor modifications, ADTT 55% rule, 0.200 klf lane load with the\n75% CT-L3S2 pair, no reduction of IM, striped lanes only on\ndirection.<\/p><\/li>\n<li><p>BrR-first with CTDOT templates and User Guide; approval for any\nother software; accepted version controls.<\/p><\/li>\n<li><p>Strict package format, Connecticut PE digital certification, QA\nchecklist.<\/p><\/li>\n<\/ul>\n", "num": "LR 7.8", "home": ["lr", "ctdot"], "old": "N22"}, {"id": "u154", "title": "Proposal Consistency Check and Likely Probes", "kind": "ref", "html": "\n<p>Panels read the CSO 255 closely. The items below are inconsistencies\nor gaps a panelist could raise. The goal is to have a calm, accurate\nanswer ready, not to volunteer problems.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Item<\/th>\n<th>What the proposal says<\/th>\n<th>Why it may come up<\/th>\n<th>Prepared answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mario’s CTDOT rating experience<\/td>\n<td>Cover letter: Mario led “multiple load rating assignments for CTDOT\nand MassDOT.” Resume: no named CTDOT rating project.<\/td>\n<td>A panelist may ask for the CTDOT examples.<\/td>\n<td>Name the specific CTDOT structures if you have them. If your CTDOT\nwork has been design and QC, say so plainly and pivot to MassDOT and\nMBTA rating leadership plus your working knowledge of the BLRM. Do not\nstretch.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>John McKenna’s tenure<\/td>\n<td>Firm tenure under one year; key CTDOT experience (Gold Star,\nStratford Ave, Niantic, local bridges) is pre-HDR.<\/td>\n<td>Continuity and internal support questions (<a class=\"xref\" href=\"#pm/staffing/u36\" title=\"Q27 · John McKenna is relatively new to HDR. How will you ensure continuity and internal support?\">PM 2.3<\/a>).<\/td>\n<td>John brings direct CTDOT experience; Mario provides established HDR\ndelivery continuity; Scott Hill (former CTDOT Chief Engineer)\noversees.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>John’s resume text<\/td>\n<td>The Tracy Road (05413) and Woodchuck Hill Road (04600) entries\nrepeat the Long Hill Road/Hop River description.<\/td>\n<td>Minor, but a detail-oriented panelist may notice.<\/td>\n<td>Know the correct crossings; acknowledge a copy error if raised.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Who is PM on the current CTDOT task order<\/td>\n<td>Section D lists June Wu, Kris Kretsch, and John McKenna as project\nmanagers; both John’s and Kris’s resumes claim PM for Bridges 06975,\n07130, 06039.<\/td>\n<td>“Who actually manages that work?”<\/td>\n<td>Agree internally on each person’s actual role before the\ninterview.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>QA/QC Manager licensure<\/td>\n<td>June Wu, QA/QC Manager: registrations shown as PE MA, NH.<\/td>\n<td>BLRM 12.2.1 requires digital certification by a Connecticut PE.<\/td>\n<td>Explain that ratings are certified by a Connecticut PE (identify\nwho), and that QA under BLRM 14 is an independent review role.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Brian Winger<\/td>\n<td>Listed as PE, SE; registrations shown as PE CT, IL; 13 years in\nSection A vs. 14 in resume.<\/td>\n<td>Minor.<\/td>\n<td>Use consistent numbers.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Commodore Hull dates<\/td>\n<td>Project duration 01/2022–01/2025, but the emergency declaration was\nMay 30, 2025, with six months to complete.<\/td>\n<td>Timeline doesn’t reconcile.<\/td>\n<td>Know the actual sequence. This is a CHA project; describe HDR’s\nfuture role accurately and let Brian speak to it.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ENR ranking<\/td>\n<td>“ENR’s #1-ranked Bridge Design Firm” (table of contents page)\nvs. “top 4” (Section C).<\/td>\n<td>Contradiction in the same document.<\/td>\n<td>Use one verified figure or avoid rankings.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>MassDOT statewide ratings<\/td>\n<td>Section D: 27 bridges (Contract 55051) + 7 (97536). Mario’s resume:\n17 assignments, 30 bridges.<\/td>\n<td>Numbers don’t match.<\/td>\n<td>Reconcile before the interview; quote one number.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CLE key personnel<\/td>\n<td>Lists “Mike Cooley, PE, Chief Bridge Engineer” (likely Mike\nCulmo).<\/td>\n<td>Minor error.<\/td>\n<td>Refer to Mike Culmo correctly.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sign and traffic structures<\/td>\n<td>Solicitation criterion 2a includes traffic control structures; two\nprior-round questions were about signs. No sign project or lead is\nnamed.<\/td>\n<td>Likely a direct question.<\/td>\n<td>Name the HDR or CHA staff member with sign-structure experience and\none example; use the CTDOT specifics in Sections 12 and 17.5.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>OpenBridge Modeler<\/td>\n<td>“Local expertise” claimed; no practitioner named.<\/td>\n<td>Criterion 2d (5%).<\/td>\n<td>Name the practitioner, the project, and one deliverable.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CTDOT vehicle and tool familiarity<\/td>\n<td>Proposal claims familiarity with CT legal and permit vehicles, state\nlive load factors, and the “Excel-supported macro developed by\nCTDOT.”<\/td>\n<td>Easy test question.<\/td>\n<td>Know the vehicle list (<a class=\"xref\" href=\"#lr/legal/u126\" title=\"§17.2 · CTDOT Rating Vehicles\">LR 2.9<\/a>) and the CT tools: CT-LoadFactor,\nCT-BeamEnd, CT-BrRResults, CT-Fill, CT-MPipe, CT-Steel, CT-LR\nReview.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Prime vs. subconsultant<\/td>\n<td>CHA’s Section I responsibility: “Strain gauge testing and Load\nRating”; CHA also has the strongest CTDOT complex-rating example.<\/td>\n<td>“Where does HDR’s own capability sit?”<\/td>\n<td>HDR leads and performs the majority; CHA brings defined specialty\ndepth (instrumentation, complex gusset/truss analysis).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Submission dates<\/td>\n<td>Solicitation due date July 22, 2026; cover letter dated July 30 and\nCSO 255 dated July 27.<\/td>\n<td>Unlikely to be raised; HDR was shortlisted.<\/td>\n<td>Don’t raise it. If asked, confirm the actual submission date and any\naddendum.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ACEC participation<\/td>\n<td>Not in the proposal.<\/td>\n<td>A strength to use.<\/td>\n<td>Peter Wu has participated in CTDOT/ACEC load rating subcommittee\nmeetings.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>v3 addition — candidate answer to the first probe (CTDOT\nrating experience):<\/strong> the Practice Session 1 story about the\nCTDOT steel tub girder design rating (story card under <a class=\"xref\" href=\"#pq/full/u84\" title=\"Prior Q4 · Unexpected or low load-rating results\">PQ 2.4<\/a>) is a\nnamed CTDOT rating example with a low result, CTDOT coordination, and a\nrefined analysis. Once the project name, year, and final rating factor\nare confirmed, it is the strongest answer to “which CTDOT ratings have\nyou led?”<\/p>\n", "num": "IS 4.3", "home": ["strat", "probes"], "old": "§22"}, {"id": "u155", "title": "Mario LoCoco — Personal Answer Bank", "kind": "ref", "html": "\n<p>These drafts use only facts from the proposal. Fill in the bracketed\ndetails and rehearse them aloud; aim for 60–90 seconds each.<\/p>\n", "num": "PM 4.3", "home": ["pm", "you"], "old": "§23"}, {"id": "u156", "title": "Tell us about yourself (60 seconds)", "kind": "ref", "html": "\n<p>“I’m Mario LoCoco, a Senior Bridge Engineer in HDR’s New England\nbridge group. I’ve spent 15 years in bridge engineering — design,\nrehabilitation, load rating, and inspection — and I’m licensed as a PE\nin Connecticut, Massachusetts, Rhode Island, New Hampshire, and Maine,\nand as an SE in Massachusetts. On the rating side I’ve managed and\nperformed load ratings under MassDOT’s statewide contracts, including\nsteel, prestressed, slab, culvert, and masonry arch structures, and I\nmanaged the MBTA tunnel load rating work, where the Harvard Busway\ntunnel needed a 3D finite element model to capture load distribution. On\nthe design side I’m the lead structural engineer for CTDOT’s Waterbury\nBranch Line platform replacements, which are in construction now, so I’m\nhandling the RFIs and shop drawings. On this contract I’d support John\nas Deputy PM and lead the bridge and load rating work day to day.”<\/p>\n", "num": "PM 4.4", "home": ["pm", "you"], "old": "§23"}, {"id": "u157", "title": "Why you as Deputy PM and Bridge/Structural Lead?", "kind": "ref", "html": "\n<ul>\n<li><p>I work both sides of the contract: design through construction\nand load rating, and I know they depend on each other (As-Proposed at\n90%, As-Constructed after construction).<\/p><\/li>\n<li><p>I do QC on HDR’s current CTDOT task-order bridges, so I already\nwork to CTDOT’s standards and submission process.<\/p><\/li>\n<li><p>I’m local to HDR’s New England group and can coordinate staff and\nspecialists across HDR and CHA.<\/p><\/li>\n<\/ul>\n", "num": "PM 4.5", "home": ["pm", "you"], "old": "§23"}, {"id": "u158", "title": "Prepared stories (Situation – Risk – Action – Result – Application)", "kind": "ref", "html": "\n<p><strong>1. Summer Street Bridge separation (Massport) — construction\nstaging and rating<\/strong><\/p>\n<ul>\n<li><p>Situation: a new hotel required shortening nine prestressed box\nbeams of an existing bridge.<\/p><\/li>\n<li><p>Risk: partial demolition and cutting transverse post-tensioning\nbetween shortened and full-length beams could leave unstable\nintermediate conditions.<\/p><\/li>\n<li><p>Action: I did the structural analysis and design of the\nseparation, analyzed each construction stage, stayed involved through\nconstruction, and load rated the separated structure afterward.<\/p><\/li>\n<li><p>Result: [confirm outcome, schedule, any field issues\nresolved].<\/p><\/li>\n<li><p>Application: same discipline applies to CTDOT staged\nrehabilitations and to the As-Constructed rating.<\/p><\/li>\n<\/ul>\n<p><strong>2. Roosevelt Circle over I-93 (MassDOT/Cora) — emergency\nresponse<\/strong><\/p>\n<ul>\n<li><p>Situation: a vehicle strike damaged the bridge; two of four I-93\nlanes were closed.<\/p><\/li>\n<li><p>Action: I provided round-the-clock on-site engineering on\nrotating 12-hour shifts to guide safe, expedited partial\ndemolition.<\/p><\/li>\n<li><p>Result: demolition was completed in 4 days and I-93 fully\nreopened.<\/p><\/li>\n<li><p>Application: CTDOT emergency assignments — fast, safe decisions\nin the field with clear communication.<\/p><\/li>\n<\/ul>\n<p><strong>3. MBTA Harvard Busway tunnel — complex rating with 3D\nFEM<\/strong><\/p>\n<ul>\n<li><p>Situation: complex framing geometry with many components (roof\nslabs and girders, roadway slab, columns, invert, liners) rated for\nlegal and permit loads at the roadway above, per the FHWA tunnel load\nrating guide.<\/p><\/li>\n<li><p>Action: [describe model, validation checks, controlling\nmember].<\/p><\/li>\n<li><p>Result: [ratings and recommendations].<\/p><\/li>\n<li><p>Application: the validation approach for <a class=\"xref\" href=\"#pq/full/u85\" title=\"Prior Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a> and the\nrepeatability answer in <a class=\"xref\" href=\"#lr/qa/u75\" title=\"Q64 · What makes a load-rating package reproducible, repeatable, and acceptable on first submission?\">LR 4.6<\/a>.<\/p><\/li>\n<\/ul>\n<p><strong>4. Waterbury Branch Line platforms (CTDOT) — DSDC and\nsubmittals<\/strong><\/p>\n<ul>\n<li><p>Situation: FRP plank on steel girder platforms at five stations;\nnow in construction.<\/p><\/li>\n<li><p>Action: I lead structural design and now handle RFIs, shop\ndrawings, and DSDC coordination.<\/p><\/li>\n<li><p>Result: [example of an RFI or submittal you resolved].<\/p><\/li>\n<li><p>Application: criterion 2e (submittal review) with a current CTDOT\nexample.<\/p><\/li>\n<\/ul>\n<p><strong>5. Independent peer reviews — Rio Salado Pedestrian Bridge\nand Amtrak<\/strong><\/p>\n<ul>\n<li><p>Rio Salado: independent review of aerodynamic stability and\npedestrian-induced vibration studies (damping, Strouhal assumptions,\nflutter and vortex shedding, lateral lock-in, tuned mass dampers)\nagainst AASHTO, SETRA, and JRC criteria.<\/p><\/li>\n<li><p>Amtrak: reviewed bridge packages affecting Amtrak’s right-of-way\nagainst AASHTO, RIDOT, AREMA, and Amtrak standards.<\/p><\/li>\n<li><p>Application: reviewing ratings and designs by others\n(<a class=\"xref\" href=\"#lr/qa/u16\" title=\"Q7 · How will you review load ratings prepared by others — including one you are asked to update, or one that looks wrong?\">LR 4.4<\/a>).<\/p><\/li>\n<\/ul>\n<p><strong>6. CTDOT rating example — [fill in]<\/strong><\/p>\n<p>If you have led CTDOT ratings, prepare one here: structure number,\ntype, controlling member and limit state, BrR or refined, any low result\nand how it was communicated. This is the most likely probe (<a class=\"xref\" href=\"#strat/probes/u154\" title=\"§22 · Proposal Consistency Check and Likely Probes\">IS 4.3<\/a>).<\/p>\n<p><strong>Candidate for story 6 (from Practice Session 1; full card\nunder <a class=\"xref\" href=\"#pq/full/u84\" title=\"Prior Q4 · Unexpected or low load-rating results\">PQ 2.4<\/a>): CTDOT steel tub girder design rating<\/strong><\/p>\n<ul>\n<li><p>Situation: a CTDOT design rating gave an unusually low result for\na steel tub girder near the point of contraflexure.<\/p><\/li>\n<li><p>Risk: the thin bottom flange, sized for positive-moment tension,\nsaw enough live-load negative moment to exceed its low compression\nbuckling strength.<\/p><\/li>\n<li><p>Action: confirmed the mechanism, consulted CTDOT, agreed a\nrefined-analysis plan, and ran a 3D plate model with splice plates and\nstiffeners and a nonlinear buckling analysis of the flange.<\/p><\/li>\n<li><p>Result: the stiffening from adjacent components was real and\nraised the rating to just above 1.0. [Confirm project name, year, final\nRF.]<\/p><\/li>\n<li><p>Application: <a class=\"xref\" href=\"#pq/full/u84\" title=\"Prior Q4 · Unexpected or low load-rating results\">PQ 2.4<\/a>, <a class=\"xref\" href=\"#lr/qa/u16\" title=\"Q7 · How will you review load ratings prepared by others — including one you are asked to update, or one that looks wrong?\">LR 4.4<\/a>, <a class=\"xref\" href=\"#lr/low/u27\" title=\"Q18 · A low rating is driven by incomplete documentation or a conservative assumption. How do you proceed?\">LR 3.4<\/a>, and the <a class=\"xref\" href=\"#strat/probes/u154\" title=\"§22 · Proposal Consistency Check and Likely Probes\">IS 4.3<\/a>\nCTDOT-experience probe; the answer to “isn’t that refining until you get\nthe answer you want?” is under <a class=\"xref\" href=\"#pq/full/u84\" title=\"Prior Q4 · Unexpected or low load-rating results\">PQ 2.4<\/a>.<\/p><\/li>\n<\/ul>\n", "num": "PM 4.6", "home": ["pm", "you"], "old": "§23"}, {"id": "u159", "title": "Short answers to have ready", "kind": "ref", "html": "\n<ul>\n<li><p><strong>BrR version:<\/strong> “CTDOT is on 7.6.1; we confirm at\nkickoff and don’t submit in newer versions.”<\/p><\/li>\n<li><p><strong>Low rating found on Friday afternoon:<\/strong> “If it’s a\nsafety concern, I call the LRS that day. Otherwise I verify with an\nindependent check first, then notify at submission as the BLRM requires,\nand contact the LRS before any refinement.”<\/p><\/li>\n<li><p><strong>Why HDR over CHA’s own team?<\/strong> “HDR leads and\nperforms the majority; CHA adds defined specialty depth. CTDOT gets one\naccountable team.”<\/p><\/li>\n<\/ul>\n", "num": "PM 4.7", "home": ["pm", "you"], "old": "§23"}, {"id": "u160", "title": "Speaker Assignment Matrix", "kind": "ref", "html": "\n<p>Confirm who will attend the interview and adjust. Keep each answer to\none lead speaker, with at most one support speaker adding a single\npoint.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Topic<\/th>\n<th>Lead<\/th>\n<th>Support<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Why HDR; management approach; availability<\/td>\n<td>John McKenna<\/td>\n<td>Scott Hill<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Concurrent task orders; staffing; continuity<\/td>\n<td>John McKenna<\/td>\n<td>Mario LoCoco<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Load rating process; low ratings; refinement<\/td>\n<td>Mario LoCoco<\/td>\n<td>Brian Winger (CHA)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Complex FEM validation; gussets; trusses<\/td>\n<td>Brian Winger<\/td>\n<td>Suthichai Saelim<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Instrumentation and strain gauging<\/td>\n<td>Kevin Zmetra (CHA) or Brian Winger<\/td>\n<td>Suthichai Saelim<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bridge design, ABC, durability (<a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a>)<\/td>\n<td>Kris Kretsch or June Wu<\/td>\n<td>Mario LoCoco<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sign and traffic structures (Prior Q2–Q3)<\/td>\n<td>[Name the sign-structure lead]<\/td>\n<td>Mario LoCoco<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>QA/QC<\/td>\n<td>June Wu<\/td>\n<td>Mario LoCoco<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DSDC and contractor submittals<\/td>\n<td>Michael Grandelski<\/td>\n<td>Mario LoCoco<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Codes and standards<\/td>\n<td>Mario LoCoco<\/td>\n<td>Peter Wu / Tony Ream (by reference)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>OpenBridge and digital delivery<\/td>\n<td>[Name the practitioner]<\/td>\n<td>John McKenna<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CTDOT policy and processes<\/td>\n<td>John McKenna<\/td>\n<td>Scott Hill<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>v3 note from Practice Session 1 (<a class=\"xref\" href=\"#strat/delivery/u166\" title=\"§26.1 · Delivery and Format Notes\">IS 1.5<\/a>):<\/strong> in the mock,\nMario took both bridge rating and bridge design questions, including\n<a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a> with his own examples (link slabs, GFRP ties, stainless-clad\nbars, UHPC overlays), while the PM took <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a> (now merged into <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a>) and\n<a class=\"xref\" href=\"#pm/staffing/u36\" title=\"Q27 · John McKenna is relatively new to HDR. How will you ensure continuity and internal support?\">PM 2.3<\/a>. The table above still shows Kris Kretsch or June Wu leading <a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a>. Decide which applies and tell the team; the table has not been\nchanged.<\/p>\n", "num": "IS 4.4", "home": ["strat", "probes"], "old": "§24"}, {"id": "u161", "title": "Verify before the interview", "kind": "ref", "html": "\n<ul>\n<li><p>Who from HDR and CHA is attending, and the speaker for each topic\n(<a class=\"xref\" href=\"#strat/probes/u160\" title=\"§24 · Speaker Assignment Matrix\">IS 4.4<\/a>).<\/p><\/li>\n<li><p>The sign-structure lead and example, the OpenBridge practitioner,\nand your own CTDOT rating examples.<\/p><\/li>\n<li><p>Reconciled numbers: bridge counts, years of experience, ENR\nranking, Commodore Hull timeline.<\/p><\/li>\n<li><p>Current CTDOT Load Rating page (manual version, software\nversions) the day before.<\/p><\/li>\n<li><p>Any engineering directives or bulletins affecting load rating or\nthe BRSDM since June 2026.<\/p><\/li>\n<li><p>From Practice Session 1 (<a class=\"xref\" href=\"#vf/verify/u167\" title=\"§26.2 · Items to Verify Before the Interview (Added This Session)\">VN 1.2<\/a>): tub girder project name, year,\nand final RF; stainless-steel-clad reinforcement product name and\napproval status; the MassDOT beam-end research reference if you will\ncite it; what BrR 7.6.1 supports in refined analysis.<\/p><\/li>\n<li><p>Time two or three full answers with a stopwatch: three to five\nminutes, with the example story in its own shape (<a class=\"xref\" href=\"#strat/delivery/u166\" title=\"§26.1 · Delivery and Format Notes\">IS 1.5<\/a>).<\/p><\/li>\n<\/ul>\n<p><strong>Added in v6 — technical items from the talking points\n(<a class=\"xref\" href=\"#vf/about/u169\" title=\"§27 · Mock Interview Talking Points by Topic (Practice Sessions 2–5, September 29 – October 1, 2026)\">VN 4.18<\/a>):<\/strong><\/p>\n<ul>\n<li>Scope of CTDOT’s galvanized reinforcing requirement (current\nStandard Specs / Bridge Design Manual) (<a class=\"xref\" href=\"#de/concrete/u182\" title=\"§27.12 · Materials and corrosion protection\">DE 3.1<\/a>).<\/li>\n<li>LRFD 2.5.2.7.1 exact language and stated rationale for exterior\ngirder capacity (<a class=\"xref\" href=\"#rh/joints/u185\" title=\"§27.15 · Bridge widening\">RH 3.3<\/a>).<\/li>\n<li>Exact MBE permit load factor values and GVW/ADTT breakpoints in\nTable 6A.4.5.4.2a-1 (<a class=\"xref\" href=\"#lr/legal/u173\" title=\"§27.3 · Permit loads\">LR 2.2<\/a>, <a class=\"xref\" href=\"#lr/fund/u200\" title=\"§27.30 · Rating limit states by material\">LR 1.1<\/a>).<\/li>\n<li>Sign support spec fatigue importance category names and which\napplies to an overhead VMS (<a class=\"xref\" href=\"#de/signs/u188\" title=\"§27.18 · Sign and ancillary structures\">DE 6.1<\/a>).<\/li>\n<li>The 1.2 × bankfull width hydraulic criterion as CTDOT practice\nvs. general guidance (<a class=\"xref\" href=\"#de/super/u179\" title=\"§27.9 · Superstructure replacement and ABC\">DE 1.1<\/a>, <a class=\"xref\" href=\"#de/culverts/u198\" title=\"§27.28 · Culvert replacement and stream simulation\">DE 7.1<\/a>).<\/li>\n<li>25 ft pier protection trigger under current AREMA (<a class=\"xref\" href=\"#de/rail/u180\" title=\"§27.10 · Work over active railroads\">DE 5.1<\/a>).<\/li>\n<li>High-early closure pour strength timing (about 3,000 psi in 12–16\nhr) against CTDOT mix specs (<a class=\"xref\" href=\"#rh/joints/u181\" title=\"§27.11 · Staged deck replacement and closure pours\">RH 3.1<\/a>).<\/li>\n<li>CTDOT Load Rating Manual Section 6 — fatigue evaluation triggers and\ncurrent section numbering (<a class=\"xref\" href=\"#lr/steel/u176\" title=\"§27.6 · Steel fatigue and distortion-induced cracking\">LR 5.1<\/a>, <a class=\"xref\" href=\"#lr/fund/u200\" title=\"§27.30 · Rating limit states by material\">LR 1.1<\/a>, <a class=\"xref\" href=\"#lr/steel/u215\" title=\"§27.46 · Fatigue evaluation — the full sequence (walked through 10/1)\">LR 5.6<\/a>).<\/li>\n<li>MBE default yield values by year of construction for unknown steel\n(A7 / A373 era) — confirm the table and values (<a class=\"xref\" href=\"#lr/steel/u210\" title=\"§27.41 · Rating a 1955 riveted built-up bridge with no rating on file (practiced 10/1)\">LR 5.4<\/a>).<\/li>\n<li>MBE limiting ADTT values by detail category vs. LRFD Table\n6.6.1.2.3-2 — confirm current numbers in both (<a class=\"xref\" href=\"#lr/steel/u215\" title=\"§27.46 · Fatigue evaluation — the full sequence (walked through 10/1)\">LR 5.6<\/a>).<\/li>\n<li>Which edition of the MBE CTDOT is currently working to — 3rd with\ninterims vs. the 4th Edition released late September 2026 (<a class=\"xref\" href=\"#lr/ctdot/u216\" title=\"§27.47 · MBE 4th Edition — released late September 2026\">LR 7.1<\/a>).<\/li>\n<\/ul>\n<p><strong>Added in v6 — project facts (<a class=\"xref\" href=\"#pr/how/u218\" title=\"§28 · Project Evidence — Mario’s Project Stories\">PR 1.2<\/a>):<\/strong><\/p>\n<ul>\n<li>Niantic River Bridge: what the rehabilitation scope actually was\n(deck replacement? mechanical or architectural work on the movable\nspan?) — an easy follow-up question, so don’t fumble the setup to the\nbest story. This is also the “tub girder project” item above; confirm\nthe year and final RF.<\/li>\n<li>Summer Street: International Bridge Conference presentation year and\ncity (believed Pittsburgh, 2022).<\/li>\n<li>Powder Point: posting (believed 10-ton) before stating it to a\nrating panel.<\/li>\n<li>Bass River: span count (six or seven) and whether the existing\nsuperstructure is steel.<\/li>\n<\/ul>\n<p><strong>Added in v6 — codes beyond AASHTO (<a class=\"xref\" href=\"#pm/you/u217\" title=\"§27.48 · Codes beyond AASHTO — building codes and the SE (added October 3)\">PM 4.2<\/a>):<\/strong><\/p>\n<ul>\n<li>Current CT State Building Code edition and the IBC edition it\nadopts; confirm it governs the Waterbury stations.<\/li>\n<li>AISC 360 and AASHTO LRFD Section 6 resistance factors for flexure,\ncompression and shear.<\/li>\n<li>ACI 318 and AASHTO LRFD Section 5 shear φ values and methods.<\/li>\n<li>How to describe the SE status precisely (licensed in which state, or\nexam passed and licensure pending).<\/li>\n<\/ul>\n", "num": "VN 1.1", "home": ["vf", "verify"], "old": "§25"}, {"id": "u162", "title": "Numbers to know", "kind": "ref", "html": "\n<ul>\n<li><p>Weights: 30% design, 30% rating, 10% staff, 10% codes, 10% CTDOT\nstandards, 5% OpenBridge/FEM, 5% submittals.<\/p><\/li>\n<li><p>Contract: 5 years, about $6 million, one firm, Connecticut\noffice, PM available daily, prime performs the majority.<\/p><\/li>\n<li><p>BLRM 2018.1.0; BrR 7.6.1; MIDAS Civil 2025; LARSA 4D 2024.R;\nCT-Steel vB3.14.<\/p><\/li>\n<li><p>Minimum RF 1.20 (new, major rehab); CT-TLC 1.10; temporary\nbridges 1.00; notify if condition factor &lt; 0.95 (minor\nrehab).<\/p><\/li>\n<li><p>CT-TLC 279.6 k on 9 axles, IM = 0, one lane, single trip mixed\nwith traffic.<\/p><\/li>\n<li><p>EV2 57.5 k; EV3 86 k; γLL = 1.30.<\/p><\/li>\n<li><p>CT-L3S2 80 k; CT-L73.0 73 k; CT-P380 380 k; CT-P180 90 t; CT-P200\n100 t.<\/p><\/li>\n<li><p>Condition factor +0.05 for measured loss (max 1.00); cross-frame\nsystem factor 1.20 if no distress.<\/p><\/li>\n<li><p>ADTT = 55% of bidirectional; growth 0.75% urban, 1.50%\nrural.<\/p><\/li>\n<li><p>Wearing surface default 6 in. (10 in. buried on state routes);\n1.25 load factor only if field measured.<\/p><\/li>\n<li><p>Skew &gt; 30° or curved → refined analysis and cross-frame\nrating.<\/p><\/li>\n<li><p>Sign supports: 120 mph.<\/p><\/li>\n<li><p>Coupons: mean − 1.65σ.<\/p><\/li>\n<li><p>Curved deck check: L²/8R.<\/p><\/li>\n<\/ul>\n", "num": "VN 2.1", "home": ["vf", "numbers"], "old": "§25"}, {"id": "u163", "title": "Questions to ask the panel", "kind": "ref", "html": "\n<ul>\n<li><p>How does the Department expect the work to split between design\ntask orders and load rating assignments in the first year?<\/p><\/li>\n<li><p>Is the revised Load Rating Manual close to release, and are there\ninterim directions consultants should already follow, such as\ncross-frame reporting or culvert fill?<\/p><\/li>\n<li><p>For As-Constructed ratings, how would the Department like\nconsultants to coordinate as-built plans with District\nConstruction?<\/p><\/li>\n<\/ul>\n", "num": "VN 3.1", "home": ["vf", "close"], "old": "§25"}, {"id": "u164", "title": "Closing statement (30 seconds)", "kind": "ref", "html": "\n<p>“You’ll get a local team led by John and me that understands CTDOT’s\nprocess — As-Proposed ratings at 90%, the CT-TLC, accepted software\nversions — and that handles routine work efficiently while bringing real\ndepth, through HDR and CHA, to the complex structures. We’ll communicate\nearly on anything affecting safety, posting, cost, or schedule, and\nwe’ll hand you ratings the next engineer can reproduce.”<\/p>\n", "num": "VN 3.2", "home": ["vf", "close"], "old": "§25"}, {"id": "u165", "title": "Mock Interview Debrief: Practice Session 1 (September 28, 2026)", "kind": "ref", "html": "\n<p>This section was produced in a separate practice session and is\nmerged here verbatim except for renumbering (its original number was 20,\nwhich in this guide is the ACEC section), the <a class=\"xref\" href=\"#rh/decide/u30\" title=\"Q20 · How do you decide between rehabilitation and replacement? Does CTDOT have a defined process?\">RH 1.2<\/a> label, the <a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a>\nlabel, and the added “CTDOT check” notes.<\/p>\n<p><strong>v4 note:<\/strong> subsections 26.2 to 26.12 of the v3 debrief\n(question-specific additions, the unexpected-results scenario with the\ntub girder story, and drill question <a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a>) have been merged into the\nquestions they supplemented, so each question now carries its full\nanswer in one place: <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a>, <a class=\"xref\" href=\"#lr/ctdot/u13\" title=\"Q3 · What is your approach when CTDOT assigns a new load rating?\">LR 7.2<\/a>, <a class=\"xref\" href=\"#lr/software/u14\" title=\"Q5 · How do you determine whether to use BrR or a refined finite-element model, and when is refinement worth the cost?\">LR 9.1<\/a>, <a class=\"xref\" href=\"#lr/steel/u21\" title=\"Q11 · How do you account for deterioration and section loss — for example, on a deteriorated steel-girder bridge?\">LR 5.7<\/a>, <a class=\"xref\" href=\"#lr/low/u27\" title=\"Q18 · A low rating is driven by incomplete documentation or a conservative assumption. How do you proceed?\">LR 3.4<\/a>, <a class=\"xref\" href=\"#rh/decide/u30\" title=\"Q20 · How do you decide between rehabilitation and replacement? Does CTDOT have a defined process?\">RH 1.2<\/a>, <a class=\"xref\" href=\"#lr/steel/u71\" title=\"Q59 · Beam ends with section loss are driving the rating. How do you evaluate them?\">LR 5.11<\/a>, <a class=\"xref\" href=\"#lr/qa/u77\" title=\"Q66 · How would you explain a rating factor — or a low rating — to a nontechnical stakeholder?\">LR 4.8<\/a>, <a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a>,\n<a class=\"xref\" href=\"#pq/full/u84\" title=\"Prior Q4 · Unexpected or low load-rating results\">PQ 2.4<\/a>, and <a class=\"xref\" href=\"#pq/full/u85\" title=\"Prior Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a>. What remains here is the delivery guidance\n(<a class=\"xref\" href=\"#strat/delivery/u166\" title=\"§26.1 · Delivery and Format Notes\">IS 1.5<\/a>), the verification list (<a class=\"xref\" href=\"#vf/verify/u167\" title=\"§26.2 · Items to Verify Before the Interview (Added This Session)\">VN 1.2<\/a>), and the revision note (<a class=\"xref\" href=\"#vf/about/u168\" title=\"§26.3 · Revision Note\">VN 4.17<\/a>).\nWhere it says “Question N,” the numbers match this guide’s Q1–Q66.\nPointers to each subsection have been added under the related questions\nelsewhere in the guide.<\/p>\n<p>This section captures lessons from a spoken mock-interview session.\nIt is additive: nothing in Sections 1 through 19 has been removed or\nchanged. Each item below is keyed to the existing question number it\nsupplements. No content in the existing guide was found to be incorrect\nduring this session; where a spoken answer diverged from the guide (for\nexample, diagnostic versus proof testing), the guide was already correct\nand the note below reinforces it.<\/p>\n", "num": "VN 4.16", "home": ["vf", "about"], "old": "§26"}, {"id": "u166", "title": "Delivery and Format Notes", "kind": "ref", "html": "\n<ul>\n<li><p>Expected answer length for this interview is three to five\nminutes per question. The two-minute project story in “How to Use This\nGuide” still applies; it should sit inside the longer answer rather than\nreplace it.<\/p><\/li>\n<li><p>At three to five minutes, structure matters more than content\nvolume. Signpost the answer so the panel always knows where you are:\nfirst how we start, then how we analyze, then how we check, then an\nexample, then the benefit to CTDOT.<\/p><\/li>\n<li><p>Pace reference: interview speech runs roughly 130 words per\nminute, so three minutes is about 400 words and five minutes about 650\nwords. Rehearse with a stopwatch; the mock beam-end answer ran about 330\nwords (roughly two and a half minutes) and had room for the additions\nnoted below.<\/p><\/li>\n<li><p>Put the example story in its own shape (situation, what looked\nwrong, what was checked, what was found, what CTDOT decided, result). In\nthe mock session the process description consumed most of the time and\nthe example was rushed at the end.<\/p><\/li>\n<li><p>Listen for multipart questions. The prior-round innovation\nquestion has two halves (new bridge and rehabilitation); the\nrehabilitation half was missed in the mock answer. Repeat the parts back\nbriefly if needed.<\/p><\/li>\n<li><p>Speaker division confirmed in practice (see the <a class=\"xref\" href=\"#strat/probes/u160\" title=\"§24 · Speaker Assignment Matrix\">IS 4.4<\/a> note):\nMario takes bridge rating and bridge design questions; the PM takes\nstaffing, availability, and management questions (Questions 26 and 27).\nQuestion 28 (what Mario personally performs) is still Mario’s to answer\nand should stay rehearsed.<\/p><\/li>\n<li><p>When handing off to CHA or the PM, give your own substantive\npiece first, then hand over for additional depth. Lead with HDR’s own\nexperience (for example, UHPC overlays) before inviting CHA to\nexpand.<\/p><\/li>\n<\/ul>\n<p><strong>Phrases to avoid<\/strong><\/p>\n<ul>\n<li><p>“We keep them busy” and “that’s how we stay in business” (they\nconfirm the panel’s availability concern).<\/p><\/li>\n<li><p>“Engineering judgment is taken out” as a benefit of BrR. Reframe\nas consistency and reproducibility; judgment is what CTDOT is\nbuying.<\/p><\/li>\n<li><p>“We will default to MassDOT” where CTDOT criteria are missing.\nReframe: confirm CTDOT’s current rating aids and procedures first; offer\nfamiliarity with other agencies’ methods as a supplement if CTDOT wants\nit.<\/p><\/li>\n<li><p>Volunteering that AI is not yet ready for the field. Not asked,\nand it does not help.<\/p><\/li>\n<li><p>Predicting at what rating factor a bridge would fail, especially\nto a public audience.<\/p><\/li>\n<\/ul>\n", "num": "IS 1.5", "home": ["strat", "delivery"], "old": "§26.1"}, {"id": "u167", "title": "Items to Verify Before the Interview (Added This Session)", "kind": "ref", "html": "\n<ul>\n<li><p>What AASHTOWare BrR supports in refined analysis (3D FEM,\nstiffness-based distribution, trusses, gusset plates) under the current\nCTDOT BrR User Guide and approved version.<\/p><\/li>\n<li><p>CTDOT’s current beam-end rating procedure and rating\naids.<\/p><\/li>\n<li><p>The exact MassDOT beam-end research reference (agency report and\nuniversity) if it will be cited.<\/p><\/li>\n<li><p>Current CTDOT condition-factor provisions.<\/p><\/li>\n<li><p>Current name and scope of CTDOT’s\nrehabilitation-versus-replacement study document.<\/p><\/li>\n<li><p>Stainless-steel-clad reinforcement product name and approval\nstatus.<\/p><\/li>\n<li><p>CTDOT tub girder project details: project name, year, and final\nrating factor.<\/p><\/li>\n<\/ul>\n<p><strong>Status of these items after checking the project files\n(v3):<\/strong><\/p>\n<ul>\n<li><p>BrR refined analysis and reporting: BLRM 3.3.1 and 12.2.5.1\nsummarized under <a class=\"xref\" href=\"#lr/ctdot/u13\" title=\"Q3 · What is your approach when CTDOT assigns a new load rating?\">LR 7.2<\/a> and <a class=\"xref\" href=\"#lr/software/u14\" title=\"Q5 · How do you determine whether to use BrR or a refined finite-element model, and when is refinement worth the cost?\">LR 9.1<\/a>. Still confirm what BrR 7.6.1 itself supports\n(3D FEM, trusses, gussets) against the current CTDOT BrR User\nGuide.<\/p><\/li>\n<li><p>CTDOT beam-end procedure: resolved — BLRM 6.3.1 and CT-BeamEnd\n(<a class=\"xref\" href=\"#lr/steel/u71\" title=\"Q59 · Beam ends with section loss are driving the rating. How do you evaluate them?\">LR 5.11<\/a>).<\/p><\/li>\n<li><p>MassDOT beam-end research reference: still open.<\/p><\/li>\n<li><p>Condition-factor provisions: resolved — <a class=\"xref\" href=\"#lr/ctdot/u127\" title=\"§17.3 · Key BLRM Provisions for Quick Recall\">LR 7.17<\/a> (<a class=\"xref\" href=\"#lr/steel/u21\" title=\"Q11 · How do you account for deterioration and section loss — for example, on a deteriorated steel-girder bridge?\">LR 5.7<\/a> and\n<a class=\"xref\" href=\"#lr/fund/u60\" title=\"Q38 · Explain the LRFR rating-factor equation and the role of the condition and system factors.\">LR 1.5<\/a>).<\/p><\/li>\n<li><p>Rehabilitation study document: resolved — BRSDM Bridge\nRehabilitation Study and RSR (<a class=\"xref\" href=\"#rh/decide/u30\" title=\"Q20 · How do you decide between rehabilitation and replacement? Does CTDOT have a defined process?\">RH 1.2<\/a>).<\/p><\/li>\n<li><p>Stainless-steel-clad reinforcement product name and approval\nstatus: still open.<\/p><\/li>\n<li><p>CTDOT tub girder project details: still open, and now high\npriority because this story answers the <a class=\"xref\" href=\"#strat/probes/u154\" title=\"§22 · Proposal Consistency Check and Likely Probes\">IS 4.3<\/a> CTDOT\nrating-experience probe.<\/p><\/li>\n<\/ul>\n", "num": "VN 1.2", "home": ["vf", "verify"], "old": "§26.2"}, {"id": "u168", "title": "Revision Note", "kind": "ref", "html": "\n<ul>\n<li>Revision date: September 28, 2026. Added <a class=\"xref\" href=\"#lr/ctdot/u140\" title=\"§20 · Current CTDOT Load Rating Issues — ACEC Liaison Meetings, 2022–2025\">LR 7.19<\/a> from Practice\nSession 1 (<a class=\"xref\" href=\"#vf/about/u165\" title=\"§26 · Mock Interview Debrief: Practice Session 1 (September 28, 2026)\">VN 4.16<\/a> in Master v3). No existing content was deleted,\ncondensed, or reworded, consistent with Section 19. No existing guide\ncontent was established to be incorrect.<\/li>\n<\/ul>\n", "num": "VN 4.17", "home": ["vf", "about"], "old": "§26.3"}, {"id": "u169", "title": "Mock Interview Talking Points by Topic (Practice Sessions 2–5, September 29 – October 1, 2026)", "kind": "ref", "html": "\n<p>New in v6. Merged from the talking-points Claude Doc built during the\nvoice mock interviews after v5. Subsection numbers match the doc (27.N\nhere = Section N there) so notes cross-reference cleanly; 27.37 is\nabsent because the project write-ups are now Section 28. Where a topic\nalso appears in Sections 1–26, this section adds the coaching layer —\nwhat to say first, the traps, and the corrections made in session —\nrather than replacing the existing answer.<\/p>\n", "num": "VN 4.18", "home": ["vf", "about"], "old": "§27"}, {"id": "u170", "title": "How to use this section, and habits that win every answer", "kind": "tp", "html": "\n<p>Talking points from the voice mock interviews (September 29 – October\n1, 2026), grouped by topic. Each section lists what to say, the keywords\nto land, and the traps flagged in coaching.<\/p>\n<ul>\n<li><strong>Lead with the stopping rule / the decision.<\/strong> Frame\nanswers around what would change the decision, not a list of\ntechniques.<\/li>\n<li><strong>Notify first, analyze second.<\/strong> Anything that looks\nlike a safety issue goes to CTDOT in writing the same day, before\nanalysis starts.<\/li>\n<li><strong>Name the root cause.<\/strong> Leaking joint, failed shear\nkey, drainage, scour. A repair that ignores the cause inherits the same\ndeterioration rate.<\/li>\n<li><strong>Check what governs before refining.<\/strong> Refined\ndistribution does nothing if shear at a corroded beam end controls.<\/li>\n<li><strong>Question the premise.<\/strong> Reuse of an existing\nsubstructure, abutment geometry, and hydraulic adequacy are never\nassumed.<\/li>\n<li><strong>Top-down structure.<\/strong> Superstructure, then\nsubstructure, then constructability, then permitting and maintenance of\ntraffic. Finish the list you set up.<\/li>\n<li><strong>Precise language.<\/strong> “Doesn’t meet the required\nreliability margin under current assumptions” rather than “unsafe.” QC =\nproducer checks own work; QA = verifying the process worked.<\/li>\n<li><strong>Bring in CTDOT early.<\/strong> Load Rating Supervisor\nconcurrence before any departure from standard BrR methodology.<\/li>\n<li><strong>Tell field stories briefly.<\/strong> One sentence of real\nexperience lands better than a paragraph.<\/li>\n<\/ul>\n", "num": "IS 1.1", "home": ["strat", "delivery"], "old": "§27.0"}, {"id": "u171", "title": "Service life and rehabilitate vs. replace", "kind": "tp", "html": "\n<p>The bridge lasts as long as its weakest major component; align\ncomponent lives, then run LCCA.<\/p>\n<ul>\n<li><strong>Component-by-component service life + LCCA.<\/strong> Deck,\njoints, bearings, coating, steel, substructure each get a remaining\nlife; a new deck over near-expired beam ends is poor value.<\/li>\n<li><strong>Concrete deck: initiation vs. propagation.<\/strong> Chloride\ndiffusion model gets you to depassivation; a separate propagation period\nto cracking/delamination/spalling often controls the date.<\/li>\n<li><strong>Calibrate to the actual deck.<\/strong> Fit diffusion\nparameters to measured chloride profiles, cross-checked against\nsounding/delamination surveys. Report remaining life as a\n<strong>range<\/strong>, not a single year.<\/li>\n<li><strong>Steel.<\/strong> Coating life governs initiation\n(maintenance-dependent). Once exposed, corrosion is non-linear: pack\nrust at faying surfaces and laminated corrosion at beam ends\nself-accelerate. Use an exposure-dependent rate calibrated to inspection\nhistory, not uniform mils/year. Controlling location is usually a beam\nend or fascia under a leaking joint.<\/li>\n<li><strong>Anchor then calibrate.<\/strong> ISO 9223 corrosivity\ncategories, FHWA/NCHRP coating life data; widen the range where the\nrecord is thin.<\/li>\n<li><strong>Only chloride diffusion and carbonation model with\nconfidence.<\/strong> ASR, DEF, freeze-thaw, sulfate attack are assessed\nand mitigated, not date-predicted. Freeze-thaw: lab measures exist (ASTM\nC666, critical saturation) but no calibrated field model; treat as\nobserved damage trend.<\/li>\n<li><strong>References (new-design documents, invert them for existing\nbridges).<\/strong> AASHTO Guide Spec for Service Life Design; SHRP2 R19A\n(adopted by CTDOT Vol. 3); FHWA-HIF-22-052.<\/li>\n<li><strong>CTDOT process.<\/strong> Network level via the TAMP (75-year\npremise). Project level via the Bridge Rehabilitation Study →\nRehabilitation Study Report → Determination and Report of Meeting.<\/li>\n<li><strong>Non-structural drivers often decide it.<\/strong> Substandard\nwidth, non-MASH rail, vertical clearance, scour, hydraulics.<\/li>\n<li><strong>Traps.<\/strong> “65% of replacement cost” is an industry\nscreening heuristic, not CTDOT policy. Age raises the prior; it doesn’t\ndetermine the answer.<\/li>\n<\/ul>\n", "num": "RH 1.1", "home": ["rh", "decide"], "old": "§27.1"}, {"id": "u172", "title": "Legal load rating and posting decisions", "kind": "tp", "html": "\n<p>When a bridge rates below 1.0, the ladder matters less than knowing\nwhen each rung could change the decision.<\/p>\n<ul>\n<li><strong>Rating vocabulary.<\/strong> HL-93 = design load, rated at\ninventory and operating, drives federal reporting. Legal loads = AASHTO\nlegal trucks + SU4–SU7 SHVs + CT-specific; each produces a single RF.\n“Operating level” describes the reliability target (β = 2.5), not a\nsecond reported rating.<\/li>\n<li><strong>Why SHVs exist.<\/strong> Short-wheelbase multi-axle trucks\ngovern short spans and negative moment regions.<\/li>\n<li><strong>The ladder.<\/strong> Coordinate with CTDOT → independent\ncheck of assumptions, loads, distribution factors → revisit section loss\nin the field → refined analysis → material testing → diagnostic then\nproof load testing.<\/li>\n<li><strong>Check what governs first.<\/strong> Shear at a corroded steel\nbeam end → <strong>CT-BeamEnd spreadsheet with BrR output<\/strong>, not\nrefined distribution.<\/li>\n<li><strong>Don’t calculate your way out<\/strong> of a real deficiency.\nStop when cost and risk outrun benefit.<\/li>\n<li><strong>Adjacent box beam governed by end shear.<\/strong> Treat with\nalarm; that’s where failed shear keys let water in and where sudden\nfailures occur. Hands-on inspection of beam ends before refined\nanalysis.<\/li>\n<li><strong>Refined analysis assumes shear keys work.<\/strong> If\ncracked, a finer model can overstate distribution.<\/li>\n<li><strong>Community pushback.<\/strong> Rate the specific vehicles of\nconcern (school buses) rather than envelopes. Emergency vehicles are a\nseparate conversation: <strong>EV2 and EV3<\/strong> in the MBE (see\nCTDOT EV Posting Guide).<\/li>\n<\/ul>\n", "num": "LR 2.1", "home": ["lr", "legal"], "old": "§27.2"}, {"id": "u173", "title": "Permit loads", "kind": "tp", "html": "\n<p>The permit load factor follows the actual crossing conditions, not\nthe label on the permit.<\/p>\n<ul>\n<li><strong>Routine/annual permits.<\/strong> Defined configuration,\nweights, spacings and route network; travels mixed with traffic\n(pumpers, crane carriers, overweight dump/trash, tankers, lowboys).\nRated vehicles are <strong>envelopes<\/strong>; routing software checks\nthe applicant’s truck against them.<\/li>\n<li><strong>Single-trip/special.<\/strong> One origin-destination, one\ndate, often escorted (transformers, girders, industrial equipment). A\nstandard 80 kip 3S2 is <strong>legal<\/strong>, not a permit.<\/li>\n<li><strong>MBE Table 6A.4.5.4.2a-1.<\/strong> Load factors by permit\ntype: single-trip escorted lowest (about 1.1 at heaviest), single-trip\nmixed traffic higher, routine highest; scale with GVW and ADTT.<\/li>\n<li><strong>RF = 0.92 on an annual permit.<\/strong> First check whether\nmixed traffic was assumed. 0.92 is a reliability margin, not a safety\ncliff.<\/li>\n<li><strong>Controlled crossing converts it to single-trip.<\/strong>\nEscort, centered lane, no other traffic, crawl speed (reduced/no IM) get\nwritten into the permit. The operator loses the annual permit’s\nunlimited trips at that bridge.<\/li>\n<li><strong>250-ton transformer on a platform trailer.<\/strong> Get\nactual axle loads, number of lines, steerable dollies. Refined/FE model\nsince AASHTO distribution factors don’t apply. Justify reduced dynamic\nallowance.<\/li>\n<li><strong>Continuous spans.<\/strong> Check negative moment and\ninterior pier reactions; a long trailer loads two spans at once.<\/li>\n<li><strong>Substructure.<\/strong> Not routinely rated under the MBE,\nbut at superload magnitudes reactions, bearings and foundations can\ngovern. Check reactions against design; escalate if thin; ask CTDOT what\nthey expect.<\/li>\n<\/ul>\n", "num": "LR 2.2", "home": ["lr", "legal"], "old": "§27.3"}, {"id": "u174", "title": "Refined analysis, reliability, testing", "kind": "tp", "html": "\n<p>Every departure from standard BrR needs Load Rating Supervisor\nconcurrence before the work, not after.<\/p>\n<ul>\n<li><strong>Reliability targets.<\/strong> β = 2.5 for legal/permit\n(operating level); β = 3.5 is design/inventory. Mario caught this in\nsession.<\/li>\n<li><strong>Keep load and resistance separate.<\/strong> Site-specific\nlive load from validated WIM data is defensible. Site-specific\nresistance factors need real statistics, not a few coupons. Reserve for\nhigh-consequence decisions.<\/li>\n<li><strong>Material sampling (CTDOT LRM §6.1.2).<\/strong> Steel\nsampling needs prior LRS approval; nominal yield/tensile = mean − 1.65σ\n(95% confidence). Measured f′c or Fy is fine; don’t touch resistance\nfactors without separate basis.<\/li>\n<li><strong>Load testing.<\/strong> Diagnostic first. Proof testing needs\nowner approval, defined target load, <strong>stop criteria<\/strong>,\nnonlinearity monitoring.<\/li>\n<\/ul>\n", "num": "LR 3.1", "home": ["lr", "low"], "old": "§27.4"}, {"id": "u175", "title": "QA of subconsultant rating packages", "kind": "tp", "html": "\n<p>With limited hours across 30 bridges, risk-rank them and spend depth\nwhere the risk is.<\/p>\n<ul>\n<li><strong>Say QA, not QC.<\/strong> Your role is verifying the sub’s QC\nprocess worked; CTDOT distinguishes the two.<\/li>\n<li><strong>Triage.<\/strong> Deep review: fracture critical, posted or\nnear-posted, heavy section loss, unusual types, big delta from the prior\nrating. Screening check: routine high-RF bridges with no condition\nchange.<\/li>\n<li><strong>What to check.<\/strong> Conformance with CTDOT manual and\nformats; model assumptions and load path; compare against the\n<strong>previous rating<\/strong> and require justification for\nsignificant movement; section loss matches the BIR; guard against excess\nconservatism too.<\/li>\n<li><strong>Hard rejection trigger.<\/strong> No documented independent\ncheck from the sub → back immediately, regardless of results.<\/li>\n<\/ul>\n", "num": "LR 4.1", "home": ["lr", "qa"], "old": "§27.5"}, {"id": "u176", "title": "Steel fatigue and distortion-induced cracking", "kind": "tp", "html": "\n<p>A web crack at a connection plate is usually distortion-induced, so a\nconventional fatigue rating can pass while the crack keeps growing.<\/p>\n<ul>\n<li><strong>First action.<\/strong> Notify CTDOT in writing the same day,\nbefore analysis. The rating can wait; the notification can’t.<\/li>\n<li><strong>Mechanism.<\/strong> Adjacent girders deflect differently;\ncross frames force compatibility and pull the connection plate out of\nplane. In older bridges the plate wasn’t attached to the tension flange,\nleaving a 1–3 in. <strong>web gap<\/strong> that takes all the relative\nrotation at very high local strain. Line girder models show\nnothing.<\/li>\n<li><strong>The reversal.<\/strong> Old practice avoided a Category C\ntransverse weld on the tension flange. Experience showed the unstiffened\ngap was worse. Current AASHTO requires positive attachment of connection\nplates to both flanges.<\/li>\n<li><strong>Stiffener distinctions.<\/strong> Plain intermediate\nstiffeners: web only, stopped 4–6 t_w short of the tension flange weld.\nOnce a cross frame attaches, it’s a connection plate: attach to both\nflanges. Bearing stiffeners bear on the bottom flange.<\/li>\n<li><strong>Retrofit options.<\/strong> <em>Stiffen:<\/em> bolted angles\ntying connection plate to flange; drilled holes, edge distance, net\nsection check; bolted = Category B. <em>Soften:<\/em> loosen or remove\ncross frame connections where not needed, after checking stability and\ndistribution.<\/li>\n<li><strong>Before any retrofit.<\/strong> Hands-on inspection and NDE to\nfind crack tips. Has it reached the flange? That changes urgency\nentirely. Don’t jump to arrest holes.<\/li>\n<li><strong>CTDOT LRM.<\/strong> §6.2.1 fatigue-prone details are\nCategory C and below, infinite life; §6.2.2 remaining life at MBE\nEvaluation 1; MBE 7.2.7.2.2 methods need prior LRS approval.<\/li>\n<\/ul>\n", "num": "LR 5.1", "home": ["lr", "steel"], "old": "§27.6"}, {"id": "u177", "title": "Horizontally curved steel girders", "kind": "tp", "html": "\n<p>On a curved bridge the cross frames are primary members, so line\ngirder analysis is generally not acceptable.<\/p>\n<ul>\n<li><strong>Behavior.<\/strong> Self-weight produces torsion, which\nresolves into flange lateral bending (warping). Outside girder carries\ndisproportionate load; bearings see lateral force; cross frames and\nconnections can govern the rating.<\/li>\n<li><strong>Analysis.<\/strong> At least a grid model, often refined\n3D.<\/li>\n<li><strong>One-third rule (LRFD 6.10.8, App. A6).<\/strong> f_bu + (1/3)\nf_l ≤ φF_n, with f_l ≤ 0.6 F_y.<\/li>\n<li>Why 1/3: peak f_l is at the flange tips while f_bu is uniform, so\nthey can’t be added directly; 1/3 calibrates to the true yield\ninteraction. Exceeding 0.6 Fy → add cross frames or enlarge the\nflange.<\/li>\n<li><strong>Which flange governs.<\/strong> In service, the deck\nrestrains the top flange, so the <strong>bottom flange<\/strong> governs\n(especially compression in negative moment). During\n<strong>construction/staged deck work<\/strong>, the unrestrained top\nflange carries wet concrete torsion plus eccentric overhang bracket\nloads.<\/li>\n<\/ul>\n", "num": "LR 5.2", "home": ["lr", "steel"], "old": "§27.7"}, {"id": "u178", "title": "Prestressed concrete", "kind": "tp", "html": "\n<p>Adjacent box beams are non-redundant members that can fail with no\nvisual warning; say that first.<\/p>\n<p><strong>Adjacent box beams<\/strong><\/p>\n<ul>\n<li><strong>Field story.<\/strong> A beam snapped in half during removal\non a New England replacement with the same condition. Tell it in one\nsentence.<\/li>\n<li><strong>Strands corrode invisibly<\/strong> inside a closed section.\nLongitudinal cracking on the soffit usually means strand corrosion is\nalready splitting concrete.<\/li>\n<li><strong>Shear keys are their own problem.<\/strong> Failed keys mean\nload isn’t distributing as assumed; check distribution factors, consider\nrating a beam acting alone.<\/li>\n<li><strong>CTDOT LRM §5.2.1.<\/strong> Exposed strands with surface rust\nonly: effective. Any section loss, separation or fractured wires:\ndiscount entirely. Binary; no partial reduction on adjacent strands\n(unlike MassDOT).<\/li>\n<li><strong>The gap.<\/strong> Soffit cracking with no exposed strand\nisn’t covered. Go to CTDOT for direction rather than silently importing\nMassDOT’s method.<\/li>\n<li><strong>Useful testing.<\/strong> Half-cell potential, chloride\nsampling, hands-on soffit examination. GPR adds little.<\/li>\n<\/ul>\n<p><strong>Continuous-for-live-load I-girders<\/strong><\/p>\n<ul>\n<li>Deck cracking over the pier is expected. But cracking\n<strong>plus<\/strong> efflorescence and rust staining on the diaphragm =\nleak path into the continuity connection. Verify continuity before\nrating it as continuous.<\/li>\n<li><strong>Spall at the girder end.<\/strong> Ask if it’s in the strand\ntransfer/development zone. That hits the <strong>longitudinal\nreinforcement check (LRFD 5.7.3.5)<\/strong>, not just stirrups.<\/li>\n<li><strong>Why.<\/strong> In MCFT the diagonal compression field’s\nhorizontal thrust must be resisted by longitudinal tension. Near\nsupports shear is max, strands are least developed; lost bond there can\nfail the check even with adequate stirrups. CTDOT directs the General\nProcedure when results are low.<\/li>\n<\/ul>\n", "num": "LR 6.1", "home": ["lr", "concrete"], "old": "§27.8"}, {"id": "u179", "title": "Superstructure replacement and ABC", "kind": "tp", "html": "\n<p>Challenge substructure reuse first, then let access and pick weight\nchoose the member type.<\/p>\n<ul>\n<li><strong>Don’t assume reuse.<\/strong> Old substructure may not meet\ncurrent LRFD loads. Hydraulics: current practice often targets a clear\nspan of about <strong>1.2 × bankfull width<\/strong>; many existing\nopenings fall short.<\/li>\n<li><strong>Options at ~90 ft.<\/strong> NEXT beams (continuous top\nflange, no stay-in-place forms, easy over water); other prestressed\nshapes; <strong>PBUs<\/strong> (steel or concrete beams integral with\ndeck, precast off-site, picked as a unit); UHPC closure pours when speed\ntruly matters, conventional otherwise.<\/li>\n<li><strong>Weight before type.<\/strong> Crane access over a river can\ncap unit width and weight before anything else does. Steel gives the\nlightest pick; precast deck panels still deliver ABC.<\/li>\n<li><strong>Skew.<\/strong> At 30° adjacent precast units create skewed\njoints; confirm existing seat width and bearing line geometry fit the\nnew layout.<\/li>\n<li><strong>Steel over water.<\/strong> Manageable: weathering steel or\ngood coating, with drainage detailing so runoff doesn’t hit beam\nends.<\/li>\n<\/ul>\n", "num": "DE 1.1", "home": ["de", "super"], "old": "§27.9"}, {"id": "u180", "title": "Work over active railroads", "kind": "tp", "html": "\n<p>The non-negotiable commitment: the railroad envelope is clear and the\nstructure stable at the end of every outage.<\/p>\n<ul>\n<li><strong>Code and geometry.<\/strong> AREMA offsets from track\ncenterline; crash walls for piers within about 25 ft of track\ncenterline; limited shoring locations.<\/li>\n<li><strong>Erection sequence beats splice placement.<\/strong> Full\ngirder lines in single picks may eliminate a splice over track.\nOtherwise locate splices by access, ideally near dead load\ncontraflexure.<\/li>\n<li><strong>No partially braced girders left overnight.<\/strong><\/li>\n<li><strong>If it can’t fit the window,<\/strong> re-sequence rather than\nextend.<\/li>\n<li><strong>Commit before the outage schedule.<\/strong> Sealed erection\nprocedure and temporary works submitted for railroad review months\nahead; it’s a schedule driver on its own.<\/li>\n<li><strong>Designer vs. contractor.<\/strong> The contractor designs the\nerection scheme. You provide the framing that makes it possible: piece\nweights, stability requirements, where loads may land.<\/li>\n<\/ul>\n", "num": "DE 5.1", "home": ["de", "rail"], "old": "§27.10"}, {"id": "u181", "title": "Staged deck replacement and closure pours", "kind": "tp", "html": "\n<p>A closure pour exists so each stage deflects fully before the halves\nare joined.<\/p>\n<ul>\n<li><strong>Pour sequence.<\/strong> Positive moment regions first,\nnegative moment after. Stage 1, stage 2, then the closure bay once both\nhave deflected; avoids locked-in stress and differential\ndeflection.<\/li>\n<li><strong>Stability where it actually bites.<\/strong> The live-load\nstage keeps its deck (Mario’s correction). Watch the girders under the\n<strong>removed<\/strong> deck: no composite action, no top flange\nrestraint, longer unbraced lengths if cross frames are disconnected,\nplus screed, overhang brackets, equipment.<\/li>\n<li><strong>Stage-line girder.<\/strong> Deck on one side only →\neccentric load, lateral flange bending, then wet concrete on the other\nside.<\/li>\n<li><strong>Differential deflection across the closure.<\/strong> Traffic\non stage 1 while the closure sets can crack it into a centerline leak\npath. Specify traffic restriction during the pour/early cure, or show\nthe differential is tolerable.<\/li>\n<li><strong>High early strength closure.<\/strong> About 3,000 psi in\n12–16 hr; pour evenings, reopen mornings. Cautions: heat and shrinkage\nin a narrow restrained strip → low-shrinkage/shrinkage-compensating\nadmixtures, wet cure. Control vibration through initial set. UHPC\nshortens the window further.<\/li>\n<\/ul>\n", "num": "RH 3.1", "home": ["rh", "joints"], "old": "§27.11"}, {"id": "u182", "title": "Materials and corrosion protection", "kind": "tp", "html": "\n<p>Corrosion protection is layered: bar type, concrete permeability and\ncover work together, justified by life cycle cost.<\/p>\n<ul>\n<li><strong>CTDOT baseline.<\/strong> Galvanized reinforcing (verify\ncurrent spec scope before stating).<\/li>\n<li><strong>Step-ups.<\/strong> Stainless-clad bars (HDR has used);\n<strong>solid 2205 duplex<\/strong> stainless (ASTM A955), the benchmark\nwith the strongest long-term chloride data; cathodic protection/anodes;\nlow-permeability mix designs.<\/li>\n<li><strong>Cost argument.<\/strong> Stainless runs roughly 2.5–4× carbon\nsteel in material cost, but rebar is a small fraction of bridge cost. A\npremature deck replacement is the whole deck plus traffic impacts and\nuser delay.<\/li>\n<li><strong>Phrasing.<\/strong> “Life cycle studies routinely credit it\nwith 100-year deck performance” rather than promising a 100-year\nlife.<\/li>\n<\/ul>\n", "num": "DE 3.1", "home": ["de", "concrete"], "old": "§27.12"}, {"id": "u183", "title": "Joint elimination: integral vs. semi-integral", "kind": "tp", "html": "\n<p>Semi-integral is the realistic retrofit; full integral rarely suits\nan existing abutment.<\/p>\n<ul>\n<li><strong>Full integral.<\/strong> The abutment moves with the deck.\nThermal cycling ratchets passive pressure into the backfill; needs\nflexible foundations (single row of slender piles). Stiff spread\nfootings or battered piles usually rule it out. Skew makes it harder\n(plan rotation).<\/li>\n<li><strong>Semi-integral.<\/strong> Stem
