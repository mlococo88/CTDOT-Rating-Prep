 activity from\ndiagnostic testing. It must follow the applicable MBE and owner process,\ninclude defined target and stop criteria, and be supervised by qualified\npersonnel.<\/p><\/li>\n<li><p>Weigh-in-motion data can characterize site-specific truck traffic\nand may support site-specific load modeling or reliability studies when\nthe data quality, duration, representativeness, and owner approval are\nadequate.<\/p><\/li>\n<li><p>Automated and batch-rating workflows can improve consistency for\nlarge inventories, but they require controlled source data, exception\nflags, version management, reproducibility, and engineering review of\nunusual or low results.<\/p><\/li>\n<\/ul>\n", "num": "DE 9.10", "home": ["de", "digital"], "old": "§14"}, {"id": "u103", "title": "Artificial intelligence and data analytics", "kind": "ref", "html": "\n<ul>\n<li><p>Machine-learning tools can prioritize inspection images, identify\npatterns, support deterioration forecasting, or flag structures that\nmerit closer review. These are screening and decision-support functions,\nnot substitutes for owner-required inspection or rating.<\/p><\/li>\n<li><p>Large-language-model and script-assisted workflows may help\norganize records, compare inputs, generate checklists, or identify\ninconsistencies. They should not be treated as authoritative calculation\nengines.<\/p><\/li>\n<li><p>For any AI-assisted process, the team should protect confidential\ninformation, document the tool and version, verify source data,\nindependently check technical output, preserve reproducibility, and keep\na licensed engineer accountable for the final work product.<\/p><\/li>\n<\/ul>\n<p><strong>How we would decide whether to use a new\ntechnology<\/strong><\/p>\n<ul>\n<li><p>Define the specific uncertainty or owner decision the technology\nis intended to address.<\/p><\/li>\n<li><p>Confirm CTDOT acceptance, governing criteria, procurement and\ndata-security requirements, and whether a pilot or special approval is\nneeded.<\/p><\/li>\n<li><p>Compare the proposed technology with a conventional baseline in\nterms of accuracy, maturity, schedule, cost, access, safety, service\nlife, maintainability, and risk.<\/p><\/li>\n<li><p>Establish validation criteria before collecting data or building\nthe model.<\/p><\/li>\n<li><p>Use qualified specialists, independent review, and a fallback\napproach if the technology does not provide usable information.<\/p><\/li>\n<li><p>Document assumptions, limitations, data ownership, software\nversions, and the connection between the technology output and the\nengineering decision.<\/p><\/li>\n<\/ul>\n<p><strong>Suggested project examples<\/strong><\/p>\n<ul>\n<li><p>A refined finite-element model validated with independent\ncalculations and field measurements.<\/p><\/li>\n<li><p>A strain-gauge or controlled-load test used to resolve\ndistribution, restraint, or composite-action uncertainty.<\/p><\/li>\n<li><p>A UHPC repair, overlay, link slab, or prefabricated-element\nconnection used to improve durability or accelerate\nconstruction.<\/p><\/li>\n<li><p>A drone, LiDAR, photogrammetry, or NDE application that reduced\naccess impacts or improved condition information.<\/p><\/li>\n<li><p>A digital-delivery or parametric workflow that reduced rework\nwhile preserving independent checking and clear engineer\naccountability.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up questions<\/strong><\/p>\n<ul>\n<li><p>Which of these technologies is mature enough for immediate use on\nthis contract?<\/p><\/li>\n<li><p>Which technology would create the greatest value for CTDOT’s\nbridge inventory?<\/p><\/li>\n<li><p>How would you validate an AI-assisted crack-detection\nresult?<\/p><\/li>\n<li><p>What is the difference between diagnostic and proof load\ntesting?<\/p><\/li>\n<li><p>When would refined analysis be inappropriate even if it produces\na higher rating?<\/p><\/li>\n<li><p>How would you prevent a digital twin from becoming an outdated\nmodel with no asset-management value?<\/p><\/li>\n<li><p>What data-quality checks are necessary before using WIM data for\nsite-specific evaluation?<\/p><\/li>\n<li><p>How would you address cybersecurity, proprietary formats, and\nlong-term access to digital project data?<\/p><\/li>\n<\/ul>\n<p><strong>Suggested closing:<\/strong> “Our differentiator is not that\nwe use every available technology. It is that we know how to match the\ntool to the engineering question, validate the output, and convert the\nresult into a practical, transparent decision for CTDOT.”<\/p>\n<p><strong>Reference basis for this interview topic<\/strong><\/p>\n<ul>\n<li><p>FHWA resources on UHPC connections, overlays, link slabs,\nbeam-end repair, bridge preservation, and structural\napplications.<\/p><\/li>\n<li><p>AASHTO Information Delivery Manual for design-to-construction\ndata exchange for highway bridges and IFC-based bridge information\nexchange.<\/p><\/li>\n<li><p>FHWA InfoTechnology resources covering bridge NDE methods,\nincluding GPR, infrared thermography, impact echo, ultrasonic methods,\nand phased-array UT.<\/p><\/li>\n<li><p>FHWA bridge-inspection resources describing UAS as an inspection\ntool that can reduce some traffic impacts while supplementing, not\nreplacing, bridge inspectors.<\/p><\/li>\n<li><p>FHWA research on linking NDE data with deterioration and\nservice-life modeling and on structural health monitoring.<\/p><\/li>\n<li><p>FHWA discussion of refined two-dimensional and three-dimensional\nanalysis and the continuing need for guidance, training, and\nvalidation.<\/p><\/li>\n<\/ul>\n<p><strong>Important:<\/strong> This section intentionally distinguishes\ntechnologies moving into practice from research-stage applications.\nBefore using any technology on a task order, confirm current CTDOT\napproval, current AASHTO/FHWA requirements, applicable software\nversions, data-management requirements, and the required level of\nindependent review.<\/p>\n", "num": "DE 9.11", "home": ["de", "digital"], "old": "§14"}, {"id": "u104", "title": "Technical Study Guide: CTDOT Load Rating and Design", "kind": "ref", "html": "\n<p>This section reorganizes the supplied CTDOT Load Rating &amp; Design\nInterview Prep PDF into a study guide. It distinguishes established\ninterview concepts from items that must be verified against current\nCTDOT documents and the current licensed AASHTO Manual for Bridge\nEvaluation before the interview or any engineering work.<\/p>\n", "num": "LR 7.11", "home": ["lr", "ctdot"], "old": "§15"}, {"id": "u105", "title": "Interview Format and Answer Strategy", "kind": "ref", "html": "\n<ul>\n<li><p>Expect approximately five technical questions with only a short\nreview period before answering. Prepare concise openings and organized\ntechnical expansions.<\/p><\/li>\n<li><p>Lead with the governing hierarchy: current CTDOT Bridge Load\nRating Manual and CTDOT-specific guidance first, then the current AASHTO\nMBE where CTDOT has not modified the requirement.<\/p><\/li>\n<li><p>Demonstrate judgment about when to stop. Explain when a refined\nanalysis, test, or reliability study is worth the cost and when the\nstandard method is sufficient.<\/p><\/li>\n<li><p>Name the controlling component, mechanism, vehicle, or limit\nstate whenever possible. Specific controls make the answer sound\ngrounded in practice.<\/p><\/li>\n<li><p>Separate confirmed CTDOT policy from professional experience.\nWhere a rule is uncertain, say that the team would confirm it with the\nLoad Rating Supervisor before proceeding.<\/p><\/li>\n<li><p>Connect LRFR terminology to older ASD/LFR concepts when helpful,\nwhile avoiding direct numerical equivalence where calibrations\ndiffer.<\/p><\/li>\n<\/ul>\n", "num": "IS 1.4", "home": ["strat", "delivery"], "old": "§15"}, {"id": "u106", "title": "Governing Documents and Software Controls", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Document or Resource<\/strong><\/th>\n<th><strong>Role<\/strong><\/th>\n<th><strong>Interview Points<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>CTDOT Bridge Load Rating Manual<\/td>\n<td>CTDOT supplement to the current MBE<\/td>\n<td>Methodology, report requirements, software, QA/QC, and approval\npaths. Confirm current edition and specific conflicts or\nmodifications.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CTDOT BrR User Guide<\/td>\n<td>CTDOT modeling rules for AASHTOWare BrR<\/td>\n<td>Treat as binding project guidance where applicable. Confirm current\nversion and required model conventions.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CTDOT Load Rating webpage and approved software list<\/td>\n<td>Current owner resources and software status<\/td>\n<td>Software outside approved workflows requires CTDOT concurrence.\nConfirm the accepted BrR version before starting.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>AASHTO Manual for Bridge Evaluation<\/td>\n<td>National load-rating framework<\/td>\n<td>Use the licensed current edition and applicable interims, subject to\nCTDOT modifications.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>FHWA/NBIS requirements<\/td>\n<td>Federal inventory, rating, and posting framework<\/td>\n<td>Understand federal requirements, but follow CTDOT’s current\nimplementation and owner decision process.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>High-value interview point:<\/strong> A rating performed in a\nsoftware version newer than the version accepted by CTDOT may be\nrejected or require conversion. Confirm the accepted version at task\nkickoff rather than discovering the issue at submittal.<\/p>\n", "num": "LR 7.12", "home": ["lr", "ctdot"], "old": "§15"}, {"id": "u107", "title": "LRFR Rating Levels and Reliability Concepts", "kind": "ref", "html": "\n<ul>\n<li><p>Inventory and Operating are design-load rating levels associated\nwith the HL-93 design load rating. Legal and permit evaluations are\nreported for the applicable vehicles and conditions rather than as\nInventory/Operating pairs.<\/p><\/li>\n<li><p>Design-load rating is a screening and benchmark evaluation. A\nsatisfactory design Inventory result may eliminate the need for further\nlegal-load evaluation under the applicable owner process, but the\ncurrent CTDOT requirements control.<\/p><\/li>\n<li><p>Legal-load ratings evaluate AASHTO legal vehicles, specialized\nhauling vehicles, emergency vehicles, and other owner-required vehicles.\nLegal ratings support posting decisions.<\/p><\/li>\n<li><p>Permit ratings evaluate a specific permit vehicle and operating\ncondition using the applicable permit provisions and Strength II-type\nframework.<\/p><\/li>\n<li><p>Reliability index beta is a calibration metric describing the\ndistance from the mean safety margin to the limit state in standard\ndeviations. It is a target for uniform safety, not a prediction that a\nbridge will collapse.<\/p><\/li>\n<\/ul>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 20%\"/>\n<col style=\"width: 20%\"/>\n<col style=\"width: 20%\"/>\n<col style=\"width: 20%\"/>\n<col style=\"width: 20%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Rating<\/strong><\/th>\n<th><strong>Typical Load<\/strong><\/th>\n<th><strong>Typical Limit State<\/strong><\/th>\n<th><strong>Illustrative LL Factor<\/strong><\/th>\n<th><strong>Study Note<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Design, Inventory<\/td>\n<td>HL-93<\/td>\n<td>Strength I<\/td>\n<td>1.75<\/td>\n<td>Commonly associated with beta near 3.5.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Design, Operating<\/td>\n<td>HL-93<\/td>\n<td>Strength I<\/td>\n<td>1.35<\/td>\n<td>Commonly associated with beta near 2.5.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Legal<\/td>\n<td>Legal, SHV, EV<\/td>\n<td>Strength I<\/td>\n<td>Varies with ADTT<\/td>\n<td>Use current MBE and CTDOT values; do not quote a range without\nchecking.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Permit<\/td>\n<td>Permit vehicle<\/td>\n<td>Strength II<\/td>\n<td>Per permit provisions<\/td>\n<td>Depends on permit type and operating conditions.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Verify before use:<\/strong> All factors, reliability targets,\nvehicle lists, and screening rules against the current MBE and current\nCTDOT manuals. The values above are study references from the supplied\nPDF, not a substitute for governing criteria.<\/p>\n", "num": "LR 1.15", "home": ["lr", "fund"], "old": "§15"}, {"id": "u108", "title": "Posting Concepts", "kind": "ref", "html": "\n<ul>\n<li><p>A verified legal-load rating factor below 1.0 at an applicable\nstrength limit state is the central analytical trigger for posting\nevaluation. Notify CTDOT promptly when a preliminary low legal rating is\nidentified.<\/p><\/li>\n<li><p>Posting is an owner decision based on verified results, required\nvehicles, actual condition, uncertainty, route importance, and available\nremedial actions.<\/p><\/li>\n<li><p>Legal vehicles may include AASHTO Type 3, 3S2, and 3-3 vehicles,\nspecialized hauling vehicles, and emergency vehicles, subject to current\nCTDOT requirements.<\/p><\/li>\n<li><p>Posting values are vehicle-specific under the applicable equation\nand owner process; avoid assuming one blanket tonnage represents all\nvehicle configurations.<\/p><\/li>\n<li><p>Design-load and permit evaluations serve different purposes and\ndo not substitute for the required legal-load posting\nevaluation.<\/p><\/li>\n<li><p>Service and fatigue results should be communicated distinctly\nfrom a strength deficiency. Confirm CTDOT’s current policy on whether\nand how non-strength results affect posting.<\/p><\/li>\n<\/ul>\n", "num": "LR 2.8", "home": ["lr", "legal"], "old": "§15"}, {"id": "u109", "title": "Rating Factor and Capacity-Side Factors", "kind": "ref", "html": "\n<p><strong>Conceptual LRFR equation:<\/strong> RF = [φc φs φ Rn − γDC DC\n− γDW DW ± γP P] / [γLL (LL + IM)]<\/p>\n<p>φ is the member- and limit-state-specific resistance factor from the\ngoverning specifications.<\/p>\n<p>φc is the condition factor, representing condition-related\nuncertainty. It does not eliminate the need to establish and model\nactual section loss.<\/p>\n<p>φs is the system factor, representing redundancy and system behavior.\nSelection depends on the actual load path and system type.<\/p>\n<p>DC represents structural dead load; DW commonly represents wearing\nsurface and utilities; P represents applicable permanent force effects;\nLL is live-load effect; IM is dynamic allowance.<\/p>\n<p>The study PDF notes a floor for the combined condition and system\ntreatment and provides illustrative factor values. Verify the exact\ncurrent limits and CTDOT modifications before quoting them.<\/p>\n<p>When section dimensions are uncertain, request measurements. If\nmeasurements cannot be obtained, document a conservative assumed section\nand the effect of uncertainty.<\/p>\n", "num": "LR 1.16", "home": ["lr", "fund"], "old": "§15"}, {"id": "u110", "title": "Steel Girder Rating Study Notes", "kind": "ref", "html": "\n<ul>\n<li><p>Strength I checks positive and negative flexure, shear, local\nbuckling, lateral-torsional buckling, tension-flange yielding, web\nbehavior, and other applicable strength mechanisms.<\/p><\/li>\n<li><p>Strength II is associated with permit evaluation under the\napplicable provisions.<\/p><\/li>\n<li><p>Service II addresses permanent deformation and may produce a\nlower rating factor than Strength I for some older composite steel\ngirders. Report the actual governing result while distinguishing service\nimplications from strength implications.<\/p><\/li>\n<li><p>Fatigue evaluation depends on detail category, stress range,\ntruck traffic, and known cracking or susceptible details. Fatigue may\nnot control the immediate legal rating, but it can control inspection,\nrepair, or remaining-life recommendations.<\/p><\/li>\n<li><p>For negative moment regions, cracked deck concrete is generally\nnot credited in composite resistance, while longitudinal reinforcement\nwithin the effective width may participate when details and condition\nsupport it.<\/p><\/li>\n<li><p>If deck reinforcement or its continuity is unknown or seriously\ndeteriorated, a conservative steel-section-only assumption may be\nrequired unless better information is obtained.<\/p><\/li>\n<li><p>For deteriorated steel bridges, the decisive work often involves\nmeasured flange loss, web thickness at bearings, connection condition,\nand whether composite action and restraint assumptions remain\nvalid.<\/p><\/li>\n<li><p>For prestressed concrete, Service III tensile-stress behavior and\nService I compression may be important, but the required checks and\nreporting treatment must follow current criteria.<\/p><\/li>\n<\/ul>\n", "num": "LR 5.14", "home": ["lr", "steel"], "old": "§15"}, {"id": "u111", "title": "Low Rating Escalation Ladder", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\"/>\n<col style=\"width: 50%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Step<\/strong><\/th>\n<th><strong>Purpose<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Standard rating<\/td>\n<td>Complete and verify the BrR or other standard-method rating.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2. Input verification<\/td>\n<td>Reconcile plans, inspection, section loss, materials, loads,\nvehicles, factors, and model behavior.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3. Refined analysis<\/td>\n<td>Use grillage, influence-surface, 2D, or 3D FEM when reserve capacity\nis plausibly hidden by simplified assumptions.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4. Diagnostic load test<\/td>\n<td>Use controlled sublegal loading and measured elastic response to\nevaluate distribution, restraint, continuity, or composite action and\ncalibrate the model.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5. Material/site-specific study<\/td>\n<td>Use targeted material testing, WIM data, or reliability-based\nevaluation when the decision value justifies it and CTDOT approves.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>6. Proof load test<\/td>\n<td>Use incremental loading with target and stop criteria only when\nappropriate, approved, and justified by the importance of the\ndecision.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>7. Owner action<\/td>\n<td>If the deficiency remains, support posting, strengthening,\nmonitoring, rehabilitation, or replacement.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>When to stop:<\/strong> Each step costs more and introduces\nnew assumptions or operational risk. Continue only when the probable\ndecision benefit, such as avoiding a disruptive posting or major\nunnecessary rehabilitation, justifies the additional work.<\/p>\n", "num": "LR 3.7", "home": ["lr", "low"], "old": "§15"}, {"id": "u112", "title": "Diagnostic Testing, Proof Testing, and Reliability-Based Rating", "kind": "ref", "html": "\n<ul>\n<li><p>Diagnostic load testing uses known, controlled loads within the\nelastic range and compares measured strain or deflection with\npredictions. It can reveal actual distribution, unintended composite\naction, restraint, or continuity. It is intended to improve the model,\nnot directly demonstrate ultimate capacity.<\/p><\/li>\n<li><p>Proof load testing incrementally loads the bridge toward a\ndefined target with stop criteria for distress, nonlinearity, or\nresidual deformation. It is more consequential, more expensive, and more\ndefinitive, and should be used only with owner approval and a rigorous\ntest plan.<\/p><\/li>\n<li><p>Reliability-based or site-specific rating uses statistical\ntraffic information, such as validated WIM data and ADTT, to refine\nlive-load modeling or factors. It is analytical and is distinct from\nfield load testing.<\/p><\/li>\n<li><p>Material testing may support better resistance characterization,\nbut resistance factors should not be changed without a defensible code\nand owner-approved basis.<\/p><\/li>\n<li><p>For CTDOT interviews, name the method, explain the uncertainty it\nresolves, state the validation and stop criteria, and say that Load\nRating Supervisor concurrence would be obtained before departing from\nstandard BrR methodology.<\/p><\/li>\n<\/ul>\n", "num": "LR 3.8", "home": ["lr", "low"], "old": "§15"}, {"id": "u113", "title": "Remaining Useful Service Life", "kind": "ref", "html": "\n<ul>\n<li><p>Define end of life. The controlling threshold is often a\nroute-disruptive posting, unacceptable service condition, loss of\nmaintainability, or uneconomic repair rather than collapse.<\/p><\/li>\n<li><p>Establish current condition from inspection, element-level data,\nmeasurements, and targeted testing such as chloride profiles, cores,\nsection-loss measurements, half-cell potential, carbonation depth, or\nNDE.<\/p><\/li>\n<li><p>Identify the governing component and deterioration mechanism. On\ndeicing-salt-exposed bridges, bridge decks, joints, and steel beam ends\noften control; fatigue may control specific heavily trafficked steel\ndetails.<\/p><\/li>\n<li><p>Project deterioration using observed history, calibrated\ndeterioration curves, chloride diffusion models, corrosion propagation\nassumptions, or fatigue cycle accumulation.<\/p><\/li>\n<li><p>Find the threshold-crossing time for both structural and economic\ncriteria.<\/p><\/li>\n<li><p>Compare do-nothing, repair, deck replacement, major\nrehabilitation, and replacement alternatives using service-life\nextension, user costs, risk, inspection needs, and life-cycle\ncost.<\/p><\/li>\n<\/ul>\n", "num": "RH 1.5", "home": ["rh", "decide"], "old": "§15"}, {"id": "u114", "title": "Chloride-Induced Deck Corrosion", "kind": "ref", "html": "\n<ul>\n<li><p>Chlorides transported with moisture can depassivate reinforcing\nsteel. Corrosion products expand, causing cracking, delamination, and\nspalling.<\/p><\/li>\n<li><p>Chain drag or sounding can detect internal delamination before\nextensive visible spalling.<\/p><\/li>\n<li><p>Chloride profiles should be measured by depth through and beyond\nthe reinforcement level. Threshold values vary with concrete, exposure,\nreinforcement, and inhibitors and must not be assumed without a\ndocumented basis.<\/p><\/li>\n<li><p>Fickian diffusion models commonly produce a square-root-of-time\nrelationship for penetration. Fit the diffusion parameter to measured\ndata rather than adopting an unsupported generic value.<\/p><\/li>\n<li><p>Model initiation and propagation separately: first the time for\nchloride concentration at reinforcement to reach a threshold, then the\ntime for corrosion damage to become structurally or economically\nsignificant.<\/p><\/li>\n<\/ul>\n", "num": "DE 3.3", "home": ["de", "concrete"], "old": "§15"}, {"id": "u115", "title": "Fatigue Life", "kind": "ref", "html": "\n<ul>\n<li><p>Finite fatigue-life evaluation uses the actual detail category,\neffective stress range, accumulated cycles, ADTT, lane distribution, and\ntraffic growth assumptions.<\/p><\/li>\n<li><p>Distinguish mean, evaluation, and minimum fatigue-life outputs\nwhere the governing MBE procedure reports different confidence\nlevels.<\/p><\/li>\n<li><p>Fatigue may be straightforward analytically but is not\nautomatically the governing remaining-life mechanism. Inspection\nevidence, distortion-induced behavior, prior cracking, and repair\nhistory must be integrated.<\/p><\/li>\n<\/ul>\n", "num": "LR 5.15", "home": ["lr", "steel"], "old": "§15"}, {"id": "u116", "title": "Items to Verify Before the Interview", "kind": "ref", "html": "\n<ul>\n<li><p>Current CTDOT Bridge Load Rating Manual, BrR User Guide, approved\nsoftware list, accepted BrR version, rating aids, vehicle files, and\nsubmittal requirements.<\/p><\/li>\n<li><p>Current CTDOT posting procedure, vehicle set, applicable limit\nstates, notification expectations, and treatment of service or fatigue\nresults.<\/p><\/li>\n<li><p>CTDOT direction for unmeasured wearing-surface thickness and any\nmodified dead-load factors.<\/p><\/li>\n<li><p>Approval path for refined analysis, diagnostic testing, proof\ntesting, material testing, reliability-based rating, and nonstandard\nsoftware.<\/p><\/li>\n<li><p>Current MBE section numbers for load testing, proof testing,\nsite-specific reliability, fatigue, and permit rating before quoting\nsections in the interview.<\/p><\/li>\n<li><p>Current CTDOT status and assignment requirements for\nemergency-vehicle ratings.<\/p><\/li>\n<li><p>Exact solicitation scope, project team obligations, and which\nproposed staff member has direct experience for each example.<\/p><\/li>\n<\/ul>\n", "num": "VN 1.3", "home": ["vf", "verify"], "old": "§15"}, {"id": "u117", "title": "Practice Questions Based on the Technical Study Guide", "kind": "ref", "html": "\n<p><em>v4: <a class=\"xref\" href=\"#lr/fund/u61\" title=\"Q39 · Explain Inventory, Operating, legal, and permit ratings — and why a bridge can fail Inventory but pass legal loads.\">LR 1.6<\/a> to <a class=\"xref\" href=\"#pq/full/u84\" title=\"Prior Q4 · Unexpected or low load-rating results\">PQ 2.4<\/a> and <a class=\"xref\" href=\"#lr/steel/u68\" title=\"Q56 · How do you address fatigue in a steel-bridge load rating, and how is fatigue life evaluated and communicated?\">LR 5.10<\/a> to <a class=\"xref\" href=\"#lr/qa/u77\" title=\"Q66 · How would you explain a rating factor — or a low rating — to a nontechnical stakeholder?\">LR 4.8<\/a> were merged into the\nmatching Section 2–12 questions (see the merge map); the TS questions\nthat remain are the ones with no equivalent elsewhere.<\/em><\/p>\n<p>Use these questions for oral rehearsal. Each answer should begin with\na direct conclusion, identify the governing CTDOT or MBE framework,\nexplain the decision process, and close with a project example or CTDOT\nbenefit.<\/p>\n", "num": "LR 7.13", "home": ["lr", "ctdot"], "old": "§16"}, {"id": "u118", "title": "What documents govern a CTDOT load rating, and what do you do if guidance conflicts?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix B-Q1.<\/em><\/p>\n<p><strong>Recommended answer<\/strong><\/p>\n<p>We would begin with the current CTDOT Bridge Load Rating Manual and\nCTDOT-specific user guides, rating aids, directives, approved software,\nand vehicle files, then apply the current licensed AASHTO MBE where\nCTDOT has not modified the requirement. If a conflict or ambiguity\nremains, we would document it and obtain Load Rating Supervisor\nconcurrence before proceeding.<\/p>\n<p><strong>Key points to cover<\/strong><\/p>\n<ul>\n<li><p>Confirm the current editions and versions at kickoff.<\/p><\/li>\n<li><p>Use only CTDOT-accepted software versions and vehicle\nfiles.<\/p><\/li>\n<li><p>Document approved exceptions and interpretations, and do not rely\non software defaults or personal memory of prior policy.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> What would you do if the project\nwas started in a newer BrR version than CTDOT accepts? (Re-run in the\naccepted version; see <a class=\"xref\" href=\"#lr/software/u34\" title=\"Q25 · How do you address software errors, version changes, or unexpected output — for example, a BrR upgrade that moves a rating by more than 10%?\">LR 9.2<\/a>.)<\/p>\n", "num": "LR 7.5", "home": ["lr", "ctdot"], "old": "TS-Q1"}, {"id": "u119", "title": "What is the difference between diagnostic and proof load testing?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix B-Q5. Test planning in general is\n<a class=\"xref\" href=\"#lr/low/u23\" title=\"Q13 · What is your approach to material testing, strain gauging, load testing, and instrumentation?\">LR 3.3<\/a>.<\/em><\/p>\n<p><strong>Recommended answer<\/strong><\/p>\n<p>Diagnostic testing uses controlled elastic loads to understand actual\nbehavior and calibrate a model. Proof testing incrementally demonstrates\ncapacity to a defined target and carries greater operational and\nstructural risk.<\/p>\n<p><strong>Key points to cover<\/strong><\/p>\n<ul>\n<li><p>Diagnostic testing examines distribution, continuity, restraint,\nand composite action.<\/p><\/li>\n<li><p>Proof testing requires target loads, stop criteria, monitoring\nfor nonlinearity or residual deformation, traffic control, and emergency\nprocedures.<\/p><\/li>\n<li><p>Neither test validates an unmeasured failure mode merely because\nstrains are low at one location.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> When should proof testing be\nrejected?<\/p>\n", "num": "LR 3.5", "home": ["lr", "low"], "old": "TS-Q8"}, {"id": "u120", "title": "When is reliability-based or WIM-based rating appropriate?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix B-Q6.<\/em><\/p>\n<p><strong>Recommended answer<\/strong><\/p>\n<p>It is appropriate when national traffic assumptions are materially\naffecting a high-consequence decision and high-quality, validated\nsite-specific data can support a more representative live-load model\nwith CTDOT approval.<\/p>\n<p><strong>Key points to cover<\/strong><\/p>\n<ul>\n<li><p>Validate WIM calibration, duration, completeness, lane coverage,\ntruck population, growth, and representativeness.<\/p><\/li>\n<li><p>Keep site-specific live-load characterization distinct from\nmeasured structural response.<\/p><\/li>\n<li><p>Do not alter resistance factors without a separate defensible\nbasis.<\/p><\/li>\n<li><p>Note that CTDOT does not allow site-specific live-load factors in\nroutine ratings; this is an LRS-approval path.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> What minimum data-quality checks\nwould you require?<\/p>\n", "num": "LR 3.6", "home": ["lr", "low"], "old": "TS-Q9"}, {"id": "u121", "title": "How do you estimate remaining useful service life — the service life analysis behind a rehabilitation or replacement decision?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix B-Q7. Expanded in v5 with the full\nservice life analysis method. Sign-structure version is <a class=\"xref\" href=\"#pq/full/u83\" title=\"Prior Q3 · Remaining useful life and deterioration of a sign structure\">PQ 2.3<\/a>; how\nCTDOT uses the result is <a class=\"xref\" href=\"#rh/decide/u30\" title=\"Q20 · How do you decide between rehabilitation and replacement? Does CTDOT have a defined process?\">RH 1.2<\/a>.<\/em><\/p>\n<p><strong>Recommended answer<\/strong><\/p>\n<p>We determine the governing component and deterioration mechanism,\nestablish current condition, project it forward, and define end of life\nat the first structural, operational (functional), or economic\nthreshold. We then compare alternatives on life-cycle cost over a common\nperiod and document the result in the Rehabilitation Study Report.<\/p>\n<p><strong>Key points to cover — define end of life<\/strong><\/p>\n<ul>\n<li><p>Structural: capacity loss, posting, or fatigue life\nexhausted.<\/p><\/li>\n<li><p>Functional: width, clearance, railing, hydraulics, or\nscour.<\/p><\/li>\n<li><p>Economic: maintenance cost exceeds the value of the service life\ngained.<\/p><\/li>\n<li><p>End of life is whichever threshold is crossed first.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to cover — current condition, component by\ncomponent<\/strong><\/p>\n<ul>\n<li>Establish condition and uncertainty separately for the deck,\nsuperstructure, bearings and joints, substructure, and foundations,\nrather than relying on a single bridge-level rating.<\/li>\n<\/ul>\n<p><strong>Key points to cover — model each component’s dominant\nmechanism<\/strong><\/p>\n<ul>\n<li><p>Deck: chloride-induced corrosion, using measured chloride\nprofiles, cover, delaminations, and sounding (method in\n<a class=\"xref\" href=\"#de/concrete/u122\" title=\"TS-Q11 · How would you model chloride-induced deck deterioration?\">DE 3.2<\/a>).<\/p><\/li>\n<li><p>Steel: section-loss rates, coating life, and fatigue remaining\nlife, with Category C and lower details checked for infinite life first\nper the BLRM (<a class=\"xref\" href=\"#lr/steel/u68\" title=\"Q56 · How do you address fatigue in a steel-bridge load rating, and how is fatigue life evaluated and communicated?\">LR 5.10<\/a>).<\/p><\/li>\n<li><p>Concrete substructure: joint leakage, freeze-thaw, and\nchlorides.<\/p><\/li>\n<li><p>Culverts and liners: the BRSDM uses pH and resistivity to\nestimate liner life and requires a 50-year minimum design service life\nfor liners unless CTDOT authorizes less.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to cover — project and align<\/strong><\/p>\n<ul>\n<li><p>Project threshold crossing for each component and present a range\nwhere uncertainty is significant.<\/p><\/li>\n<li><p>Align component lives: the bridge lasts only as long as its\nweakest major component. A new 50-year deck on a steel superstructure\nwith about five years of remaining life is poor value.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to cover — compare alternatives<\/strong><\/p>\n<ul>\n<li><p>Compare do-nothing or preservation only, targeted rehabilitation,\nmajor rehabilitation (such as a new deck or superstructure), and full\nreplacement over a common analysis period, with the service-life\nextension each buys.<\/p><\/li>\n<li><p>For each, integrate initial cost, future rehabilitation cycles,\nmaintenance and inspection, residual value, user costs (closure\nduration, detours, staging), and risk.<\/p><\/li>\n<li><p>Include the non-structural drivers: functional obsolescence,\nscour, hydraulics, seismic needs, MASH railing compliance, and\nutilities.<\/p><\/li>\n<li><p>Record the estimates, alternatives, and LCCA in the RSR so\nCTDOT’s Determination and Report of Meeting rests on a documented basis\n(<a class=\"xref\" href=\"#rh/decide/u30\" title=\"Q20 · How do you decide between rehabilitation and replacement? Does CTDOT have a defined process?\">RH 1.2<\/a>).<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> Would you provide one service-life\nnumber or a range? (A range, with the controlling mechanism and the\nassumptions that drive it.)<\/p>\n", "num": "RH 1.4", "home": ["rh", "decide"], "old": "TS-Q10"}, {"id": "u122", "title": "How would you model chloride-induced deck deterioration?", "kind": "qa", "html": "\n<p><strong>Recommended answer<\/strong><\/p>\n<p>We would use measured chloride profiles and condition data to\nestimate initiation and propagation, while recognizing that a diffusion\nmodel is only as reliable as the field data and exposure\nassumptions.<\/p>\n<p><strong>Key points to cover<\/strong><\/p>\n<ul>\n<li><p>Measure chloride by depth through and beyond\nreinforcement.<\/p><\/li>\n<li><p>Fit diffusion parameters to data rather than using generic\nvalues.<\/p><\/li>\n<li><p>Separate corrosion initiation from damage propagation.<\/p><\/li>\n<li><p>Use sounding, delamination, cover, permeability, drainage, and\nrepair history to calibrate the assessment.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> How would overlays, sealers, or\ncorrosion inhibitors change the projection?<\/p>\n", "num": "DE 3.2", "home": ["de", "concrete"], "old": "TS-Q11"}, {"id": "u123", "title": "Rapid-Fire Study Drills", "kind": "ref", "html": "\n<ul>\n<li><p>Why is φc not a substitute for measured section\nproperties?<\/p><\/li>\n<li><p>What physical behavior does φs represent?<\/p><\/li>\n<li><p>Why can a legal vehicle control when HL-93 does not, or vice\nversa?<\/p><\/li>\n<li><p>What is the difference between a lower rating factor and an\nimmediate safety concern?<\/p><\/li>\n<li><p>What model outputs should be reviewed before trusting a summary\ntable?<\/p><\/li>\n<li><p>When should deck reinforcement be excluded from negative-moment\ncomposite resistance?<\/p><\/li>\n<li><p>What distinguishes a refined analysis intended to improve\naccuracy from one intended only to raise the result?<\/p><\/li>\n<li><p>What are the stop criteria for a proof load test?<\/p><\/li>\n<li><p>How do WIM data and diagnostic strain data answer different\nquestions?<\/p><\/li>\n<li><p>What is the structural versus economic definition of remaining\nservice life?<\/p><\/li>\n<li><p>Why should chloride initiation and propagation be modeled\nseparately?<\/p><\/li>\n<li><p>What makes fatigue-life estimates especially sensitive to traffic\nassumptions?<\/p><\/li>\n<li><p>What must be verified with CTDOT before the interview?<\/p><\/li>\n<\/ul>\n<p><strong>Source note:<\/strong> Sections 15 and 16 were developed from\nthe user-provided CTDOT Load Rating &amp; Design Interview Prep PDF.\nItems identified in that PDF as unverified remain explicitly flagged for\nconfirmation. Exact values and policies must be checked against current\nCTDOT documents and the licensed current AASHTO MBE.<\/p>\n", "num": "LR 7.14", "home": ["lr", "ctdot"], "old": "§16"}, {"id": "u124", "title": "CTDOT-Specific Technical Reference (new in v2)", "kind": "ref", "html": "\n<p>This section collects the CTDOT-specific facts most likely to\nseparate a strong answer from a generic one. Sources are the BLRM\n(Version 2018.1.0), the Rating Aids (2018.1.0), the BRSDM Release 1, the\n2003 BDM Section 14, and the CTDOT Load Rating web page as checked on\nSeptember 24, 2026. Quote numbers only after re-checking the current\ndocument.<\/p>\n", "num": "LR 7.15", "home": ["lr", "ctdot"], "old": "§17"}, {"id": "u125", "title": "Governing Documents and Software — Current Status", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Document or tool<\/th>\n<th>Status as of September 24, 2026<\/th>\n<th>Interview point<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Bridge Load Rating Manual (BLRM)<\/td>\n<td>Version 2018.1.0 (3/29/2018) is still the posted official version. A\nrevision has been discussed with ACEC since 2022 and was targeted for\nfall 2025.<\/td>\n<td>“We work to 2018.1.0 plus current LRS direction, and we are tracking\nthe pending revisions — cross-frame reporting, culvert fill, rating\nstages, CT-TLC.”<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rating Aids, Methodology Sample, BrR User Guide, QA Checklist<\/td>\n<td>2018.1.0<\/td>\n<td>Use the BrR User Guide as binding modeling guidance.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Bridge Load Rating Form<\/td>\n<td>2023.1.0 (12/27/2023)<\/td>\n<td>Fields feed the LRS database; do not override locked fields.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>BRSDM Release 1<\/td>\n<td>Replaces the BDM. Vol. 1 (A: Project Management; B: Miscellaneous\nDesign Provisions, including Load Ratings), Vol. 2 (Structure Design\nRequirements), Vol. 3 (Rehabilitation and Preservation). References a\nseparate volume for overhead sign supports.<\/td>\n<td>Say “BRSDM,” not “Bridge Design Manual.” Engineering Directives and\nBulletins are mandatory and supersede the BRSDM.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Digital Project Development Manual; Digital Design Environment\nGuide<\/td>\n<td>Required for all deliverables; OpenBridge Modeler and OpenRoads\nDesigner CONNECT formats<\/td>\n<td>Load rating packages for design projects are uploaded to ProjectWise\nper the DPDM.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Accepted analysis software<\/td>\n<td>BrR 7.6.1; MIDAS Civil 2025 (2.1); LARSA 4D 2024.R (8.03.02); CANDE\n1.0.0.7; STAAD Pro CONNECT 22.00.00.15; Mathcad 15 M040; Mathcad Prime\n11<\/td>\n<td><strong>Ratings run in versions newer than the Department’s will not\nbe accepted.<\/strong> Software outside BrR still needs LRS approval\n(BLRM 13.1), and proof calculations are still required (12.2.6).<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CTDOT programs<\/td>\n<td>CT-BeamEnd v2.51; CT-LoadFactor v2.0; CT-MPipe v1.5; CT-Fill v1.0;\nCT-LR Review v3.033; CT-BrRResults (2023); <strong>CT-Steel vB3.14,\nreleased 6/30/2026<\/strong><\/td>\n<td>CT-Steel was just updated; mention that the team checks the site for\nprogram updates at every kickoff.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>BrR templates on the website<\/td>\n<td>Created in BrR 7.0.0.3001 (12/2021)<\/td>\n<td>Templates may not match 7.6.1 behavior; verify settings after\nimport.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "num": "LR 7.16", "home": ["lr", "ctdot"], "old": "§17.1"}, {"id": "u126", "title": "CTDOT Rating Vehicles", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Category<\/th>\n<th>Vehicles (gross weight)<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Design<\/td>\n<td>HL-93 truck (72 k, 3 axles); tandem (50 k); 90% truck pair (129.6 k,\n6 axles)<\/td>\n<td>Inventory and Operating are required by FHWA but cannot be used to\nscreen legal or permit ratings (BLRM 4.2.1).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>AASHTO legal<\/td>\n<td>Type 3 (50 k / 25 t); Type 3S2 (72 k / 36 t); Type 3-3 (80 k / 40\nt)<\/td>\n<td>Rated regardless of design results. Notional loads cannot\nsubstitute.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>AASHTO SHVs<\/td>\n<td>SU4 (54 k / 27 t); SU5 (62 k / 31 t); SU6 (69.5 k / 34.75 t); SU7\n(77.5 k / 38.75 t)<\/td>\n<td>The NRL vehicle is not required and cannot substitute for\nSU4–SU7.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CT legal<\/td>\n<td>CT-H20 (40 k / 20 t); CT-HS20 (72 k / 36 t); CT-L3S2 (80 k / 40 t);\nCT-L73.0 legal SHV (73 k / 36.5 t)<\/td>\n<td>For negative moment and interior reactions, and spans over 200 ft:\ntwo CT-L3S2 at 75%, 30 ft apart, plus 0.200 klf lane load instead of the\nAASHTO 3-3 pair. The ADTT &lt; 500 relief in the MBE is removed.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Emergency vehicles<\/td>\n<td>Type EV2 (57.5 k / 28.75 t, single rear axle); Type EV3 (86 k / 43\nt, tandem rear axle)<\/td>\n<td>γLL = 1.30 for all strength limit states; one EV with legal vehicles\nin other lanes for refined analysis; no striped lanes; report axle and\ngross tons.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routine (annual) permits<\/td>\n<td>CT-P76.5 (38.25 t); CT-P120(6) (60 t); CT-P140(7)a/b (70 t);\nCT-P160(8)a/b (80 t)<\/td>\n<td>Multiple presence divided out of approximate distribution factors;\nlever rule limited to two lanes.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Special, single-trip mixed with traffic<\/td>\n<td>CT-P180(9) (90 t); CT-P200(10) (100 t)<\/td>\n<td>CTDOT procedure: run as routine permits first; if below 1.0\n(excluding beam ends and diaphragms), re-run as single-trip mixed with\ntraffic with the governing legal vehicle adjacent (permit γLL overridden\nto 1.00, adjacent 1.10).<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Special, single-trip escorted<\/td>\n<td>CT-P380 (380 k on 19 axles / 190 t)<\/td>\n<td>Lane load may be omitted for escorted permits if ratings are\nlow.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Also in the Rating Aids<\/td>\n<td>CT-P204 (204 k on 8 axles / 102 t)<\/td>\n<td>Not listed in BLRM 4.4.2 — confirm when it applies.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Construction<\/td>\n<td>CT-TLC paving train (279.6 k on 9 axles / 139.8 t)<\/td>\n<td>Special limited crossing, single trip, mixed with traffic, one-lane\ndistribution, IM = 0. Minimum RF 1.10 for new and major rehabilitation\n(BRSDM).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Lane load of 0.200 klf applies to permits for spans over 200 ft,\nnegative moment, and interior reactions with no 300 ft upper limit (BLRM\n4.4.5). Rating tons = GVW × RF; do not use the MBE safe posting\nequation, and use an 80-kip equivalency when a lane load is included\n(4.3.5).<\/p>\n", "num": "LR 2.9", "home": ["lr", "legal"], "old": "§17.2"}, {"id": "u127", "title": "Key BLRM Provisions for Quick Recall", "kind": "ref", "html": "\n<p><strong>General and loads<\/strong><\/p>\n<ul>\n<li><p>LRFR is the only accepted method; exceptions only with prior LRS\napproval (1.3). Judgment ratings are made only by the State Load Rating\nEngineer under narrow conditions (1.3.1).<\/p><\/li>\n<li><p>A new rating is required when a project affects capacity or adds\ncomponents, or when condition or loads change (1.4). All required\ncomponents must be represented; identical members may be enveloped\n(1.5).<\/p><\/li>\n<li><p>Wearing surface: use the average curb reveal from the latest BIR;\notherwise plans; otherwise 6 in. (10 in. for buried structures on state\nand interstate routes). Curb reveals are not “field measured”; only a\ntransverse and longitudinal survey or cores qualify, and only then may\nthe strength load factor drop to 1.25 (2.1.1.2, 2.2.1).<\/p><\/li>\n<li><p>Utilities and cross-frame self-weight get an extra 10% for\nhardware (2.1.1.3, 6.7.2).<\/p><\/li>\n<li><p>Striped lanes are not assumed unless the LRS directs; curbs with\nreveal under 6 in. are mountable; IM is never reduced for riding\nsurface; wind, temperature, and braking are ignored unless requested\n(2.3).<\/p><\/li>\n<\/ul>\n<p><strong>Analysis and factors<\/strong><\/p>\n<ul>\n<li><p>Horizontally curved bridges and skews greater than 30° require a\nrefined method (2D grid, plate and eccentric beam, or 3D). The LRS\ndecides whether FEA is warranted when a line-girder rating falls short\n(3.3.1).<\/p><\/li>\n<li><p>All optional limit-state checks are performed (4.1.1).<\/p><\/li>\n<li><p>Condition factor: always used, in addition to reduced section;\n+0.05 when losses are field measured (maximum 1.00); based on the\nindividual member, not the element-type rating; 1.00 for new members and\nrehabilitation that arrests deterioration (4.1.2).<\/p><\/li>\n<li><p>System factor modifications: single rolled shape treated as\nwelded; internally redundant members as riveted; steel substructure as a\ntwo-girder system; cross-frames and diaphragms in straight bridges may\nuse 1.20 if no bracing member shows distress (4.1.3).<\/p><\/li>\n<li><p>ADTT is one-directional, taken as 55% of bidirectional unless\nsite data exist; growth 0.75% urban, 1.50% rural (4.1.4–4.1.5).\nGeneralized MBE legal load factors with interpolation between 1,000 and\n5,000; site-specific live load factors are not allowed (4.3.4).<\/p><\/li>\n<\/ul>\n<p><strong>Concrete<\/strong><\/p>\n<ul>\n<li><p>Use MBE concrete strengths by year only when records are silent;\nprestressed members +25%; f’ci = 80% of f’c if unknown (5.1.1).<\/p><\/li>\n<li><p>Exposed strands with section loss, separation, or broken wires\nare discounted (5.2.1).<\/p><\/li>\n<li><p>Shear is rated for all levels; if the Simplified Procedure gives\nlow results, use the General Procedure with the longitudinal\nreinforcement check (5.3).<\/p><\/li>\n<li><p>Prestress losses: AASHTO Approximate with defaults (75-year life,\n24-hour transfer, deck at 28 days, 80% humidity); Refined Method if low\nor non-composite; <strong>PCI and lump-sum methods are not\npermitted<\/strong> (5.5.1). NEXT beam distribution follows PCI Northeast\nguidance (5.5.2).<\/p><\/li>\n<\/ul>\n<p><strong>Steel<\/strong><\/p>\n<ul>\n<li><p>Coupon testing requires prior LRS approval; nominal strength =\nmean − 1.65 standard deviations (6.1.2).<\/p><\/li>\n<li><p>Fatigue: Category C and lower checked for infinite life, then\nremaining life at Evaluation 1; peened cover-plate ends are Category C;\nevaluate cover-plate welds at the actual end (6.2).<\/p><\/li>\n<li><p>Beam ends: use CT-BeamEnd; partial-height stiffener crippling may\nfollow the 2015 AISC Engineering Journal method (6.3.1). Web thickness\nis the average at the base of the web within the defined\nlimits.<\/p><\/li>\n<li><p>Gusset plates: do not average thickness over the plate; rate all\ntrusses regardless of redundancy; Ks = 0.33 by default; layered plates\nsummed individually; start with Whitmore and partial shear plane; the\nMBE 6A.6.12.6.11 alternative applies to as-inspected ratings only, and\nto proposed conditions only with LRS approval (6.3.2, 6.8.2.3).<\/p><\/li>\n<li><p>Connections: external connections of non-redundant systems\nalways; redundant systems when there is section loss, distress, or\nchanged conditions; pin and hanger assemblies always; field splices on\nnon-redundant members, with section loss, or where slip has occurred\n(6.8).<\/p><\/li>\n<li><p>Cross-frames and diaphragms are rated for curved bridges and\nskews over 30°; lateral bracing only on request (6.7.1).<\/p><\/li>\n<\/ul>\n<p><strong>Interpretation, buried structures, package, software,\nQA<\/strong><\/p>\n<ul>\n<li><p>Immediate safety threat → notify immediately. Review ratings\nbelow 1.0 for over-conservatism before submitting. Notify the LRS of low\nlegal and permit results (excluding Service III) at submission. Contact\nthe LRS before refining (8.1).<\/p><\/li>\n<li><p>Low legal ratings trigger an LRS posting recommendation to the\nPosting Committee; low permit results go to the Manager of Bridge\nOperations (8.3–8.4).<\/p><\/li>\n<li><p>Buried structures: analyze at the critical fill for each vehicle,\nwhich may be neither the maximum nor the minimum (2 ft is often most\nconservative); assume embankment installation when unknown; at-rest\npressure with φ’ = 30° (10.2–10.3).<\/p><\/li>\n<li><p>Package: standalone, one structure, as-inspected or proposed\ncondition only (no partial or multi-condition); single PDF digitally\ncertified by a Connecticut PE; bookmarked sections in order — Load\nRating Form, RF &lt; 1.0 tables (Strength, Service I, Service II only),\nMethodology, Calculations, Schematics, Program Input, Appendix — plus a\nReferences folder with raw files (12).<\/p><\/li>\n<li><p>Email DOT.BridgeRating@ct.gov with subject\n“StructureNo_ProjectNo_LR Submission-#,” keeping leading zeros\n(12.1.1.2).<\/p><\/li>\n<li><p>Software: BrR unless timber, arches, rigid frames other than 3-\nand 4-sided box culverts, or LRS approval; one program per structure\npreferred; the engineer must review BrR Jira tickets and document\nworkarounds; CANDE requires a Level 3 analysis with at least four load\nsteps (13).<\/p><\/li>\n<li><p>QC/QA: the consultant’s plan is scaled to complexity and\nsubmitted on request; the QC reviewer is independent of the rater; the\nQA reviewer is independent of QC and submits the CTDOT QA Checklist with\nthe package (14).<\/p><\/li>\n<\/ul>\n", "num": "LR 7.17", "home": ["lr", "ctdot"], "old": "§17.3"}, {"id": "u128", "title": "BRSDM — How Load Rating Fits into Design", "kind": "ref", "html": "\n<ul>\n<li><p>“Design Loading Structural Capacity” is a controlling criterion\nabout design to the BDS. An MBE inventory rating cannot be used to show\nit is met. Bridge load rating itself is a non-controlling\ncriterion.<\/p><\/li>\n<li><p>Rehabilitation sub-scopes require a load rating that includes\nbeam-end analysis and construction loading (CT-TLC, BRSDM construction\nloads, and Standard Specification 1.07.05 Load Restrictions). A new\nrating is required for additional critical section loss (As-Inspected\nrating), live loads on file that no longer meet the BLRM, or added dead\nload.<\/p><\/li>\n<li><p><strong>As-Proposed package<\/strong> with the 90% submission; it\nmust be accepted by the LRS before advertising unless a waiver is\nobtained. <strong>As-Constructed package<\/strong> after the semi-final\ninspection and as-builts. The Project Manager is responsible for meeting\nthe minimum rating factors, including conditions found during\nconstruction.<\/p><\/li>\n<li><p>Minor rehabilitation may skip a new rating if a rating on file,\nincluding CT-TLC, reflects the final condition. Resurfacing projects\nmust be checked for paving equipment, and a thicker overlay triggers a\nrating.<\/p><\/li>\n<li><p>Temporary bridges: all vehicle classes; design inventory not\nrequired for service under 3 years; CT-TLC not required if not exposed;\nthe rating package is part of the contractor’s working drawings and is\nreviewed by the project’s designer, not the LRS; notify the LRS by email\n(“Temporary Bridge Working Drawing Review Completed”).<\/p><\/li>\n<li><p>Condition factor 1.00 for new bridges and for existing members\nrestored to good condition; for minor rehabilitation, use actual\ncondition and notify CTDOT if below 0.95. System factors tied to BDS\nload modifiers are not allowed. Legal and permit load factors for new\nand superstructure-replacement bridges use ADTT greater than\n5,000.<\/p><\/li>\n<\/ul>\n<p><strong>Minimum acceptable rating factors (BRSDM Vol.\n1B)<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Rating<\/th>\n<th>New or superstructure replacement<\/th>\n<th>Major rehabilitation<\/th>\n<th>Minor rehabilitation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Design, Inventory<\/td>\n<td>1.20<\/td>\n<td>1.20 (note 1)<\/td>\n<td>Report value; may be &lt; 1.00<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Design, Operating<\/td>\n<td>Report<\/td>\n<td>Report<\/td>\n<td>1.00 (note 2)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Legal<\/td>\n<td>1.20<\/td>\n<td>1.20 (note 2)<\/td>\n<td>1.00 (note 2)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Permit<\/td>\n<td>1.20<\/td>\n<td>1.20 (note 2)<\/td>\n<td>Report value; may be &lt; 1.00<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Permit, CT-TLC<\/td>\n<td>1.10<\/td>\n<td>1.10 (note 2)<\/td>\n<td>Report value; may be &lt; 1.00<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Emergency vehicle<\/td>\n<td>1.20<\/td>\n<td>1.20 (note 2)<\/td>\n<td>1.00 (note 2)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Note 1: between 1.00 and 1.20 requires a bridge design variance;\nbelow 1.00 requires a design exception. Note 2: below the target\nrequires a design variance. The table applies to Strength, Service, and\nFatigue (fatigue falls under design inventory). Temporary bridges need\n1.00 for all. The CT-TLC target is lower because the load comes from\nCTDOT’s own projects and can be controlled before it crosses the\nbridge.<\/p>\n", "num": "DE 10.1", "home": ["de", "rating"], "old": "§17.4"}, {"id": "u129", "title": "Sign Support Requirements (2003 BDM Section 14 — verify against current BRSDM volume)", "kind": "ref", "html": "\n<ul>\n<li><p>One statewide design wind speed of 120 mph for all sign\nsupports.<\/p><\/li>\n<li><p>Structure-mounted supports: 3D analysis except for the simplest\ncases; pin-connected truss idealization with checks on connection\neccentricity; M270 Grade 36 angles and WTs (minimum L4×4×3/8); hot-dip\ngalvanized; A325 bolts mechanically galvanized; carriage bolts through\nconcrete.<\/p><\/li>\n<li><p>Discouraged on skews over 30°; sign height up to about twice the\nframe height; at least 12 in. above the lowest fascia component; WT\nhangers at no more than 6 ft, 1 to 3 ft from the sign edge.<\/p><\/li>\n<li><p>Standard tubular and truss overhead and cantilever supports come\nfrom traffic standard sheets. Altered details, non-extruded-aluminum\nsigns (VMS), and any support mounted on a bridge or wall require full\ndesign by the structural designer, including the foundation.<\/p><\/li>\n<li><p>Working and shop drawings are required and reviewed by the\ndesigner. Welding for sign supports follows AWS D1.1 and the LTS\nspecification.<\/p><\/li>\n<\/ul>\n", "num": "DE 6.3", "home": ["de", "signs"], "old": "§17.5"}, {"id": "u130", "title": "Quick Calculations Worth Knowing", "kind": "ref", "html": "\n<ul>\n<li><p><strong>Curved deck on straight girders.<\/strong> The mid-span\noffset of a curved deck edge from a straight chord is about m = L² /\n(8R). A 40-ft span at R = 2,500 ft gives 1,600 / 20,000 = 0.08 ft ≈ 1.0\nin., which matches the edge of the 1-inch zone in the ACEC study graph.\nA 100-ft span at R = 1,000 ft gives 1.25 ft — clearly worth\nmodeling.<\/p><\/li>\n<li><p><strong>Paving train.<\/strong> The contractor’s SB-3000 trains in\nthe project files carry about 69.9 k and 67.3 k on the MTV axles, with\ntotal train weights around 260–270 k over 85 ft. The CT-TLC is 279.6 k\non 9 axles, so total weight is similar, but the concentrated MTV axles\ncan govern short spans, floor systems, and deck elements.<\/p><\/li>\n<li><p><strong>Rating tons.<\/strong> Legal rating tons = GVW (tons) ×\nRF. For example, CT-L3S2 at RF 0.85 → 40 × 0.85 = 34 tons.<\/p><\/li>\n<li><p><strong>ADTT.<\/strong> Bidirectional ADT 20,000 with 8% trucks →\nADTT = 1,600; one direction = 0.55 × 1,600 = 880.<\/p><\/li>\n<\/ul>\n", "num": "LR 7.18", "home": ["lr", "ctdot"], "old": "§17.6"}, {"id": "u131", "title": "Familiarity with Codes, Standards, Manuals, and Specifications", "kind": "ref", "html": "\n<p>The solicitation scoring includes familiarity with applicable codes,\nspecifications, and guidance. A strong response should go beyond listing\ndocuments. It should show that HDR understands how requirements are\nresearched, interpreted, converted into practical procedures and\ndetails, independently verified, implemented by practitioners, and\nmaintained as codes and owner policies evolve.<\/p>\n<p><strong>Potential interview question<\/strong><\/p>\n<p>Describe your team’s familiarity with the codes, specifications,\nmanuals, and guidance documents applicable to bridge design, inspection,\nand load rating. How will you keep the work current and resolve\nconflicts or ambiguities? What experience does HDR have developing or\nimplementing these types of documents?<\/p>\n<p><strong>Recommended opening response<\/strong><\/p>\n<p>Our familiarity with codes goes beyond applying provisions on\nindividual projects. HDR personnel have helped write, update, interpret,\nand implement national specifications, state bridge design manuals,\nload-rating and inspection guidance, standard details, digital-delivery\nstandards, and technical reference manuals. That experience helps us\nunderstand the intent behind the requirements, recognize where\nprovisions need owner interpretation, and translate the governing\ncriteria into clear, consistent, and reviewable project procedures for\nCTDOT.<\/p>\n", "num": "DE 8.2", "home": ["de", "codes"], "old": "§18"}, {"id": "u132", "title": "Core response points", "kind": "ref", "html": "\n<p>At the start of each task order, establish a documented\ngoverning-criteria matrix covering the current CTDOT Bridge Design\nManual, Bridge Load Rating Manual, BrR guidance, standard\nspecifications, special provisions, digital-delivery requirements,\nengineering directives, AASHTO LRFD Bridge Design Specifications, AASHTO\nManual for Bridge Evaluation, FHWA requirements, and structure-specific\nreferences.<\/p>\n<p>Apply the owner hierarchy first. Where CTDOT modifies or supplements\nAASHTO or FHWA criteria, CTDOT requirements control. Where a conflict,\ngap, or unusual condition remains, document the issue and obtain CTDOT\nconcurrence rather than relying on an undocumented interpretation.<\/p>\n<p>Use code-development experience to understand the technical intent\nand research behind provisions, but never treat participation in code\nwriting as authority to depart from the adopted CTDOT criteria.<\/p>\n<p>Convert the criteria into task-specific design assumptions, rating\nplans, software settings, checklists, hold points, standard details, and\nindependent verification calculations.<\/p>\n<p>Track code editions, interim revisions, owner bulletins, software\nversions, vehicle libraries, and changes that may affect ongoing work.\nAssess the effect of a change before applying it mid-task.<\/p>\n<p>Keep a clear audit trail showing the governing provision, owner\nmodification, interpretation, approval, and implementation in the\ncalculations, model, plans, specifications, and final report.<\/p>\n", "num": "DE 8.3", "home": ["de", "codes"], "old": "§18"}, {"id": "u133", "title": "HDR experience developing and implementing guidance", "kind": "ref", "html": "\n<ul>\n<li><p>PennDOT Design Manual Part 4: HDR developed a new appendix\nimplementing NCHRP 12-79 recommendations for selecting line-girder,\nimproved two-dimensional, and three-dimensional finite-element methods\nfor curved and skewed steel I-girder bridges. HDR also developed\nguidance for torsional-property and cross-frame modeling refinements and\nrecommendations for cross-frame layout and fit-up.<\/p><\/li>\n<li><p>PennDOT Design Manual Part 4, Section 6: HDR updated guidance to\nincorporate the AASHTO LRFD Bridge Design Specifications, 8th Edition,\nincluding fatigue load factors, shear-stud spacing, bolted splices,\nprimary and secondary member classifications, System Redundant Members,\nand deck-placement displacement checks for systems with three or fewer\ngirders. HDR also prepared cross-frame design examples and an\nindependent-verification spreadsheet.<\/p><\/li>\n<li><p>PennDOT Standard Detail BD-619M: HDR revised the standard to\nestablish a consistent cross-frame and diaphragm design and detailing\nmethod for straight, skewed, curved, and curved/skewed steel-girder\nbridges.<\/p><\/li>\n<li><p>PennDOT Digital Delivery Directive 2025: HDR serves as Prime\nConsultant and bridge-domain lead for openBIM implementation,\nengineering specifications, electronic contract-document workflows, and\nstandardized open-data requirements for as-built bridge information\nmodels.<\/p><\/li>\n<li><p>South Carolina DOT: Following FHWA corrective and improvement\nplans, HDR authored statewide Bridge Inspection Guidance and Bridge Load\nRating Guidance documents, including policies and procedures. The work\nincluded staff interviews, field observations, report and plan review,\nnationwide benchmarking, NBI data evaluation, FHWA metric review, and\nseparate procedures for multiple inspection and rating types. The\nguidance was reviewed and approved by FHWA.<\/p><\/li>\n<li><p>Timber bridge inspection: HDR developed policies covering\ninspection frequency, sounding, resistance drilling, and condition\nassessment, and supported Minnesota DOT’s integration of advanced timber\ninspection techniques consistent with NBIS requirements.<\/p><\/li>\n<li><p>FHWA tunnel guidance: HDR personnel helped develop the Tunnel\nOperations, Maintenance, Inspection, and Evaluation Manual,\nSpecifications for the National Tunnel Inventory, Reference Guide for\nLoad Rating of Tunnel Structures, supplemental examples, and related\nNational Highway Institute training.<\/p><\/li>\n<li><p>Bridge Welding Reference Manual: Tony Ream served as Project\nManager and co-author for FHWA’s comprehensive reference on bridge\nwelding.<\/p><\/li>\n<li><p>LRFD Specifications for Noncomposite Steel Box Sections: Tony\nReam managed and supported development of specifications incorporated\ninto the AASHTO LRFD framework, coordinated research, reviewed\nprovisions for clarity and usability, and developed design\nexamples.<\/p><\/li>\n<li><p>Steel Bridge Design Handbook: HDR led updates to 13 chapters for\nconsistency with the 9th Edition AASHTO LRFD Bridge Design\nSpecifications.<\/p><\/li>\n<li><p>NSBA/AASHTO collaboration and AASHTO committee support: HDR\npersonnel contributed to guidance for steel bent caps, truss analysis,\ncross-frame design, lean-on bracing, and multiple steel-design\nprovisions involving splices, lateral-torsional buckling, tension-flange\nfracture, redundancy, member classification, slip, stability bracing,\nnoncomposite boxes, and tub-girder compression and stiffening.<\/p><\/li>\n<li><p>NHDOT bridge inspection manual (added in v3): Kris Kretsch\nassisted NHDOT in updating its inspection manual and prepared sections\naddressing bridge inspection requirements, QA/QC, inspection procedures,\nevaluation procedures, and critical findings to comply with current FHWA\nbridge inspection requirements.<\/p><\/li>\n<li><p>National Highway Institute instruction (added in v3): Deanna\nNevling teaches NHI courses nationally, including Load and Resistance\nFactor Rating of Highway Bridges, LRFD for Highway Bridge\nSuperstructures, and LRFD and Analysis of Curved Steel Highway Bridges.\nThis is direct evidence that the team teaches the rating method CTDOT\nrequires.<\/p><\/li>\n<\/ul>\n", "num": "PM 1.4", "home": ["pm", "why"], "old": "§18"}, {"id": "u134", "title": "How this experience benefits CTDOT", "kind": "ref", "html": "\n<ul>\n<li><p>Better interpretation: the team understands how research findings\nbecome enforceable provisions and where engineering judgment remains\nnecessary.<\/p><\/li>\n<li><p>Practical implementation: HDR has experience turning high-level\nrequirements into usable procedures, details, examples, spreadsheets,\nchecklists, and training materials.<\/p><\/li>\n<li><p>Consistency: manual-development experience helps establish common\napproaches across multiple task orders and reviewers.<\/p><\/li>\n<li><p>Early identification of gaps: the team is more likely to\nrecognize obsolete references, conflicts between owner and national\nrequirements, software limitations, and provisions that require owner\nconcurrence.<\/p><\/li>\n<li><p>Constructability and usability: because HDR has developed\nguidance for practicing designers, inspectors, raters, fabricators, and\nowners, the team focuses on documents that can be applied and\nindependently checked, not merely technically correct\nnarrative.<\/p><\/li>\n<li><p>Continuous improvement: lessons learned from task orders can be\norganized into proposed clarifications, checklists, or recommendations\nfor CTDOT without changing policy unless directed by CTDOT.<\/p><\/li>\n<\/ul>\n", "num": "PM 1.5", "home": ["pm", "why"], "old": "§18"}, {"id": "u135", "title": "Recommended project examples to mention", "kind": "ref", "html": "\n<ul>\n<li><p>Use the PennDOT curved and skewed steel-girder manual updates to\nshow familiarity with analysis-method selection, refined analysis,\ncross-frame behavior, and conversion of research into practical owner\nguidance.<\/p><\/li>\n<li><p>Use the SCDOT Bridge Load Rating Guidance Document to show\nstatewide load-rating policy development, FHWA coordination, different\nmaterial and structure procedures, and implementation across staff and\nconsultants.<\/p><\/li>\n<li><p>Use the FHWA/AASHTO steel work to show national specification and\nhandbook experience, especially if the panel asks about complex steel\ndesign, connections, fatigue, welding, or code changes.<\/p><\/li>\n<li><p>Use the PennDOT digital-delivery initiative if the question\nexpands from design codes to electronic contract documents, asset\ninformation standards, openBIM, or implementation of new delivery\nrequirements.<\/p><\/li>\n<\/ul>\n", "num": "PM 1.6", "home": ["pm", "why"], "old": "§18"}, {"id": "u136", "title": "Suggested concise response", "kind": "ref", "html": "\n<p><em>“<strong>We routinely work under CTDOT, AASHTO, and FHWA\nrequirements, but HDR’s experience goes beyond applying the codes. Our\nstaff have helped develop PennDOT bridge design-manual provisions for\ncurved and skewed steel girders, statewide SCDOT bridge inspection and\nload-rating guidance, FHWA tunnel and welding references, AASHTO-related\nsteel design provisions, and updates to 13 chapters of the Steel Bridge\nDesign Handbook. That gives us insight into the intent behind the\nprovisions and, more importantly, experience translating research and\nnational requirements into practical owner procedures, standard details,\nexamples, and independent checks. For this contract, we would establish\nthe governing criteria at kickoff, document CTDOT modifications, obtain\nconcurrence on ambiguities, and maintain traceability from the governing\nprovision through the model, calculations, plans, specifications, and\nfinal rating package.<\/strong>”<\/em><\/p>\n<p><strong>Likely follow-up questions<\/strong><\/p>\n<ul>\n<li><p>Give an example of a code provision that can be misapplied if the\nengineer does not understand its intent.<\/p><\/li>\n<li><p>How would you resolve a conflict between the CTDOT manual, AASHTO\nMBE, and software defaults?<\/p><\/li>\n<li><p>How do you keep a multioffice team consistent when code\ninterpretations differ?<\/p><\/li>\n<li><p>What is the difference between writing a technically correct\nmanual and writing one that practitioners can use?<\/p><\/li>\n<li><p>How would lessons learned under this contract be converted into\nproposed guidance without changing CTDOT policy?<\/p><\/li>\n<li><p>Which member of the proposed team has direct code or\nmanual-development experience, and what will that person do on this\ncontract?<\/p><\/li>\n<li><p>How would you implement a new AASHTO interim revision in an\nactive task order?<\/p><\/li>\n<li><p>How do you verify that a spreadsheet or design example\naccompanying a manual is correct and maintainable?<\/p><\/li>\n<\/ul>\n<p><strong>Source basis:<\/strong>\nHDR_Manuals_and_Standards_Narrative.docx and Email From Nick B..pdf\nsupplied by the user. Before the interview, verify project names, dates,\ndocument titles, staff roles, and whether each cited individual is\nincluded in or available to support the proposed team.<\/p>\n", "num": "DE 8.4", "home": ["de", "codes"], "old": "§18"}, {"id": "u137", "title": "Beyond AASHTO: PCI, ACI, ASTM, and AISC (added in v2)", "kind": "ref", "html": "\n<p>Criterion 2c names “AASHTO, PCI, ACI, ASTM, AISC, etc.” The proposal\nanswered almost entirely in AASHTO and FHWA terms. Be ready to show\nwhere each family of documents enters CTDOT bridge work, and where CTDOT\ndeliberately limits its use.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Organization<\/th>\n<th>Where it enters CTDOT bridge work<\/th>\n<th>Talking point<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>PCI<\/td>\n<td>Precast and prestressed design (PCI Bridge Design Manual); PCI\nNortheast standards for deck units, box beams, and NEXT beams; precast\nplant certification<\/td>\n<td>CTDOT’s BLRM directs NEXT beam D and F distribution factors to PCI\nNortheast guidance, <strong>but it does not permit PCI or lump-sum\nprestress loss methods for rating<\/strong> — use the AASHTO Approximate\nor Refined method. Knowing where the owner accepts and rejects an\nindustry document is the point.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ACI<\/td>\n<td>Non-bridge structures (buildings, platforms, facilities) under ACI\n318; concrete repair (ACI 562 repair code, 546 repair guide);\ndurability, curing, cold and hot weather concreting practices behind the\nStandard Specifications<\/td>\n<td>Bridges use AASHTO LRFD Section 5, but repair design, platform and\nstation structures (such as the Waterbury platforms), and material\ndurability draw on ACI. Mixing ACI and AASHTO load and resistance\nfactors in one check is a common error.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ASTM<\/td>\n<td>Material specifications and test methods: A709/AASHTO M270\nstructural steel, A615/A706 reinforcement, A767 galvanized and A775/A934\nepoxy-coated bars, F3125 bolts, A123 and F2329 galvanizing, E8 tension\ncoupons, C39 cylinders, C42 cores<\/td>\n<td>Material testing for a rating follows ASTM methods. CTDOT converts\ncoupon results to a nominal value of mean − 1.65σ.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>AISC<\/td>\n<td>Steel Construction Manual for connection checks; Design Guides;\nEngineering Journal research; Code of Standard Practice for\nfabrication<\/td>\n<td>The BLRM cites the 2015 AISC Engineering Journal paper on web\ncrippling with partial-depth stiffeners for beam-end ratings. AISC\nmethods are used where AASHTO is silent, for example certain connection\nlimit states, with documentation and LRS concurrence.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>AWS<\/td>\n<td>D1.5 Bridge Welding Code for bridges; D1.1 for sign supports and\nancillary structures<\/td>\n<td>Tony Ream co-authored FHWA’s Bridge Welding Reference Manual.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>AREMA<\/td>\n<td>Railroad bridges and railroad clearances<\/td>\n<td>Railroad bridge ratings are not currently handled by the CTDOT Load\nRating Section or covered by the BLRM; HDR’s MBTA and Amtrak work covers\nAREMA.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>v6 pointer:<\/strong> the personal and project layer for this\ncriterion — HDR’s Building Engineering Services group, the CTDOT\nWaterbury Branch Line stations under the CT State Building Code, Mario’s\nSE, and the AISC vs. AASHTO resistance factor comparison — is in <a class=\"xref\" href=\"#pm/you/u217\" title=\"§27.48 · Codes beyond AASHTO — building codes and the SE (added October 3)\">PM 4.2<\/a>,\nwith a fuller suggested answer.<\/p>\n<p><strong>Suggested response:<\/strong> “AASHTO governs the bridge\nitself, but the supporting documents matter. We use ASTM for every\nmaterial and test method, PCI and PCI Northeast for precast products,\nAISC for connection and web-crippling checks where AASHTO is silent —\nCTDOT’s own manual cites an AISC Engineering Journal method for beam\nends — and ACI for repair and non-bridge structures. We also know where\nCTDOT draws lines, such as not accepting PCI prestress-loss methods in a\nrating.”<\/p>\n", "num": "DE 8.5", "home": ["de", "codes"], "old": "§18"}, {"id": "u138", "title": "Additive Revision Control", "kind": "ref", "html": "\n<p>Future revisions to this guide should be additive unless the user\nexplicitly requests deletions, condensation, replacement, or\nreorganization. Before each revision, compare the proposed source\ndocument with this consolidated master and confirm that all existing\nnumbered sections, prior-round questions, study-guide content, and\nresponse details remain present.<\/p>\n<p>Use this consolidated document as the master source.<\/p>\n<p>Append new material in a new numbered section or expand the existing\nrelevant section without deleting prior content.<\/p>\n<p>If duplicate content is consolidated for readability, preserve every\nunique technical point and identify the change in the revision note.<\/p>\n<p>Retain exact prior-round questions, source cautions, and verification\nlists.<\/p>\n", "num": "VN 4.14", "home": ["vf", "about"], "old": "§19"}, {"id": "u139", "title": "Revision Log", "kind": "ref", "html": "\n<ul>\n<li><p><strong>Revision v2 (September 2026):<\/strong> restored condensed\ncontent from the Study and Q&amp;A, Technology, and original versions;\nfilled <a class=\"xref\" href=\"#lr/ctdot/u124\" title=\"§17 · CTDOT-Specific Technical Reference (new in v2)\">LR 7.15<\/a>; added Sections 20–25 and new CTDOT-specific material\nin Sections 1, 12, and 18; made question labels unique. No prior content\nwas removed.<\/p><\/li>\n<li><p><strong>Revision v3 (September 28, 2026):<\/strong> merged the\nPractice Session 1 mock-interview debrief as <a class=\"xref\" href=\"#vf/about/u165\" title=\"§26 · Mock Interview Debrief: Practice Session 1 (September 28, 2026)\">VN 4.16<\/a> (renumbered from\n20), added CTDOT checks from the BLRM and BRSDM, added pointers under\nthe related questions, added the tub girder story to Sections 22 and 23,\nadded a speaker note in <a class=\"xref\" href=\"#strat/probes/u160\" title=\"§24 · Speaker Assignment Matrix\">IS 4.4<\/a> and verification items in <a class=\"xref\" href=\"#vf/verify/u161\" title=\"§25 · Verify before the interview\">VN 1.1<\/a>,\nand added the Kretsch (NHDOT manual) and Nevling (NHI courses) items to\nSection 18. No prior content was removed.<\/p><\/li>\n<li><p><strong>Revision v4 (September 28, 2026), at the user’s\nrequest:<\/strong> duplicate and near-duplicate questions were merged\ninto single questions whose bullets combine every unique point from each\nversion (see the Question Merge Map). The condensed appendix answers\n(A-Q, B-Q) and the alternate prior-round wordings (Appendix C) were\nfolded into the full questions, and Appendix C was removed. <a class=\"xref\" href=\"#lr/steel/u71\" title=\"Q59 · Beam ends with section loss are driving the rating. How do you evaluate them?\">LR 5.11<\/a> (beam\nends) was corrected to give CT-BeamEnd with BrR output as the CTDOT\nanswer. A programmatic check confirmed no technical point was dropped;\noverlapping bullets were combined rather than repeated.<\/p><\/li>\n<li><p><strong>Revision v5 (September 28, 2026):<\/strong> expanded <a class=\"xref\" href=\"#rh/decide/u30\" title=\"Q20 · How do you decide between rehabilitation and replacement? Does CTDOT have a defined process?\">RH 1.2<\/a>\n(CTDOT rehabilitation-versus-replacement process), <a class=\"xref\" href=\"#rh/decide/u121\" title=\"TS-Q10 · How do you estimate remaining useful service life — the service life analysis behind a rehabilitation or replacement decision?\">RH 1.4<\/a> (service life\nanalysis), and <a class=\"xref\" href=\"#lr/software/u34\" title=\"Q25 · How do you address software errors, version changes, or unexpected output — for example, a BrR upgrade that moves a rating by more than 10%?\">LR 9.2<\/a> (10th Edition LTB changes in BrR 7.6/7.6.1); added a\npointer in the <a class=\"xref\" href=\"#lr/ctdot/u140\" title=\"§20 · Current CTDOT Load Rating Issues — ACEC Liaison Meetings, 2022–2025\">LR 7.19<\/a> BrR row. No content removed.<\/p><\/li>\n<li><p><strong>Revision v6 (October 3, 2026):<\/strong> merged the\ntalking-points document from Practice Sessions 2–5 as <a class=\"xref\" href=\"#vf/about/u169\" title=\"§27 · Mock Interview Talking Points by Topic (Practice Sessions 2–5, September 29 – October 1, 2026)\">VN 4.18<\/a> and the\nproject write-ups as <a class=\"xref\" href=\"#pr/how/u218\" title=\"§28 · Project Evidence — Mario’s Project Stories\">PR 1.2<\/a>; consolidated the verification items\ninto Section 25. No content removed.<\/p><\/li>\n<\/ul>\n", "num": "VN 4.15", "home": ["vf", "about"], "old": "§19"}, {"id": "u140", "title": "Current CTDOT Load Rating Issues — ACEC Liaison Meetings, 2022–2025", "kind": "ref", "html": "\n<p>The CTDOT/ACEC Design Process Subcommittee load rating meetings show\nwhat the Load Rating Section (LRS) is actually concerned about.\nReferring to these topics — accurately and without overstating — signals\nthat the team knows CTDOT’s current practice rather than a generic MBE\nprocess.<\/p>\n<p><strong>People.<\/strong> CTDOT attendees have included Andrew (Andy)\nCardinali, Ashley Heredia, Hari Panta, Jacob Platt, Bao Chuong, Bart\nSweeney, and Li Xuesong. Some may sit on the panel. HDR’s Peter Wu\nattended the August 2022, January 2023, and March 2024 meetings — a\nlegitimate point that HDR is engaged in CTDOT’s load-rating process\nimprovements. (Note that the file labeled January 15, 2026 duplicates\nthe July 2025 minutes.)<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Topic (meetings)<\/th>\n<th>What CTDOT and ACEC discussed<\/th>\n<th>How to use it in the interview<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cross-frames and diaphragms rating low in skewed bridges\n(2022–2024)<\/td>\n<td>Common fix is to remove low-rated members and re-run; converges in\nabout 3–4 iterations but is labor-intensive. Code changes (K-factors,\nsingle-angle compression, connection capacity) are a cause; deformed\ncross-frames have been found in the field, so they do act as primary\nmembers. <strong>Pending manual change: diaphragms for straight girders\nskewed more than 30° will still be rated but reported in a separate\ncomponent summary table, and iteration to convergence will no longer be\nrequired.<\/strong><\/td>\n<td>Explain the iteration, why it happens, and the pending change.\nSuggest agreeing on the number of iterations at scoping, with a check-in\npoint before extra effort.<\/td>\n<\/tr>\n<tr class=\"even\">
