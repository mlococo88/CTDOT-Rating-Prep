<style>
:root{
  --paper:#F6F7F5; --surface:#FFFFFF; --ink:#1C2326; --muted:#5B6668; --rule:#D9DEDB;
  --sign:#00603A; --sign-ink:#FFFFFF; --sign-edge:#004A2C; --amber:#F2A900; --amber-ink:#3A2A00; --amber-soft:#FFF3CC;
  --mark:#FFE58A; --link:#00603A;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#121715; --surface:#1A201E; --ink:#E4E8E6; --muted:#9AA5A1; --rule:#2E3633;
  --sign:#0B6E44; --sign-ink:#FFFFFF; --sign-edge:#07502F; --amber:#F2B321; --amber-ink:#2B1F00; --amber-soft:#3A3012;
  --mark:#6B5A10; --link:#5CC898; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#121715; --surface:#1A201E; --ink:#E4E8E6; --muted:#9AA5A1; --rule:#2E3633;
  --sign:#0B6E44; --sign-ink:#FFFFFF; --sign-edge:#07502F; --amber:#F2B321; --amber-ink:#2B1F00; --amber-soft:#3A3012;
  --mark:#6B5A10; --link:#5CC898; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
header.top{background:var(--sign);color:var(--sign-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:10;border-bottom:3px solid var(--sign-edge)}
.top-inner{max-width:1100px;margin:0 auto;padding:12px 20px 0}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.shield{border:2px solid var(--sign-ink);border-radius:6px;padding:2px 9px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:.005em;line-height:1.1}
.search{margin-left:auto;flex:1 1 240px;max-width:360px;position:relative}
.search input{width:100%;font:500 16px/1 var(--display);padding:9px 34px 9px 12px;border-radius:6px;border:2px solid var(--sign-ink);background:var(--sign-edge);color:var(--sign-ink)}
.search input::placeholder{color:rgba(255,255,255,.75)}
.search input:focus{outline:3px solid var(--amber);outline-offset:1px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--sign-ink);font-size:20px;cursor:pointer;padding:4px 8px;display:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;font-family:var(--display);font-weight:600;font-size:16px;color:var(--sign-ink);background:transparent;border:0;border-radius:6px 6px 0 0;padding:9px 13px 10px;cursor:pointer;opacity:.82;white-space:nowrap}
nav.tabs button:hover{opacity:1;background:rgba(255,255,255,.08)}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);opacity:1}
nav.tabs button:focus-visible{outline:3px solid var(--amber);outline-offset:-3px}
nav.tabs .count{font-weight:500;opacity:.7;margin-left:5px;font-size:14px}
nav.subs{background:var(--paper);border-bottom:1px solid var(--rule);position:sticky;top:var(--hdr,112px);z-index:9}
.subs-inner{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.subs-inner::-webkit-scrollbar{display:none}
nav.subs button{flex:0 0 auto;font:600 15px var(--display);color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
nav.subs button:hover{border-color:var(--sign)}
nav.subs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
nav.subs button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
nav.subs .count{font-weight:500;opacity:.65;margin-left:5px;font-size:13px}
.crumb{font:600 15px var(--display);color:var(--muted);margin:0 0 2px}
.also{font:500 13px var(--display);color:var(--muted);margin:0 0 0 22px;padding:0 0 12px}
.also a{color:var(--link)}
main{max-width:1100px;margin:0 auto;padding:26px 20px 80px}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.panel-head h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:0}
.panel-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.tools button{font:600 15px var(--display);background:var(--surface);color:var(--ink);border:1.5px solid var(--rule);border-radius:6px;padding:7px 12px;cursor:pointer}
.tools button:hover{border-color:var(--sign)}
.tools button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h3.group{font-family:var(--display);font-weight:600;font-size:19px;color:var(--muted);margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--rule)}
details.unit{background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--rule);border-radius:4px;margin:0 0 8px}
details.unit[data-kind="tp"]{border-left-color:var(--sign)}
details.unit[data-kind="qa"]{border-left-color:#7C8A86}
details.unit.has-verify summary .vflag{display:inline-block}
summary{list-style:none;cursor:pointer;padding:12px 16px 12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:3px solid var(--amber);outline-offset:-3px}
summary .tag{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);min-width:3.6em}
summary .t{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.25}
summary .chev{font-family:var(--display);color:var(--muted);transition:transform .15s}
details[open] summary .chev{transform:rotate(90deg)}
.vflag{display:none;font:700 12px var(--display);background:var(--amber);color:var(--amber-ink);border-radius:3px;padding:1px 6px;margin-left:8px;vertical-align:2px}
.where{font:500 14px var(--display);color:var(--muted);margin-left:8px}
.body{padding:2px 22px 18px 22px;max-width:78ch}
.body p{margin:.6em 0}
.body ul,.body ol{padding-left:1.3em;margin:.5em 0}
.body li{margin:.3em 0}
.body li>p{margin:.2em 0}
.body strong{font-weight:600}
.body h1,.body h2,.body h3,.body h4{font-family:var(--display);font-size:18px;margin:1.1em 0 .3em}
.body blockquote{margin:.8em 0;padding:.2em 1em;border-left:3px solid var(--rule);color:var(--muted)}
.body code{font-size:.9em}
.tablewrap{overflow-x:auto;margin:.8em 0;max-width:100%}
.body table{border-collapse:collapse;font-size:15px;line-height:1.45;min-width:420px}
.body th,.body td{border:1px solid var(--rule);padding:7px 9px;vertical-align:top;text-align:left}
.body th{font-family:var(--display);font-weight:600;font-size:15px;background:var(--paper)}
.verify{background:var(--amber-soft);border:1px solid var(--amber);border-radius:3px;padding:0 4px;font-family:var(--display);font-weight:600;font-size:.88em}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font:500 14px var(--display);color:var(--muted);margin:12px 0 0}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.empty{padding:30px 0;color:var(--muted)}
.res-tab{font:600 14px var(--display);color:var(--link);margin-left:8px}
a.xref{color:var(--link);font-family:var(--display);font-weight:600;font-size:.92em;white-space:nowrap;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;background:var(--paper);border-radius:3px;padding:0 3px}
a.xref:hover{text-decoration-thickness:2px}
a.xref:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
summary .old{display:block;font:500 13px var(--display);color:var(--muted);margin-top:2px}
summary .tag{white-space:nowrap}
details.unit.flash{box-shadow:0 0 0 3px var(--amber);transition:box-shadow .3s}
.notes{background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--amber);border-radius:4px;padding:10px 14px 10px;margin:14px 0 4px}
.notes label{display:block;font:600 15px var(--display);margin-bottom:6px}
.notes textarea{width:100%;min-height:52px;resize:vertical;font:16px/1.5 var(--body);color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:4px;padding:8px 10px;overflow:hidden}
.notes textarea:focus{outline:3px solid var(--amber);outline-offset:1px;border-color:var(--amber)}
.note-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font:500 13px var(--display);color:var(--muted)}
.note-bar .saved{margin-right:auto}
.note-bar button{font:600 13px var(--display);background:none;color:var(--link);border:0;padding:4px 2px;cursor:pointer;text-decoration:underline}
.note-bar button:focus-visible{outline:3px solid var(--amber)}
.subnum{font-weight:500;opacity:.6;margin-right:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button.listen{background:var(--sign);color:var(--sign-ink);border-color:var(--sign-edge)}
.hearbtn{font:600 14px var(--display);background:none;color:var(--link);border:1.5px solid var(--rule);border-radius:999px;padding:4px 12px;margin:10px 0 2px;cursor:pointer}
.hearbtn:focus-visible{outline:3px solid var(--amber)}
details.unit.speaking{border-color:var(--sign);box-shadow:0 0 0 2px var(--sign)}
#player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(0,0,0,.25);display:none}
#player.on{display:block}
body.playing{padding-bottom:170px}
.pl-inner{max-width:1100px;margin:0 auto}
.pl-now{font:600 15px/1.3 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-now small{display:block;font-weight:500;opacity:.7;font-size:13px}
.pl-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.pl-row button,.pl-row select{font:700 18px var(--display);background:transparent;color:var(--paper);border:2px solid currentColor;border-radius:8px;min-width:52px;height:52px;padding:0 12px;cursor:pointer}
.pl-row button.main{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);min-width:76px;font-size:24px}
.pl-row select{font:500 14px var(--display);max-width:190px;height:44px;min-width:0}
.pl-row select option{color:#000}
.pl-row label{font:500 14px var(--display);display:flex;align-items:center;gap:6px;cursor:pointer}
.pl-row label input{width:20px;height:20px}
.pl-row .x{margin-left:auto}
.pl-row button:focus-visible,.pl-row select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (max-width:640px){.pl-row{gap:8px}.pl-row button{min-width:56px;height:56px}.pl-row button.main{flex:1}.pl-row select{max-width:none;flex:1 1 30%}body.playing{padding-bottom:210px}}
nav.tabs,nav.subs{display:none!important}
.top-inner{max-width:1440px}
.top-inner{padding-bottom:12px}
.menubtn{background:none;border:1.5px solid var(--sign-ink);color:var(--sign-ink);border-radius:6px;font:600 18px/1 var(--display);padding:6px 9px;cursor:pointer}
.menubtn:focus-visible,.themebtn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);max-width:1440px;margin:0 auto}
body.tree-hidden .layout{grid-template-columns:minmax(0,1fr)}
body.tree-hidden aside#tree{display:none}
.layout main{max-width:1100px;margin:0;width:100%}
aside#tree{position:sticky;top:var(--hdr,64px);height:calc(100vh - var(--hdr,64px));overflow:auto;border-right:1px solid var(--rule);padding:12px 10px 60px 12px;background:var(--paper);overscroll-behavior:contain}
body.playing aside#tree{padding-bottom:200px}
.tree-tools{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:0 4px 10px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.tree-h{font:700 16px var(--display);margin-right:auto}
.tree-tools button{font:600 13px var(--display);background:none;border:0;color:var(--link);padding:2px 0;cursor:pointer;text-decoration:underline}
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{margin-left:14px;border-left:1px solid var(--rule);padding-left:4px}
ul.tree li.shut>ul{display:none}
.tree .row{display:flex;align-items:flex-start;gap:2px;border-radius:4px}
.tree .tw{flex:0 0 22px;height:24px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:12px;line-height:24px}
.tree .tw::before{content:"▾"}
.tree li.shut>.row>.tw::before{content:"▸"}
.tree a{display:block;flex:1;color:var(--ink);text-decoration:none;padding:3px 6px;border-radius:4px;font-family:var(--display);line-height:1.25}
.tree a:hover{background:var(--surface)}
.tree a:focus-visible,.tree .tw:focus-visible{outline:3px solid var(--amber);outline-offset:-2px}
.tree li.l1>.row>a{font-weight:700;font-size:16px;padding-top:5px;padding-bottom:5px}
.tree li.l2>.row>a{font-weight:600;font-size:15px}
.tree li.leaf>a{font-size:14px;font-weight:500;margin-left:22px;color:var(--ink)}
.tree li.leaf.xl>a{color:var(--muted);font-style:italic}
.tree .n{color:var(--muted);font-weight:600;margin-right:5px;font-style:normal;white-space:nowrap}
.tree .ct{color:var(--muted);font-weight:500;font-size:12px;margin-left:5px}
.tree .nm{color:var(--amber);margin-left:5px;font-size:12px}
.tree .active>a,.tree li.leaf.active>a{background:var(--surface);box-shadow:inset 3px 0 0 var(--sign)}
.tree li.l2.cur>.row>a{background:var(--surface);box-shadow:inset 3px 0 0 var(--sign)}
.pager{display:flex;justify-content:space-between;gap:12px;margin:30px 0 0;padding-top:14px;border-top:1px solid var(--rule);font:600 15px var(--display)}
.pager a{color:var(--link);max-width:48%}
.pager a.nx{text-align:right;margin-left:auto}
.scrim{display:none}
.tree-tools .tclose{display:none;font-size:18px;text-decoration:none;color:var(--ink);padding:0 4px}
@media (max-width:900px){
  .layout{display:block}
  aside#tree,body.tree-hidden aside#tree{display:block;position:fixed;top:0;left:0;bottom:0;height:auto;width:min(88vw,380px);z-index:40;transform:translateX(-104%);transition:transform .2s;box-shadow:4px 0 24px rgba(0,0,0,.3);padding-top:calc(12px + env(safe-area-inset-top,0px))}
  body.tree-open aside#tree{transform:none}
  .tree-tools{position:sticky;top:calc(-12px - env(safe-area-inset-top,0px));background:var(--paper);z-index:1;padding-top:6px}
  .tree-tools .tclose{display:inline-block}
  body.tree-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .tree a{padding:6px 6px}.tree .tw{height:32px;line-height:32px;flex-basis:28px}
}
@media (prefers-reduced-motion:reduce){aside#tree{transition:none}}
@media print{aside#tree,.menubtn,.pager{display:none}.layout{display:block}}
footer{max-width:1100px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font:500 14px var(--display)}
.themebtn{background:none;border:1.5px solid var(--sign-ink);color:var(--sign-ink);border-radius:6px;font:600 16px/1 var(--display);padding:6px 9px;cursor:pointer}
@media (max-width:640px){
  .menubtn{padding:4px 7px;font-size:15px}
  .subs-inner{padding:8px 14px}
  nav.subs button{font-size:14px;padding:5px 11px}
  body{font-size:16px}
  .top-inner{padding:10px 14px 0}
  .brand{gap:8px 10px}
  .brand h1{font-size:19px}
  .shield{font-size:13px;padding:1px 7px}
  .themebtn{margin-left:auto;padding:4px 7px;font-size:14px}
  .search{max-width:none;flex-basis:100%;order:3;margin-left:0}
  .search input{padding:7px 34px 7px 10px}
  nav.tabs{margin-top:8px}
  nav.tabs button{padding:8px 11px 9px;font-size:15px}
  .panel-head h2{font-size:28px}
  summary{grid-template-columns:1fr auto;padding:11px 12px}
  summary .tag{grid-column:1/-1;margin-bottom:-8px}
  .body{padding:0 14px 14px}
}
@media (prefers-reduced-motion:reduce){summary .chev{transition:none}}
@media print{header.top,.tools,.note-bar,#player,.hearbtn{display:none} details.unit{break-inside:avoid}}
</style>

<script id="data" type="application/json">{"units": [{"id": "u0", "title": "Primary objective", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 100%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Primary objective<\/strong> — Demonstrate a local,\nimmediately available team that can deliver routine and complex bridge\ndesign and load-rating assignments with disciplined quality control,\npractical engineering judgment, early communication of risk, and command\nof current CTDOT requirements.<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div>\n", "num": "IS 2.1", "home": ["strat", "messages"], "old": ""}, {"id": "u1", "title": "Revision v6 Summary", "kind": "ref", "html": "\n<ul>\n<li><strong>New <a class=\"xref\" href=\"#vf/about/u169\" title=\"§27 · Mock Interview Talking Points by Topic (Practice Sessions 2–5, September 29 – October 1, 2026)\">VN 4.18<\/a> — Mock Interview Talking Points by\nTopic.<\/strong> The full talking-points document from Practice Sessions\n2–5 (September 29 – October 1, 2026): the answer habits (<a class=\"xref\" href=\"#strat/delivery/u170\" title=\"§27.0 · How to use this section, and habits that win every answer\">IS 1.1<\/a>), 47 topic\nsections (27.1–27.36, 27.38–27.48), and the coaching corrections made in\nsession. None of this was in v5. Entirely new ground includes seismic in\nConnecticut (<a class=\"xref\" href=\"#de/seismic/u192\" title=\"§27.22 · Seismic design and evaluation in Connecticut\">DE 4.1<\/a>), deck overlays (<a class=\"xref\" href=\"#rh/deck/u193\" title=\"§27.23 · Deck overlays and rehabilitation materials\">RH 2.1<\/a>), scour and POAs (<a class=\"xref\" href=\"#rh/scour/u195\" title=\"§27.25 · Scour, Item 113 and Plans of Action\">RH 6.2<\/a>),\nhistoric rigid frames (<a class=\"xref\" href=\"#lr/concrete/u196\" title=\"§27.26 · Historic concrete rigid frames\">LR 6.2<\/a>), railroad shielding (<a class=\"xref\" href=\"#de/rail/u197\" title=\"§27.27 · Work over active railroads — outages and shielding\">DE 5.2<\/a>), stream\nsimulation culverts (<a class=\"xref\" href=\"#de/culverts/u198\" title=\"§27.28 · Culvert replacement and stream simulation\">DE 7.1<\/a>), MSE wall diagnosis and the excavation and\nshoring detail (<a class=\"xref\" href=\"#rh/scour/u199\" title=\"§27.29 · MSE walls — diagnosis and repair\">RH 6.3<\/a>), and Strength I vs. Strength II with rating limit\nstates by material (<a class=\"xref\" href=\"#lr/fund/u200\" title=\"§27.30 · Rating limit states by material\">LR 1.1<\/a>).<\/li>\n<li><strong>New from the October 1 afternoon session:<\/strong> joint\nelimination on a 1970s steel bridge (<a class=\"xref\" href=\"#rh/joints/u207\" title=\"§27.38 · Joint elimination on a 1960s–70s continuous steel bridge (practiced 10/1)\">RH 3.5<\/a>), scope growth plus a low\nrating and when the NBIS clock actually starts (<a class=\"xref\" href=\"#pm/delivery/u208\" title=\"§27.39 · Scope growth plus a low rating in the same 48 hours (practiced 10/1)\">PM 3.1<\/a>), the “disagreed\nwith a client” behavioral answer using the Summer Street saw cut\n(<a class=\"xref\" href=\"#pm/you/u209\" title=\"§27.40 · &quot;Tell us about a time you disagreed with a client&quot; (practiced 10/1 — use the Summer Street saw cut)\">PM 4.1<\/a>), rating a 1955 riveted bridge with no plans (<a class=\"xref\" href=\"#lr/steel/u210\" title=\"§27.41 · Rating a 1955 riveted built-up bridge with no rating on file (practiced 10/1)\">LR 5.4<\/a>), the cracked\nprestressed fascia girder (<a class=\"xref\" href=\"#lr/concrete/u211\" title=\"§27.42 · Prestressed fascia girder with a longitudinal crack and rust staining (practiced 10/1)\">LR 6.3<\/a>), bascule seating diagnostics (<a class=\"xref\" href=\"#rh/special/u212\" title=\"§27.43 · Bascule span slow to seat, locks will not drive home (practiced 10/1)\">RH 7.1<\/a>),\ncomposite action after a deck replacement with the Strength I\nvs. Service II staging point (<a class=\"xref\" href=\"#lr/steel/u213\" title=\"§27.44 · Composite or non-composite after a deck replacement (practiced 10/1)\">LR 5.5<\/a>), the non-redundant 1.15 rating\n(<a class=\"xref\" href=\"#lr/low/u214\" title=\"§27.45 · Non-redundant two-girder bridge rating 1.15 — &quot;is that good enough?&quot; (practiced 10/1)\">LR 3.2<\/a>), the three-gate fatigue evaluation sequence (<a class=\"xref\" href=\"#lr/steel/u215\" title=\"§27.46 · Fatigue evaluation — the full sequence (walked through 10/1)\">LR 5.6<\/a>), the MBE 4th\nEdition release (<a class=\"xref\" href=\"#lr/ctdot/u216\" title=\"§27.47 · MBE 4th Edition — released late September 2026\">LR 7.1<\/a>), and codes beyond AASHTO — building codes, the\nWaterbury stations, and the SE (<a class=\"xref\" href=\"#pm/you/u217\" title=\"§27.48 · Codes beyond AASHTO — building codes and the SE (added October 3)\">PM 4.2<\/a>, added October 3).<\/li>\n<li><strong>New <a class=\"xref\" href=\"#pr/how/u218\" title=\"§28 · Project Evidence — Mario’s Project Stories\">PR 1.2<\/a> — Project Evidence.<\/strong> Summer Street,\nNiantic River, GRS-IBS, Powder Point, Bass River, and Pell Bridge, with\nguidance on entering a project story as the reason for an answer rather\nthan a credential bolted on. Niantic River is identified as the “CTDOT\ntub girder project” left open in 26.2.<\/li>\n<li><strong><a class=\"xref\" href=\"#vf/verify/u161\" title=\"§25 · Verify before the interview\">VN 1.1<\/a><\/strong> now carries one consolidated\nverification list, adding the talking-points checklist items and the\nproject facts to confirm.<\/li>\n<li>Revision is additive per Section 19. Nothing in Sections 1–26 or the\nappendices was removed or reworded; only the title line, the revision\nlog, and the <a class=\"xref\" href=\"#vf/verify/u161\" title=\"§25 · Verify before the interview\">VN 1.1<\/a> verification list were edited.<\/li>\n<\/ul>\n", "num": "VN 4.1", "home": ["vf", "about"], "old": ""}, {"id": "u2", "title": "Revision v5 Summary", "kind": "ref", "html": "\n<ul>\n<li><p><strong><a class=\"xref\" href=\"#rh/decide/u30\" title=\"Q20 · How do you decide between rehabilitation and replacement? Does CTDOT have a defined process?\">RH 1.2<\/a><\/strong> now answers “Does CTDOT have a defined\nprocess for rehabilitation versus replacement?” It adds the two-level\nprocess: network-level asset management (TAMP life-cycle planning,\ninspection and rating inputs, the treatment ladder) and the\nproject-level BRSDM process (submission sequence, Bridge Rehabilitation\nStudy elements, the 13 sub-scopes, load-rating triggers, the Design\nLoading Structural Capacity gate, design exceptions, and Structure Type\nStudy LCCA), plus a soundbite.<\/p><\/li>\n<li><p><strong><a class=\"xref\" href=\"#rh/decide/u121\" title=\"TS-Q10 · How do you estimate remaining useful service life — the service life analysis behind a rehabilitation or replacement decision?\">RH 1.4<\/a><\/strong> now carries the full service life\nanalysis method: end-of-life definitions, component-by-component\ncondition and deterioration modeling, aligning component lives, and\nalternatives compared on life-cycle cost.<\/p><\/li>\n<li><p><strong><a class=\"xref\" href=\"#lr/software/u34\" title=\"Q25 · How do you address software errors, version changes, or unexpected output — for example, a BrR upgrade that moves a rating by more than 10%?\">LR 9.2<\/a><\/strong> now lists the AASHTO LRFD 10th Edition\nlateral-torsional buckling changes implemented in BrR 7.6/7.6.1, and the\n<a class=\"xref\" href=\"#lr/ctdot/u140\" title=\"§20 · Current CTDOT Load Rating Issues — ACEC Liaison Meetings, 2022–2025\">LR 7.19<\/a> BrR row points to it.<\/p><\/li>\n<li><p>New content was written into the existing questions rather than\nadded as new questions, so no duplicates were created. Nothing was\nremoved.<\/p><\/li>\n<\/ul>\n", "num": "VN 4.2", "home": ["vf", "about"], "old": ""}, {"id": "u3", "title": "Revision v4 Summary", "kind": "ref", "html": "\n<p>At your request, this revision removes duplicate questions. Where two\nor more questions asked the same thing, or were very similar, they were\nmerged into one question. Each merged question keeps every unique point\nfrom every version, reorganized under short sub-headings so nothing is\nsaid twice. The other phrasings are listed as “Also asked as” under the\nquestion so you can still recognize them when the panel words them\ndifferently.<\/p>\n<p><strong>What changed<\/strong><\/p>\n<ul>\n<li><p>The guide went from 171 question entries to 73 distinct\nquestions. 98 entries were folded in: 47 condensed or alternate-wording\nappendix answers, 6 practice-prompt restatements, and 45 near-duplicate\nquestions in the main sections. 48 of the surviving questions now carry\nmerged content. Question labels were kept, so some numbers are now\nabsent; the map below shows where each one went, and each section that\nlost a question has a one-line note.<\/p><\/li>\n<li><p>The condensed answers in Appendices A and B (<a class=\"xref\" href=\"#pm/why/u11\" title=\"Q1 · Why is your team the best choice for this contract?\">PM 1.1<\/a> to <a class=\"xref\" href=\"#pm/delivery/u41\" title=\"Q34 · CTDOT requests rapid turnaround, but information is incomplete.\">PM 3.2<\/a>, <a class=\"xref\" href=\"#lr/ctdot/u118\" title=\"TS-Q1 · What documents govern a CTDOT load rating, and what do you do if guidance conflicts?\">LR 7.5<\/a>\nto <a class=\"xref\" href=\"#lr/qa/u77\" title=\"Q66 · How would you explain a rating factor — or a low rating — to a nontechnical stakeholder?\">LR 4.8<\/a>) and the alternate prior-round wordings in Appendix C were\nmerged into the full questions. Appendix C was removed; Appendices A and\nB keep their non-question quick-review material.<\/p><\/li>\n<li><p>The question-specific parts of the Practice Session 1 debrief\n(old 26.2 to 26.12) now sit inside the questions they supplemented.\n<a class=\"xref\" href=\"#vf/about/u165\" title=\"§26 · Mock Interview Debrief: Practice Session 1 (September 28, 2026)\">VN 4.16<\/a> keeps the delivery notes, the verification list, and the\nrevision note.<\/p><\/li>\n<li><p><strong><a class=\"xref\" href=\"#lr/steel/u71\" title=\"Q59 · Beam ends with section loss are driving the rating. How do you evaluate them?\">LR 5.11<\/a> (beam ends) corrected:<\/strong> the answer is now\nCTDOT’s CT-BeamEnd spreadsheet with the BrR reactions and shears\nimported into it (BLRM 6.3.1 and 13.8.4), with the recommended spoken\nresponse written out.<\/p><\/li>\n<li><p>Two near-duplicate rapid-fire drills (software version checks)\nwere combined.<\/p><\/li>\n<li><p>A programmatic comparison of every bullet in the absorbed\nversions against the merged text was run, and the few points not yet\ncarried over were added.<\/p><\/li>\n<\/ul>\n<p><strong>What was left as separate questions on purpose:<\/strong>\nrelated but distinct questions stay separate and cross-reference each\nother — for example, <a class=\"xref\" href=\"#lr/ctdot/u22\" title=\"Q12 · How do you handle missing plans or uncertain material properties?\">LR 7.3<\/a> (missing information generally) and <a class=\"xref\" href=\"#lr/low/u27\" title=\"Q18 · A low rating is driven by incomplete documentation or a conservative assumption. How do you proceed?\">LR 3.4<\/a> (when\nit produces a low rating), <a class=\"xref\" href=\"#lr/low/u23\" title=\"Q13 · What is your approach to material testing, strain gauging, load testing, and instrumentation?\">LR 3.3<\/a> (test planning) and <a class=\"xref\" href=\"#lr/low/u119\" title=\"TS-Q8 · What is the difference between diagnostic and proof load testing?\">LR 3.5<\/a> (diagnostic\nversus proof testing), <a class=\"xref\" href=\"#lr/steel/u24\" title=\"Q15 · How do you address curved or highly skewed bridges?\">LR 5.8<\/a> (curved and skewed bridges) and <a class=\"xref\" href=\"#lr/steel/u142\" title=\"N1 · Cross-frames on a skewed steel bridge are rating below 1.0. How do you handle it?\">LR 5.12<\/a> (low-rated\ncross-frames). The short rapid-fire drills in Sections 11 and 16 also\nstay, since they are 30-second re-asks meant for oral practice.<\/p>\n<p><strong>Question Merge Map<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\"/>\n<col style=\"width: 50%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Now answered under<\/th>\n<th>Absorbed from<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a> — concurrent task orders and availability<\/td>\n<td><a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a>, <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a>, <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a>, <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a>, <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a>, debrief <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><a class=\"xref\" href=\"#lr/ctdot/u13\" title=\"Q3 · What is your approach when CTDOT assigns a new load rating?\">LR 7.2<\/a> — approach to a new load rating<\/td>\n<td><a class=\"xref\" href=\"#lr/ctdot/u13\" title=\"Q3 · What is your approach when CTDOT r Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a> — MIDAS/LARSA rating and model validation<\/td>\n<td><a class=\"xref\" href=\"#pq/full/u85\" title=\"Prior Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a>, <a class=\"xref\" href=\"#pq/full/u85\" title=\"Prior Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a>, <a class=\"xref\" href=\"#pq/full/u85\" title=\"Prior Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a>, debrief <a class=\"xref\" href=\"#pq/full/u85\" title=\"Prior Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a> validation notes, <a class=\"xref\" href=\"#pq/full/u85\" title=\"Prior Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><a class=\"xref\" href=\"#rh/decide/u87\" title=\"PR-Q7 · Reuse of a substructure, foundation, or other bridge component\">RH 1.3<\/a>, <a class=\"xref\" href=\"#con/emergency/u88\" title=\"PR-Q10 · Emergency structural finding\">CN 3.1<\/a><\/td>\n<td>their practice-prompt versions<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><a class=\"xref\" href=\"#lr/ctdot/u118\" title=\"TS-Q1 · What documents govern a CTDOT load rating, and what do you do if guidance conflicts?\">LR 7.5<\/a>, <a class=\"xref\" href=\"#lr/low/u119\" title=\"TS-Q8 · What is the difference between diagnostic and proof load testing?\">LR 3.5<\/a>, <a class=\"xref\" href=\"#lr/low/u120\" title=\"TS-Q9 · When is reliability-based or WIM-based rating appropriate?\">LR 3.6<\/a>, <a class=\"xref\" href=\"#rh/decide/u121\" title=\"TS-Q10 · How do you estimate remaining useful service life — the service life analysis behind a rehabilitation or replacement decision?\">RH 1.4<\/a><\/td>\n<td><a class=\"xref\" href=\"#lr/ctdot/u118\" title=\"TS-Q1 · What documents govern a CTDOT load rating, and what do you do if guidance conflicts?\">LR 7.5<\/a>, <a class=\"xref\" href=\"#lr/low/u119\" title=\"TS-Q8 · What is the difference between diagnostic and proof load testing?\">LR 3.5<\/a>, <a class=\"xref\" href=\"#lr/low/u120\" title=\"TS-Q9 · When is reliability-based or WIM-based rating appropriate?\">LR 3.6<\/a>, <a class=\"xref\" href=\"#rh/decide/u121\" title=\"TS-Q10 · How do you estimate remaining useful service life — the service life analysis behind a rehabilitation or replacement decision?\">RH 1.4<\/a><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><a class=\"xref\" href=\"#pm/why/u11\" title=\"Q1 · Why is your team the best choice for this contract?\">PM 1.1<\/a>, Q8–Q10, <a class=\"xref\" href=\"#lr/steel/u24\" title=\"Q15 · How do you address curved or highly skewed bridges?\">LR 5.8<\/a>, <a class=\"xref\" href=\"#pm/delivery/u29\" title=\"Q19 · Describe your approach to a bridge replacement or rehabilitation task order.\">PM 3.5<\/a>, <a class=\"xref\" href=\"#con/submittals/u31\" title=\"Q22 · How will you review contractor submittals and RFIs?\">CN 1.2<\/a>, <a class=\"xref\" href=\"#con/stage/u32\" title=\"Q23 · Tell us about a construction-stage problem and how you resolved it.\">CN 2.1<\/a>, <a class=\"xref\" href=\"#pm/staffing/u36\" title=\"Q27 · John McKenna is relatively new to HDR. How will you ensure continuity and internal support?\">PM 2.3<\/a>, <a class=\"xref\" href=\"#pm/staffing/u37\" title=\"Q28 · What work will Mario LoCoco personally perform on this contract?\">PM 2.4<\/a>, <a class=\"xref\" href=\"#lr/ctdot/u39\" title=\"Q31 · Inspection information conflicts with the plans. Which do you use?\">LR 7.4<\/a>, <a class=\"xref\" href=\"#pm/delivery/u41\" title=\"Q34 · CTDOT requests rapid turnaround, but information is incomplete.\">PM 3.2<\/a><\/td>\n<td>the matching condensed A-Q answers<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "num": "VN 4.3", "home": ["vf", "about"], "old": ""}, {"id": "u4", "title": "Revision v3 Summary", "kind": "ref", "html": "\n<p>This revision merges the Practice Session 1 guide produced in a\nseparate session (CONSOLIDATED_Rev_Mock1). A paragraph-by-paragraph\ncomparison showed its Sections 1–19 were already fully contained in\nMaster v2; its only new material was the mock-interview debrief (its\n<a class=\"xref\" href=\"#lr/ctdot/u140\" title=\"§20 · Current CTDOT Load Rating Issues — ACEC Liaison Meetings, 2022–2025\">LR 7.19<\/a>). Nothing in this guide was removed or reworded.<\/p>\n<p><strong>What was added<\/strong><\/p>\n<ul>\n<li><p><a class=\"xref\" href=\"#vf/about/u165\" title=\"§26 · Mock Interview Debrief: Practice Session 1 (September 28, 2026)\">VN 4.16<\/a>: the mock-interview debrief, verbatim, renumbered from\n20 (<a class=\"xref\" href=\"#lr/ctdot/u140\" title=\"§20 · Current CTDOT Load Rating Issues — ACEC Liaison Meetings, 2022–2025\">LR 7.19<\/a> here is the ACEC section). It covers answer length and\ndelivery, phrases to avoid, additions to <a class=\"xref\" href=\"#lr/ctdot/u13\" title=\"Q3 · What is your approach when CTDOT assigns a new load rating?\">LR 7.2<\/a>, <a class=\"xref\" href=\"#lr/software/u14\" title=\"Q5 · How do you determine whether to use BrR or a refined finite-element model, and when is refinement worth the cost?\">LR 9.1<\/a>, <a class=\"xref\" href=\"#lr/steel/u21\" title=\"Q11 · How do you account for deterioration and section loss — for example, on a deteriorated steel-girder bridge?\">LR 5.7<\/a>, <a class=\"xref\" href=\"#rh/decide/u30\" title=\"Q20 · How do you decide between rehabilitation and replacement? Does CTDOT have a defined process?\">RH 1.2<\/a>, <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a>, <a class=\"xref\" href=\"#lr/low/u27\" title=\"Q18 · A low rating is driven by incomplete documentation or a conservative assumption. How do you proceed?\">LR 3.4<\/a>,\n<a class=\"xref\" href=\"#lr/steel/u71\" title=\"Q59 · Beam ends with section loss are driving the rating. How do you evaluate them?\">LR 5.11<\/a>, <a class=\"xref\" href=\"#lr/qa/u77\" title=\"Q66 · How would you explain a rating factor — or a low rating — to a nontechnical stakeholder?\">LR 4.8<\/a>, <a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a>, and <a class=\"xref\" href=\"#rh/decide/u30\" title=\"Q20 · How do you decide between rehabilitation and replacement? Does CTDOT have a defined process?\">RH 1.2<\/a>, a prior-round-style scenario on\nunexpected rating results, the CTDOT tub girder story, and a new drill\nquestion on durability in rehabilitation (labeled <a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a>).<\/p><\/li>\n<li><p>“CTDOT check” notes inside <a class=\"xref\" href=\"#vf/about/u165\" title=\"§26 · Mock Interview Debrief: Practice Session 1 (September 28, 2026)\">VN 4.16<\/a> tying the debrief to the\nBLRM and BRSDM: the LRS decides when FEA is needed (3.3.1),\nrefined-analysis reporting (12.2.5.1), CT-BeamEnd as CTDOT’s beam-end\ntool (6.3.1), condition-factor rules (4.1.2), and the BRSDM Bridge\nRehabilitation Study and RSR. Three of the debrief’s “verify” items are\nresolved from the project files.<\/p><\/li>\n<li><p>Pointers under each related question, plus notes in Sections 9,\n22, 23, 24, and 25.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#de/codes/u131\" title=\"§18 · Familiarity with Codes, Standards, Manuals, and Specifications\">DE 8.2<\/a>: the two held updates — Kris Kretsch’s NHDOT\ninspection-manual sections and Deanna Nevling’s NHI courses.<\/p><\/li>\n<\/ul>\n<p><strong>Two things to decide<\/strong><\/p>\n<ul>\n<li><p><a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a> speaker: the mock had Mario answer it; <a class=\"xref\" href=\"#strat/probes/u160\" title=\"§24 · Speaker Assignment Matrix\">IS 4.4<\/a> still\nlists Kris Kretsch or June Wu. The table was left unchanged.<\/p><\/li>\n<li><p>The debrief’s beam-end workflow exported loads to Mathcad or\nExcel; CTDOT’s own procedure is CT-BeamEnd, which imports BrR loads. The\nnote in <a class=\"xref\" href=\"#lr/steel/u71\" title=\"Q59 · Beam ends with section loss are driving the rating. How do you evaluate them?\">LR 5.11<\/a> suggests leading with CT-BeamEnd. <strong>Resolved in\nv4:<\/strong> <a class=\"xref\" href=\"#lr/steel/u71\" title=\"Q59 · Beam ends with section loss are driving the rating. How do you evaluate them?\">LR 5.11<\/a> now gives CT-BeamEnd with BrR output as the\nanswer.<\/p><\/li>\n<\/ul>\n", "num": "VN 4.4", "home": ["vf", "about"], "old": ""}, {"id": "u5", "title": "Revision v2 Summary", "kind": "ref", "html": "\n<p>This revision uses the CONSOLIDATED guide as the master and follows\nits <a class=\"xref\" href=\"#vf/about/u138\" title=\"§19 · Additive Revision Control\">VN 4.14<\/a> additive-revision rule. Nothing from the prior master was\ndeleted. Content the CONSOLIDATED version had condensed has been\nrestored from the earlier Study and Q&amp;A, Technology, and original\nversions.<\/p>\n<p><strong>What was restored<\/strong><\/p>\n<ul>\n<li><p>Sections 1–10: the fuller Study and Q&amp;A versions, including\nthe evaluation-weight table, suggested closings, “likely follow-up”\nnotes, source notes, the panel-challenge table, the example response,\nand the rehearsal worksheet tables.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#strat/probes/u80\" title=\"§12 · Prior-Round CTDOT Questions and Detailed Responses\">IS 4.5<\/a>: the “Suggested lead responder” line for each\nprior-round question and follow-ups that had been dropped.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#strat/rehearsal/u86\" title=\"§13 · Additional Questions Modeled on the Prior-Round Style\">IS 3.14<\/a>: four prior-round-style practice questions that had\nbeen dropped (submittal deviation, instrumentation, digital delivery,\nimproving task-order delivery) and the rehearsal-priority list.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#de/digital/u92\" title=\"§14 · Digital design and delivery\">DE 9.2<\/a>: the full emerging-technologies answer, example list,\nfollow-ups, suggested closing, and reference basis.<\/p><\/li>\n<li><p>Sections 15–16: the fuller technical study guide (factor table,\nposting concepts, escalation ladder, service-life models) and all 15\ntechnical practice questions with the rapid-fire drills.<\/p><\/li>\n<\/ul>\n<p><strong>What is new<\/strong><\/p>\n<ul>\n<li><p><a class=\"xref\" href=\"#strat/messages/u7\" title=\"§1 · Evaluation Priorities and Core Messages\">IS 2.2<\/a> now includes a criterion-by-criterion evidence map tied\nto the solicitation weights.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#strat/probes/u80\" title=\"§12 · Prior-Round CTDOT Questions and Detailed Responses\">IS 4.5<\/a> now includes CTDOT-specific points for each\nprior-round question drawn from the BLRM, BRSDM, and 2003 BDM.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#lr/ctdot/u124\" title=\"§17 · CTDOT-Specific Technical Reference (new in v2)\">LR 7.15<\/a> (previously an empty slot): CTDOT-Specific Technical\nReference — document status, accepted software versions, the full CTDOT\nvehicle fleet with weights, key BLRM and BRSDM provisions, minimum\nrating factors, and sign-support requirements.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#de/codes/u131\" title=\"§18 · Familiarity with Codes, Standards, Manuals, and Specifications\">DE 8.2<\/a> now addresses the PCI, ACI, ASTM, and AISC documents\nnamed in the solicitation, which the proposal did not cover\ndirectly.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#lr/ctdot/u140\" title=\"§20 · Current CTDOT Load Rating Issues — ACEC Liaison Meetings, 2022–2025\">LR 7.19<\/a>: What CTDOT’s Load Rating Section has been discussing\nwith ACEC (2022–2025) and how to use it in answers.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#lr/ctdot/u141\" title=\"§21 · New Interview Questions from the v2 Review (N1–N22)\">LR 7.9<\/a>: 22 new questions (N1–N22) with recommended responses\nbuilt from the review.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#strat/probes/u154\" title=\"§22 · Proposal Consistency Check and Likely Probes\">IS 4.3<\/a>: Proposal consistency check and likely\nprobes.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#pm/you/u155\" title=\"§23 · Mario LoCoco — Personal Answer Bank\">PM 4.3<\/a>: Mario’s personal answer bank.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#strat/probes/u160\" title=\"§24 · Speaker Assignment Matrix\">IS 4.4<\/a>: Speaker assignment matrix.<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#vf/verify/u161\" title=\"§25 · Verify before the interview\">VN 1.1<\/a>: Final 48-hour checklist, numbers to know, and\nquestions to ask the panel.<\/p><\/li>\n<\/ul>\n<p><strong>Labeling change.<\/strong> Question labels are now unique\nacross the guide: Q1–Q66 (Sections 2–11), Prior Q1–Q5 (<a class=\"xref\" href=\"#strat/probes/u80\" title=\"§12 · Prior-Round CTDOT Questions and Detailed Responses\">IS 4.5<\/a>),\nPR-Q6–PR-Q15 (<a class=\"xref\" href=\"#strat/rehearsal/u86\" title=\"§13 · Additional Questions Modeled on the Prior-Round Style\">IS 3.14<\/a>), TS-Q1–TS-Q15 (<a class=\"xref\" href=\"#lr/ctdot/u117\" title=\"§16 · Practice Questions Based on the Technical Study Guide\">LR 7.13<\/a>), and N1–N22\n(<a class=\"xref\" href=\"#lr/ctdot/u141\" title=\"§21 · New Interview Questions from the v2 Review (N1–N22)\">LR 7.9<\/a>). v3 adds <a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a> (<a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a>). v4 merged duplicate and\nnear-duplicate questions; labels were kept, so some numbers are now\nabsent — see the Question Merge Map in the Revision v4 Summary.<\/p>\n<p><strong>Key corrections to earlier assumptions<\/strong><\/p>\n<ul>\n<li><p>The CTDOT Bridge Design Manual (BDM) has been replaced by the\nBridge and Roadway Structures Design Manual (BRSDM), Release 1. Refer to\nthe BRSDM in answers; cite the BDM only for history.<\/p><\/li>\n<li><p>As of September 24, 2026, the CTDOT Load Rating web page still\nposts BLRM Version 2018.1.0 as the official manual, even though a\nrevision was targeted for fall 2025. The Department’s accepted BrR\nversion is 7.6.1, and ratings run in newer versions will not be\naccepted.<\/p><\/li>\n<li><p>The file labeled as the January 15, 2026 ACEC minutes is\nbyte-for-byte identical to the July 17, 2025 minutes. The actual January\n2026 minutes were not in the project files.<\/p><\/li>\n<\/ul>\n", "num": "VN 4.5", "home": ["vf", "about"], "old": ""}, {"id": "u6", "title": "How to Use This Guide", "kind": "ref", "html": "\n<p>Use the prioritized questions to assign speakers, develop two-minute\nproject stories, and rehearse concise answers. Each response should\nstate the direct answer, explain the contract-specific approach, provide\na relevant example, and close with the benefit to CTDOT.<\/p>\n<p><strong>Suggested study order with limited time<\/strong><\/p>\n<ul>\n<li><p><a class=\"xref\" href=\"#vf/verify/u161\" title=\"§25 · Verify before the interview\">VN 1.1<\/a> (final checklist and numbers to know) and <a class=\"xref\" href=\"#strat/probes/u154\" title=\"§22 · Proposal Consistency Check and Likely Probes\">IS 4.3<\/a>\n(probes the panel may raise from the proposal).<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#strat/probes/u80\" title=\"§12 · Prior-Round CTDOT Questions and Detailed Responses\">IS 4.5<\/a> (prior-round questions — the clearest signal of\nCTDOT’s interview style) and <a class=\"xref\" href=\"#lr/ctdot/u141\" title=\"§21 · New Interview Questions from the v2 Review (N1–N22)\">LR 7.9<\/a> (new CTDOT-specific\nquestions).<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#lr/ctdot/u124\" title=\"§17 · CTDOT-Specific Technical Reference (new in v2)\">LR 7.15<\/a> (CTDOT technical reference) and <a class=\"xref\" href=\"#lr/ctdot/u140\" title=\"§20 · Current CTDOT Load Rating Issues — ACEC Liaison Meetings, 2022–2025\">LR 7.19<\/a> (current\nLoad Rating Section issues).<\/p><\/li>\n<li><p><a class=\"xref\" href=\"#pm/you/u155\" title=\"§23 · Mario LoCoco — Personal Answer Bank\">PM 4.3<\/a> (your personal stories), then Sections 2–7 for\nbreadth.<\/p><\/li>\n<\/ul>\n<p><strong>How the guide is organized<\/strong><\/p>\n<ul>\n<li><p><a href=\"#pq/quick\"><strong>PQ · Prior CTDOT Questions<\/strong><\/a> — The five questions CTDOT asked in the last round of this contract, word for word, with four-minute spoken answers. PQ 1.n and PQ 2.n match Prior Q1–Q5.<\/p><\/li>\n<li><p><a href=\"#strat/delivery\"><strong>IS · Interview Strategy<\/strong><\/a> — How to structure answers, what the panel scores, the messages to land, and practice scenarios.<\/p><\/li>\n<li><p><a href=\"#pm/why\"><strong>PM · PM and Team<\/strong><\/a> — Why HDR, how the team stays available, how task orders get delivered, and your behavioral answers.<\/p><\/li>\n<li><p><a href=\"#lr/fund\"><strong>LR · Load Rating<\/strong><\/a> — LRFR, legal and permit loads, posting, low ratings, QA of rating packages, and CTDOT practice.<\/p><\/li>\n<li><p><a href=\"#de/super\"><strong>DE · Design<\/strong><\/a> — New bridges and ABC, steel and concrete design, seismic, railroad, signs, culverts, codes and digital delivery.<\/p><\/li>\n<li><p><a href=\"#rh/decide\"><strong>RH · Rehabilitation<\/strong><\/a> — Rehab vs. replacement, decks, joints, widening, steel repair, substructure, scour, walls, historic and movable.<\/p><\/li>\n<li><p><a href=\"#con/submittals\"><strong>CN · Construction<\/strong><\/a> — Submittals and RFIs, construction-stage problems, and emergency findings.<\/p><\/li>\n<li><p><a href=\"#pr/how\"><strong>PR · Projects<\/strong><\/a> — Your project stories, and how to bring each one into an answer.<\/p><\/li>\n<li><p><a href=\"#vf/verify\"><strong>VN · Verify and Numbers<\/strong><\/a> — What to confirm before the interview, numbers to know, and how this guide was built.<\/p><\/li>\n<\/ul>\n<p><strong>Numbering.<\/strong> Every item has one number from where it lives: <strong>LR 3.4<\/strong> is Load Rating, subtopic 3, item 4. When an item is also useful somewhere else it is listed there under “Covered in other sections” with its home number. References in the text are links; hover one to see the item’s former label and title.<\/p>\n<p><strong>Former labels.<\/strong> Labels from the Word versions (<a class=\"xref\" href=\"#lr/steel/u71\" title=\"Q59 · Beam ends with section loss are driving the rating. How do you evaluate them?\">LR 5.11<\/a>, <a class=\"xref\" href=\"#pq/full/u84\" title=\"Prior Q4 · Unexpected or low load-rating results\">PQ 2.4<\/a>, <a class=\"xref\" href=\"#lr/steel/u142\" title=\"N1 · Cross-frames on a skewed steel bridge are rating below 1.0. How do you handle it?\">LR 5.12<\/a>, <a class=\"xref\" href=\"#lr/low/u119\" title=\"TS-Q8 · What is the difference between diagnostic and proof load testing?\">LR 3.5<\/a>, §27.38) are shown under each item’s title, and the search box still finds them.<\/p>\n", "num": "IS 1.3", "home": ["strat", "delivery"], "old": ""}, {"id": "u7", "title": "Evaluation Priorities and Core Messages", "kind": "ref", "html": "\n<p>The solicitation places the greatest emphasis on bridge and\nstructural design capability and load-rating/advanced-analysis\ncapability. Interview answers should therefore prioritize demonstrated\ntechnical judgment, availability, quality, and familiarity with CTDOT\nrequirements.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\"/>\n<col style=\"width: 50%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Evaluation Area<\/strong><\/th>\n<th><strong>Solicitation Weight<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Current staff experience, qualifications, and availability<\/td>\n<td>10%<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bridge and structural design, including PS&amp;E<\/td>\n<td>30%<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Load rating, broad structure types, FEM, and CTDOT-approved\nsoftware<\/td>\n<td>30%<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Codes, specifications, and guidance documents<\/td>\n<td>10%<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>OpenBridge and finite-element modeling<\/td>\n<td>5%<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Contractor submittal review<\/td>\n<td>5%<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CTDOT standards, policies, and procedures<\/td>\n<td>10%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Source:<\/strong> CSO 2522 Request for Letter of Interest,\nevaluation criteria.<\/p>\n", "num": "IS 2.2", "home": ["strat", "messages"], "old": "§1"}, {"id": "u8", "title": "Four messages to reinforce", "kind": "ref", "html": "\n<ul>\n<li><p>A local, immediately available team led by people who understand\nCTDOT.<\/p><\/li>\n<li><p>Strong capability in both routine and complex bridge\nassignments.<\/p><\/li>\n<li><p>A disciplined, reproducible approach to load rating, review, and\nquality management.<\/p><\/li>\n<li><p>The ability to respond quickly to concurrent task orders, low\nratings, field findings, and construction issues.<\/p><\/li>\n<\/ul>\n", "num": "IS 2.3", "home": ["strat", "messages"], "old": "§1"}, {"id": "u9", "title": "Criterion Evidence Map (added in v2)", "kind": "ref", "html": "\n<p>The table ties each scored criterion to the strongest evidence in\nHDR’s CSO 255 and the gap the team should close in the room. The\nsolicitation’s own wording matters: criterion 2a explicitly includes\nculverts, retaining walls, foundations, <strong>and traffic control\nstructures<\/strong>, and criterion 2c names <strong>PCI, ACI, ASTM, and\nAISC<\/strong> in addition to AASHTO.<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Criterion (weight)<\/th>\n<th>Strongest proposal evidence<\/th>\n<th>Gap to close in the interview<\/th>\n<th>Suggested lead<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Staff experience, qualifications, availability (10%)<\/td>\n<td>Rocky Hill office; named key staff “fully committed”; PM available\ndaily; CHA local bench<\/td>\n<td>John McKenna has less than one year at HDR; quantify actual\navailability; confirm Connecticut PE coverage for certification<\/td>\n<td>John McKenna; Scott Hill for oversight<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2a. Bridge and structural design incl. PS&amp;E, culverts, walls,\nfoundations, traffic control structures (30%)<\/td>\n<td>Active CTDOT task order (Bridges 06975, 07130, 06039; 06976/06977);\nStratford Ave; Dennis-Yarmouth; Fruit Street; Commonwealth Ave ABC<\/td>\n<td><strong>No sign or traffic-structure project or named lead appears\nin the proposal<\/strong>, yet two prior-round questions were about sign\nstructures<\/td>\n<td>Kris Kretsch or June Wu for design; name a sign-structure lead<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>2b. Load rating incl. FEM and CTDOT software (30%)<\/td>\n<td>MassDOT statewide ratings; MBTA inspection/rating; SCDOT 1,600+\nratings; Commodore Hull (CHA); Gold Star 30 LARSA models (John,\npre-HDR); Brian Winger 200+ ratings incl. CTDOT BrR User Guide<\/td>\n<td>Mario’s resume names no CTDOT rating project although the cover\nletter says he led CTDOT ratings; be specific<\/td>\n<td>Mario LoCoco; Brian Winger for complex FEM<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2c. AASHTO, PCI, ACI, ASTM, AISC codes (10%)<\/td>\n<td>Tony Ream code work; PennDOT, SCDOT manuals; Deanna Nevling NHI LRFR\ninstructor<\/td>\n<td>Proposal speaks almost entirely to AASHTO; prepare PCI/ACI/ASTM/AISC\npoints (<a class=\"xref\" href=\"#de/codes/u131\" title=\"§18 · Familiarity with Codes, Standards, Manuals, and Specifications\">DE 8.2<\/a> addition)<\/td>\n<td>Mario; Peter Wu<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>2d. OpenBridge Modeler and FEM (5%)<\/td>\n<td>“Local expertise” statement; MIDAS/LARSA examples; Suthichai Saelim\nas MIDAS beta tester<\/td>\n<td><strong>No named OpenBridge practitioner or project<\/strong><\/td>\n<td>Name the practitioner before the interview<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2e. Contractor submittal review (5%)<\/td>\n<td>Michael Grandelski, 15 years of CTDOT construction experience;\nMario’s Waterbury RFIs and shop drawings<\/td>\n<td>Tie submittal review to load path, ratings, and paving-train\n(CT-TLC) reviews<\/td>\n<td>Grandelski; Mario<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3. CTDOT standards, policies, procedures (10%)<\/td>\n<td>CTDOT task order, CLE program, Waterbury, directives, DPDM/COMPASS\nstatement; Peter Wu participates in the CTDOT/ACEC load-rating working\ngroup<\/td>\n<td>Use current documents: BRSDM (not BDM), BLRM 2018.1.0, BrR 7.6.1,\nrating stages, CT-TLC<\/td>\n<td>John; Mario; Peter Wu<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "num": "IS 2.4", "home": ["strat", "messages"], "old": "§1"}, {"id": "u10", "title": "Highest-Probability Interview Questions", "kind": "ref", "html": "\n<p><em>v4: <a class=\"xref\" href=\"#pq/full/u84\" title=\"Prior Q4 · Unexpected or low load-rating results\">PQ 2.4<\/a> moved to <a class=\"xref\" href=\"#pq/full/u84\" title=\"Prior Q4 · Unexpected or low load-rating results\">PQ 2.4<\/a>; <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a> and <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a> merged into <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a>.<\/em><\/p>\n", "num": "VN 4.6", "home": ["vf", "about"], "old": "§2"}, {"id": "u11", "title": "Why is your team the best choice for this contract?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q1.<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>The team combines a Connecticut-based project-management\nstructure with a larger technical bench.<\/p><\/li>\n<li><p>John McKenna is the proposed Project Manager and primary client\ncontact.<\/p><\/li>\n<li><p>Mario LoCoco is Deputy Project Manager and Bridge/Structural\nLead, supporting design and load-rating assignments.<\/p><\/li>\n<li><p>The team covers bridge design, load rating, complex FEM,\nstructural health monitoring, instrumentation, DSDC, constructability,\nhighway, drainage, geotechnical, environmental, traffic, and\nscheduling.<\/p><\/li>\n<li><p>Emphasize a clear chain of responsibility and named technical\nleads rather than an undifferentiated staff pool.<\/p><\/li>\n<li><p>Distinguish local ownership of delivery from supplemental\nnational expertise: the local team delivers; national specialists are\nbrought in for defined needs.<\/p><\/li>\n<\/ul>\n<p><strong>Suggested closing:<\/strong> “What distinguishes our team is\nnot simply the number of available engineers. It is that we have a local\nmanagement structure that understands CTDOT’s processes, backed by\nspecialists who can be brought in quickly when an assignment requires\nadvanced analysis, instrumentation, construction expertise, or\naccelerated delivery.”<\/p>\n<p><strong>Source:<\/strong> HDR CSO 2522 qualifications package,\nstaffing and organization sections.<\/p>\n", "num": "PM 1.1", "home": ["pm", "why"], "old": "Q1"}, {"id": "u12", "title": "How will you manage multiple concurrent task orders and guarantee the named team’s availability?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q2, Q26, and Q29 (with Appendix A-Q2, A-Q26,\nA-Q29 and the Practice Session 1 debrief). Also asked as:<strong>\n<\/strong>“<strong>Your team has other active CTDOT commitments. How will\nyou guarantee availability?<\/strong>”<strong> <\/strong>and<strong>\n<\/strong>“<strong>CTDOT assigns five routine ratings and one emergency\nevaluation simultaneously.<\/strong>”<\/em><\/p>\n<p><strong>Suggested lead:<\/strong> the Project Manager (confirmed in\nPractice Session 1); Mario supports on technical staffing.<\/p>\n<p><strong>Key points to hit — management structure<\/strong><\/p>\n<ul>\n<li><p>Route all assignments through the Project Manager, with the\nDeputy PM supporting execution and technical coordination.<\/p><\/li>\n<li><p>At kickoff, establish scope, assumptions, technical lead,\nstaffing, CTDOT decisions, QA/QC level, milestones, review periods,\nrisks, and dependencies.<\/p><\/li>\n<li><p>Use recurring portfolio reviews across all active task orders,\nincluding the current CTDOT task order.<\/p><\/li>\n<li><p>Escalate scope gaps and missing information early, before\nmilestones are at risk.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — proving availability<\/strong><\/p>\n<ul>\n<li><p>Provide named people with actual planned roles and availability\npercentages rather than general assurances or company-wide staff totals;\nthe panel cares about the named team’s actual capacity.<\/p><\/li>\n<li><p>Explain task-order staffing forecasts and name a qualified backup\nfor each critical role before assignments become\nschedule-critical.<\/p><\/li>\n<li><p>Separate management capacity from technical production capacity\nso the PM and Deputy PM are not also the bottleneck on\nproduction.<\/p><\/li>\n<li><p>Explain how priority conflicts between task orders will be\nresolved.<\/p><\/li>\n<li><p>Commit that the proposed personnel are the staff who will perform\nthe work, as represented.<\/p><\/li>\n<li><p>Present national resources as supplemental surge capacity behind\na local Connecticut team, not as the primary answer; leading with\nnational depth cuts against the local-office and daily-supervision\nrequirement.<\/p><\/li>\n<\/ul>\n<p><strong>Scenario version — five routine ratings and one emergency\narrive together<\/strong><\/p>\n<ul>\n<li><p>Triage on safety first, then deadlines.<\/p><\/li>\n<li><p>Assign an emergency technical lead and a backup, with a\nproduction team separate from the routine work.<\/p><\/li>\n<li><p>Collect source information rapidly and confirm methods with CTDOT\nearly.<\/p><\/li>\n<li><p>Coordinate the emergency daily while keeping routine tasks\nprogressing on their own schedule.<\/p><\/li>\n<li><p>Communicate priorities and decisions to CTDOT\ntransparently.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> Who takes over if the Project\nManager is unavailable? Be ready to explain Deputy PM authority,\nPrincipal-in-Charge oversight, and continuity of documented\ndecisions.<\/p>\n<p><strong>Phrases to avoid (Practice Session 1):<\/strong> “We keep them\nbusy” and “that’s how we stay in business” — both confirm the panel’s\navailability concern.<\/p>\n", "num": "PM 2.1", "home": ["pm", "staffing"], "old": "Q2"}, {"id": "u13", "title": "What is your approach when CTDOT assigns a new load rating?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q3 and the Practice Session 1\ndebrief.<\/em><\/p>\n<p><strong>Key points to hit — kickoff<\/strong><\/p>\n<ul>\n<li><p>Confirm the rating basis: why the rating is being done, which\ncondition is being rated (existing, proposed, or rehabilitated), which\ncomponents require evaluation, and which manuals, rating aids, and\nsoftware versions are current. The solicitation attached the 2018\nmanual; say explicitly that currency is confirmed at kickoff.<\/p><\/li>\n<li><p>Collect and reconcile plans, shop drawings, as-builts,\nrehabilitation records, inspection reports, existing rating files, field\nmeasurements, material data, dead loads, utilities, wearing surface, and\ndeterioration.<\/p><\/li>\n<li><p>Make an early field visit to verify conditions against the\ninspection report and prior rating, and identify gaps such as corrosion\nand section loss before analysis starts.<\/p><\/li>\n<li><p>Develop a rating plan covering analysis method, software,\nvehicles, refinements, and the assumptions that need CTDOT concurrence;\ndocument assumptions up front.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — analysis and checking<\/strong><\/p>\n<ul>\n<li><p>Obtain CTDOT concurrence before deviating from AASHTOWare BrR.\nBLRM 3.3.1(b) says that when a line-girder rating does not reach the\ndesired rating factor, the Load Rating Section (LRS) decides whether\nfinite element analysis is needed, so this is a written requirement, not\na courtesy.<\/p><\/li>\n<li><p>Differentiator: when a refined platform (MIDAS Civil or LARSA) is\nneeded, use it as the analysis engine only, export force effects, and\nperform capacity and rating calculations independently in Mathcad or\nExcel, so the rating does not rely on the software’s rating\nmodule.<\/p><\/li>\n<li><p>Perform an independent check of geometry, section properties,\nloads, boundary conditions, deterioration, vehicle placement, and\ncontrolling limit states, with QC separate from the rating\nengineer.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — results and deliverable<\/strong><\/p>\n<ul>\n<li><p>Interpret findings by naming the governing member, failure\nmechanism, vehicle, location, and rating factor.<\/p><\/li>\n<li><p>Review low ratings for unnecessary conservatism, and notify CTDOT\nimmediately of a low or safety-critical result rather than waiting for\nthe report.<\/p><\/li>\n<li><p>Prepare a complete, standalone, reproducible package in CTDOT’s\nexpected format: report, calculations, model files, references, QA/QC\ndocumentation, and the CTDOT rating checklist.<\/p><\/li>\n<li><p>For a refined analysis, the report must cover the BLRM 12.2.5.1\nitems: reason, element types, links, support degrees of freedom,\nartificial (dummy) elements, construction stages, and lane placement.\nWhen the refined analysis is done inside BrR, only the reason is\nrequired, including the BrR version and analysis type.<\/p><\/li>\n<li><p>Close with the benefit to CTDOT.<\/p><\/li>\n<\/ul>\n<p><strong>Interview emphasis:<\/strong> Do not describe load rating as\nmerely running a model. Emphasize source-data validation, engineering\njudgment, model verification, interpretation of deterioration, and\nactionable communication.<\/p>\n<p><strong>Source:<\/strong> CTDOT Bridge Load Rating Manual, Chapters 1,\n3, 8, 12, 13, and 14.<\/p>\n", "num": "LR 7.2", "home": ["lr", "ctdot"], "old": "Q3"}, {"id": "u14", "title": "How do you determine whether to use BrR or a refined finite-element model, and when is refinement worth the cost?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q5, Q52, and TS-Q14 (with Appendix A-Q5 and the\nPractice Session 1 debrief). Also asked as:<strong>\n<\/strong>“<strong>When is a refined analysis\njustified?<\/strong>”<strong> <\/strong>and<strong> <\/strong>“<strong>How\ndo you decide whether refined analysis is worth the\ncost?<\/strong>”<strong> <\/strong>Model validation is covered under Prior\nQ5.<\/em><\/p>\n<p><strong>Key points to hit — start from behavior, not\nsoftware<\/strong><\/p>\n<ul>\n<li><p>Begin with structure type, geometry, behavior, and the owner\ndecision being supported.<\/p><\/li>\n<li><p>Use the simplest method that accurately captures governing\nbehavior; use AASHTOWare BrR when appropriate and consistent with\ncurrent CTDOT requirements.<\/p><\/li>\n<li><p>Present the choice as a spectrum rather than a binary:\nline-girder analysis in BrR, then BrR’s own refined options (3D FEM with\nstiffness-based distribution in lieu of approximate distribution-factor\nequations), then an external platform only when behavior genuinely\nexceeds what BrR can represent. This shows the Department’s default is\nexhausted before proposing to leave it.<\/p><\/li>\n<li><p>Portions of one structure may be rated in BrR while others\nrequire a refined model; say so, as it reflects real practice.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — triggers (name them specifically,\nnot<\/strong>** ****“****unique geometry****”****)**<\/p>\n<ul>\n<li><p>Severe skew, horizontal curvature, complex framing or load-path\ninteraction, trusses and gusset plates (where not handled in BrR), tub\nor multi-cell torsional behavior, unusual restraints or bearing\nconditions, staged construction, and localized or nonlinear\nbehavior.<\/p><\/li>\n<li><p>When geometry, distribution, restraint, staged behavior,\ndeterioration, or load path cannot be represented adequately by a\nsimpler method.<\/p><\/li>\n<li><p>When the owner requires it for curved, highly skewed, complex, or\nunusual structures: BLRM 3.3.1(c) makes refined analysis mandatory for\nhorizontally curved girders and skews over 30° (curved girders meeting\nBDS 4.6.1.2.4b or c may still use line-girder analysis). BLRM 3.3.1.1\nlists the accepted levels as 2D grid, 2D plate and eccentric beam, and\n3D, and points to the AASHTO/NSBA Guidelines for Steel Girder Bridge\nAnalysis and NCHRP Report 725 for choosing among them.<\/p><\/li>\n<li><p>When a low rating may be driven by approximate distribution or\nanother conservative approximation, and refinement could materially\nchange the owner’s decision.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — is it worth the cost?<\/strong><\/p>\n<ul>\n<li><p>Compare the probable decision value with the cost and uncertainty\nof refinement: refinement is justified when simplified assumptions\nplausibly control a costly posting, rehabilitation, or permit decision\nand the refined behavior can be validated.<\/p><\/li>\n<li><p>Identify exactly which simplified assumption is conservative and\nestimate whether correcting it could change the decision.<\/p><\/li>\n<li><p>Define the validation checks before modeling, and confirm the\nadditional complexity will produce decision-useful information.<\/p><\/li>\n<li><p>Obtain CTDOT concurrence (the LRS decides on FEA under BLRM\n3.3.1(b)), and stop if sensitivity shows the limitation is not\ndecision-controlling.<\/p><\/li>\n<li><p>Refinement is never used merely to obtain a higher rating factor.\nRefined results will not match approximate methods exactly and should\nusually be somewhat more favorable, but not always.<\/p><\/li>\n<li><p>Validate through simplified checks, equilibrium, expected\nbehavior, sensitivity studies, or field data (details under Prior\nQ5).<\/p><\/li>\n<\/ul>\n<p><strong>Suggested closing:<\/strong> “We do not select software first\nand then force the structure into it. We identify the structural\nbehavior that must be captured, select the appropriate analytical\nmethod, obtain CTDOT concurrence where required, and validate the output\nusing independent engineering checks.”<\/p>\n<p><strong>Likely follow-up:<\/strong> Give an example where you would\nintentionally not refine the analysis.<\/p>\n", "num": "LR 9.1", "home": ["lr", "software"], "old": "Q5"}, {"id": "u15", "title": "How will you ensure the accuracy and consistency of load ratings, and how does QA/QC differ for routine and complex work?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q6 and PR-Q11 (both the question and its\npractice-prompt version) and Appendix A-Q6. Also asked as:<strong>\n<\/strong>“<strong>Explain how QA/QC differs for a routine BrR rating,\nrehabilitation design, and nonlinear FEM, including reviewer\nqualifications, independence, comments, and urgent\nwork.<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — every rating<\/strong><\/p>\n<ul>\n<li><p>Use a task-specific quality plan scaled to complexity,\nconsequence, novelty, uncertainty, and schedule.<\/p><\/li>\n<li><p>Separate the rating engineer, QC reviewer, and QA reviewer. The\nindependence requirement never changes; the depth of review\nscales.<\/p><\/li>\n<li><p>Independently verify critical inputs and results: source\ndocuments, dead loads, properties, deterioration, assumptions, software\nsettings and versions, vehicle libraries, controlling results, and\nreport/raw-file consistency.<\/p><\/li>\n<li><p>Confirm that submitted files reproduce the reported\nresults.<\/p><\/li>\n<li><p>Use the CTDOT QA checklist, retain comment-resolution\ndocumentation, and track comments and residual risks to\nclosure.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — routine versus complex versus\nurgent<\/strong><\/p>\n<ul>\n<li><p>Routine BrR work: controlled source data, standardized checks,\nand a reproducibility review.<\/p><\/li>\n<li><p>Rehabilitation design: the same controls plus interdisciplinary\nreview of how the design changes the rating.<\/p><\/li>\n<li><p>Complex or nonlinear FEM: a model plan reviewed before modeling,\nstaged validation, sensitivity studies, and specialist peer review of\nnative files.<\/p><\/li>\n<li><p>Urgent work: urgency changes sequencing and communication, not\nthe need for independent verification.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-ups<\/strong><\/p>\n<ul>\n<li><p>Be precise about which functions require a Connecticut PE and how\nthe review and certification workflow meets that requirement (see\n<a class=\"xref\" href=\"#strat/probes/u154\" title=\"§22 · Proposal Consistency Check and Likely Probes\">IS 4.3<\/a> on QA/QC Manager licensure).<\/p><\/li>\n<li><p>Who is qualified to review a nonlinear model?<\/p><\/li>\n<\/ul>\n<p><strong>Rehearsal requirement:<\/strong> Use one verified project\nexample, state the speaker’s personal role, and close with the specific\nbenefit to CTDOT.<\/p>\n", "num": "LR 4.3", "home": ["lr", "qa"], "old": "Q6"}, {"id": "u16", "title": "How will you review load ratings prepared by others — including one you are asked to update, or one that looks wrong?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q7, Q30, and N4 (with Appendix A-Q7 and A-Q30).\nAlso asked as:<strong> <\/strong>“<strong>Another consultant’s model\nproduces a satisfactory rating, but behavior appears\nunreasonable<\/strong>”<strong> <\/strong>and<strong>\n<\/strong>“<strong>You’re asked to update a load rating on file that\nanother firm prepared. What is your responsibility?<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — the review<\/strong><\/p>\n<ul>\n<li><p>Check completeness and reliability of source information, and\nconformance with current federal and state criteria.<\/p><\/li>\n<li><p>Test whether the selected analysis method is applicable to the\nstructure.<\/p><\/li>\n<li><p>Review geometry, load path, dead and live loading, deterioration,\nrestraints, vehicle libraries, load combinations, and failure\nmechanisms.<\/p><\/li>\n<li><p>Check consistency among the report, calculations, model, and raw\nfiles.<\/p><\/li>\n<li><p>Assess whether behavior and conclusions are physically\nreasonable, and communicate low ratings or safety concerns\npromptly.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — a good number but unreasonable\nbehavior<\/strong><\/p>\n<ul>\n<li><p>Do not accept the number at face value.<\/p><\/li>\n<li><p>Check load path, deflected shape, reactions, equilibrium,\nrestraints, and forces, and compare with simplified estimates.<\/p><\/li>\n<li><p>Document discrepancies and communicate neutrally about the other\nfirm’s work.<\/p><\/li>\n<li><p>Recommend corrections or refined analysis, and escalate safety\nimplications immediately.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — updating another firm’s\nrating<\/strong><\/p>\n<ul>\n<li><p>Once we seal it, we own it. Review the existing rating, model,\nand assumptions as if they were our own, and either adopt the work under\na documented evaluation or redo the parts we cannot verify.<\/p><\/li>\n<li><p>The Connecticut sealing rule allows sealing documents not\nprepared under your supervision only with a thorough written evaluation\nof the work, retained for at least six years.<\/p><\/li>\n<li><p>CTDOT has said a lightweight “Level 2” update approach (used in\nNY and NJ) would not meet its documentation needs.<\/p><\/li>\n<li><p>Expect changes from BrR version and code updates; explain which\ndifferences are due to software, code, condition, or\ncorrections.<\/p><\/li>\n<li><p>Keep the package standalone (BLRM 12.1): no references to other\nfirms’ reports.<\/p><\/li>\n<\/ul>\n", "num": "LR 4.4", "home": ["lr", "qa"], "old": "Q7"}, {"id": "u17", "title": "Describe your experience with a broad range of structure types.", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q8.<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Cover steel multi-girder, prestressed concrete, slabs, culverts,\nburied structures, trusses, gusset plates, movable bridges, rail/transit\nbridges, retaining walls, foundations, long-span structures, and\nstaged/ABC construction.<\/p><\/li>\n<li><p>Use three contrasting examples: a typical local replacement, a\ncomplex rating or rehabilitation, and an emergency or construction-phase\nassignment.<\/p><\/li>\n<li><p>For each example, state personal role, technical challenge,\ndecision, result, and application to this contract.<\/p><\/li>\n<\/ul>\n", "num": "PM 1.2", "home": ["pm", "why"], "old": "Q8"}, {"id": "u18", "title": "How will HDR and CHA work together while ensuring the prime performs the majority of the work?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q9.<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>HDR retains contract management, task-order management, primary\ntechnical leadership, and the majority of production.<\/p><\/li>\n<li><p>CHA fills defined specialty needs, particularly instrumentation,\nstrain gauging, complex analysis, and supplemental local bridge\nexpertise.<\/p><\/li>\n<li><p>Each task order uses a responsibility matrix and one technical\nlead who owns integration.<\/p><\/li>\n<li><p>Subconsultant work follows the same controls, document standards,\nquality plan, and communication protocol.<\/p><\/li>\n<li><p>CTDOT should not need to manage interfaces between\nfirms.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> Avoid overemphasizing CHA to the\npoint that the panel questions where the core expertise or delivery\nresponsibility resides.<\/p>\n", "num": "PM 1.3", "home": ["pm", "why"], "old": "Q9"}, {"id": "u19", "title": "How will you meet the Connecticut-office and daily-supervision requirements?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q10.<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>State the office location and actual staffing clearly.<\/p><\/li>\n<li><p>Confirm that the Project Manager will be available daily for\ndirect and visual supervision.<\/p><\/li>\n<li><p>Explain the working relationship among the Project Manager,\nDeputy PM, discipline leads, and production staff.<\/p><\/li>\n<li><p>Explain how local staffing will be maintained during\npeaks.<\/p><\/li>\n<li><p>Present national staff as supplemental technical capacity, not a\nsubstitute for the local team.<\/p><\/li>\n<\/ul>\n", "num": "PM 2.2", "home": ["pm", "staffing"], "old": "Q10"}, {"id": "u20", "title": "Additional Likely Technical Questions", "kind": "ref", "html": "\n<p><em>v4: <a class=\"xref\" href=\"#pq/full/u85\" title=\"Prior Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a> moved to <a class=\"xref\" href=\"#pq/full/u85\" title=\"Prior Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a>; <a class=\"xref\" href=\"#lr/low/u27\" title=\"Q18 · A low rating is driven by incomplete documentation or a conservative assumption. How do you proceed?\">LR 3.4<\/a> now also covers the former\n<a class=\"xref\" href=
