\"#lr/low/u27\" title=\"Q18 · A low rating is driven by incomplete documentation or a conservative assumption. How do you proceed?\">LR 3.4<\/a>.<\/em><\/p>\n", "num": "VN 4.7", "home": ["vf", "about"], "old": "§3"}, {"id": "u21", "title": "How do you account for deterioration and section loss — for example, on a deteriorated steel-girder bridge?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q11, Q45, and TS-Q6 (with Appendix A-Q11 and\nthe Practice Session 1 debrief). Also asked as:<strong>\n<\/strong>“<strong>How is deterioration incorporated into an LRFR\nanalysis?<\/strong>”<strong> <\/strong>and<strong> <\/strong>“<strong>How\ndo you rate a deteriorated steel-girder bridge?<\/strong>”<strong>\n<\/strong>The difference between the condition factor and section loss is\nunder <a class=\"xref\" href=\"#lr/fund/u60\" title=\"Q38 · Explain the LRFR rating-factor equation and the role of the condition and system factors.\">LR 1.5<\/a>.<\/em><\/p>\n<p><strong>Recommended answer:<\/strong> We establish the actual section\nand connection condition first, model the measured deterioration, and\nthen apply the correct condition and system treatment and limit\nstates.<\/p>\n<p><strong>Key points to hit — getting the data right<\/strong><\/p>\n<ul>\n<li><p>Start with an in-depth review of the latest inspection\ninformation, reconciling notes, photographs, measurements, and prior\nratings, then do a targeted field verification to fill gaps and\ncalculate as-inspected section properties.<\/p><\/li>\n<li><p>Location matters as much as quantity. Flange loss near a\nsimple-span beam end has little effect on flexure, while the same loss\nat maximum positive moment can govern; web holes at midspan matter less\nfor shear than the same loss at the beam end.<\/p><\/li>\n<li><p>On steel girders, measure flange and web loss at critical\nsections, especially beam ends and bearings.<\/p><\/li>\n<li><p>Avoid blanket condition assumptions across all members.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — putting it in the analysis<\/strong><\/p>\n<ul>\n<li><p>Use inspection findings and field measurements to modify\neffective section properties, component geometry, or the structural\nmodel as appropriate.<\/p><\/li>\n<li><p>Apply member-specific condition factors. Under BLRM 4.1.2 the\ncondition factor is always applied in addition to reduced section\nproperties, not instead of them; it is based on the individual member\nrather than the element-type rating; it may be increased by 0.05 when\nlosses are field measured, to a maximum of 1.00; and it is 1.00 for new\nmembers and for rehabilitation that arrests deterioration (Section\n<a class=\"xref\" href=\"#lr/ctdot/u127\" title=\"§17.3 · Key BLRM Provisions for Quick Recall\">LR 7.17<\/a>).<\/p><\/li>\n<li><p>Consider whether deterioration changes the load path, restraint,\nstability, connection behavior, or composite action, and whether\ncomposite and restraint assumptions remain defensible.<\/p><\/li>\n<li><p>For steel, check shear, bearing, yielding, buckling, flexure,\nstability, splices, and connections against the reduced\nsection.<\/p><\/li>\n<li><p>Concrete members: reinforcing-steel loss is handled by reduced\nbar area; spalling is harder to quantify. Where NDE indicates concrete\nstrength below the plan value, use the reduced strength with an\nadditional reduction for uncertainty at untested locations.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — when the inspection data are not good\nenough<\/strong><\/p>\n<ul>\n<li><p>Inadequacy may not be apparent until the numbers are\nrun.<\/p><\/li>\n<li><p>A report can be precise in quantity (to the sixteenth of an inch)\nyet unusable if it does not locate the loss along the member; applying\nit over the full length can be extremely conservative.<\/p><\/li>\n<li><p>Run a sensitivity analysis first. If the assumed distribution of\nloss controls, propose a targeted measurement plan: ultrasonic thickness\nreadings on a defined grid (particularly the lower web and\nbearing-stiffener region), dimensioned sketches, and photographs tied to\nstations along the beam.<\/p><\/li>\n<li><p>Document location, extent, measurement basis, interpretation,\nwhat was assumed and its source, uncertainty, and effect, so the package\nis reproducible at the next rating cycle.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> What field measurements would you\nprioritize if time were limited? (Beam ends and bearing areas, then the\ngoverning flexural section — wherever the sensitivity run shows the\nrating moves.)<\/p>\n", "num": "LR 5.7", "home": ["lr", "steel"], "old": "Q11"}, {"id": "u22", "title": "How do you handle missing plans or uncertain material properties?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q12, Q54, and PR-Q8 (both the question and its\npractice-prompt version), with Appendix A-Q12. Also asked as:<strong>\n<\/strong>“<strong>How should unknown or uncertain information be\nhandled?<\/strong>”<strong> <\/strong>and<strong> <\/strong>“<strong>Rate\nan older bridge with incomplete plans, uncertain materials, and limited\naccess to deteriorated components.<\/strong>”<strong> <\/strong>When the\nuncertainty produces a low rating, see <a class=\"xref\" href=\"#lr/low/u27\" title=\"Q18 · A low rating is driven by incomplete documentation or a conservative assumption. How do you proceed?\">LR 3.4<\/a>.<\/em><\/p>\n<p><strong>Key points to hit — find what exists first<\/strong><\/p>\n<ul>\n<li><p>Conduct an exhaustive records search across design, shop,\nworking, rehabilitation, and as-built documents.<\/p><\/li>\n<li><p>Check historical specifications and standards of the era and\nfield-verifiable details.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — treat what is left\nexplicitly<\/strong><\/p>\n<ul>\n<li><p>Separate verified values, inferred values, code-based defaults,\nengineering assumptions, and owner-directed assumptions.<\/p><\/li>\n<li><p>Use conservative but physically reasonable assumptions with\ndocumented rationale, and use sensitivity ranges where the assumption\nmay control.<\/p><\/li>\n<li><p>Identify the decision-sensitive unknowns and focus field work and\ndata collection on the uncertainties that can change the\ndecision.<\/p><\/li>\n<li><p>Document why each assumption was necessary, why it is reasonable,\nits limitations, and the effect of each controlling\nuncertainty.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — CTDOT coordination<\/strong><\/p>\n<ul>\n<li>Seek CTDOT concurrence where owner decisions are required, and\nbefore intrusive testing, material sampling, alternate methods, or major\nrefinements. Material sampling is used only when justified and\napproved.<\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> How do you decide whether material\ntesting is worth the cost? (Run the sensitivity first: if the plausible\nrange of the property does not change the posting or rehabilitation\ndecision, testing is not worth it.)<\/p>\n<p><strong>Rehearsal requirement:<\/strong> Use one verified project\nexample, state the speaker’s personal role, and close with the specific\nbenefit to CTDOT.<\/p>\n", "num": "LR 7.3", "home": ["lr", "ctdot"], "old": "Q12"}, {"id": "u23", "title": "What is your approach to material testing, strain gauging, load testing, and instrumentation?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q13, Q55, and PR-Q13 (with Appendix A-Q13).\nAlso asked as:<strong> <\/strong>“<strong>What is the role of load\ntesting or instrumentation in LRFR?<\/strong>”<strong>\n<\/strong>and<strong> <\/strong>“<strong>Describe when strain gauging,\nload testing, or monitoring should support a rating or rehabilitation\ndecision.<\/strong>”<strong> <\/strong>Diagnostic versus proof testing is\n<a class=\"xref\" href=\"#lr/low/u119\" title=\"TS-Q8 · What is the difference between diagnostic and proof load testing?\">LR 3.5<\/a>.<\/em><\/p>\n<p><strong>Key points to hit — why test<\/strong><\/p>\n<ul>\n<li><p>Use testing to answer a defined engineering question: start with\na decision-specific hypothesis and identify the uncertainty controlling\nthe decision, such as distribution, restraint, composite action, or\nactual response.<\/p><\/li>\n<li><p>Develop a test plan that connects the measured quantities to the\nrating or rehabilitation decision.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — doing it well<\/strong><\/p>\n<ul>\n<li><p>Select sensors and loads that isolate the uncertain\nbehavior.<\/p><\/li>\n<li><p>Prepare instrumentation, access, traffic-control, calibration,\nbaseline, repeatability, temperature, and data-quality plans.<\/p><\/li>\n<li><p>Compare measured and predicted response at multiple locations and\nload cases, and correlate measured response with the analytical model\nwithout forcing agreement.<\/p><\/li>\n<li><p>Use results to validate or calibrate a defensible model in\naccordance with applicable owner and MBE provisions.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — limits<\/strong><\/p>\n<ul>\n<li><p>State what the test validates and what remains untested: measured\nresponse under one test does not automatically validate every load case\nor failure mode.<\/p><\/li>\n<li><p>Document whether results support capacity, load distribution,\nboundary conditions, or repair performance.<\/p><\/li>\n<\/ul>\n<p><strong>Rehearsal requirement:<\/strong> Use one verified project\nexample, state the speaker’s personal role, and close with the specific\nbenefit to CTDOT.<\/p>\n", "num": "LR 3.3", "home": ["lr", "low"], "old": "Q13"}, {"id": "u24", "title": "How do you address curved or highly skewed bridges?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q15. Related: <a class=\"xref\" href=\"#lr/steel/u142\" title=\"N1 · Cross-frames on a skewed steel bridge are rating below 1.0. How do you handle it?\">LR 5.12<\/a> (low-rating\ncross-frames) and <a class=\"xref\" href=\"#lr/steel/u144\" title=\"N8 · When would you simplify a curved deck on straight girders?\">LR 5.13<\/a> (curved deck on straight girders).<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Address transverse distribution, torsional behavior,\ndiaphragm/cross-frame forces, flange lateral bending, restraint, and\nbearing orientation.<\/p><\/li>\n<li><p>Use a refined model appropriate to the behavior; for CTDOT this\nis required for horizontal curvature and skews over 30° (BLRM 3.3.1(c);\nsee <a class=\"xref\" href=\"#lr/software/u14\" title=\"Q5 · How do you determine whether to use BrR or a refined finite-element model, and when is refinement worth the cost?\">LR 9.1<\/a>).<\/p><\/li>\n<li><p>Check members and connections beyond the primary\ngirders.<\/p><\/li>\n<\/ul>\n", "num": "LR 5.8", "home": ["lr", "steel"], "old": "Q15"}, {"id": "u25", "title": "How do you handle critical connections and gusset plates, and when must they be rated?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q16, Q60, and N14 (with Appendix A-Q16). Also\nasked as:<strong> <\/strong>“<strong>When must critical connections be\nrated?<\/strong>”<strong> <\/strong>and<strong> <\/strong>“<strong>How do\nyou rate gusset plates on an old riveted truss?<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — when connections are rated<\/strong><\/p>\n<ul>\n<li><p>Connections in nonredundant load paths, connections with section\nloss, distress, or changed conditions, and any connection the owner\ndirects.<\/p><\/li>\n<li><p>Pin-and-hanger or hinge assemblies as required, and field splices\nwhen applicable.<\/p><\/li>\n<li><p>Gusset plates on trusses: CTDOT rates all truss gussets\nregardless of redundancy, per MBE 6A.6.12.6 as modified by\nCTDOT.<\/p><\/li>\n<li><p>Do not assume connection capacity exceeds member capacity,\nparticularly when refined member capacity is being relied upon.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — how<\/strong><\/p>\n<ul>\n<li><p>Identify nonredundant load paths and model actual\ngeometry.<\/p><\/li>\n<li><p>Account for section loss at the governing failure plane, using\nlocation-specific loss rather than an average thickness.<\/p><\/li>\n<li><p>For gussets, start with Whitmore and partial shear plane checks.\nFor layered plates, sum the individual plate resistances. Use Ks = 0.33\nabsent better data.<\/p><\/li>\n<li><p>If legal or permit ratings are low on an as-inspected rating, the\nMBE alternative compression method (6A.6.12.6.11) may be considered with\ndocumented rationale; for proposed conditions it needs LRS\napproval.<\/p><\/li>\n<li><p>Use nonlinear analysis only when warranted and\nvalidated.<\/p><\/li>\n<\/ul>\n<p><strong>Example:<\/strong> Commodore Hull (CHA), where refined checks,\nmeasured out-of-flatness, coupons, strain gauges, and 3D nonlinear FEA\nsupported the UHPC infill repair.<\/p>\n", "num": "LR 5.9", "home": ["lr", "steel"], "old": "Q16"}, {"id": "u26", "title": "How do you rate a culvert or buried structure, and when does one under deep fill need a rating?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q17 and N7 (with Appendix A-Q17). Also asked\nas:<strong> <\/strong>“<strong>When does a culvert under deep fill need\nto be rated?<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — does it need a rating?<\/strong><\/p>\n<ul>\n<li><p>Under the 2018 BLRM, live load can be omitted when wheel-load\ndistribution through fill is negligible, and a capacity-to-demand ratio\nis reported.<\/p><\/li>\n<li><p>CTDOT has discussed raising the fill depth at which rating is not\nrequired from 8 ft to 14 ft, based on the newer code approach that\nevaluates the percentage of live load transmitted through fill. Confirm\ncurrent direction.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — the rating<\/strong><\/p>\n<ul>\n<li><p>Confirm type, geometry, installation method, fill, pavement,\nsoil, deterioration, and perforations. Unknown installation → assume\nembankment; at-rest earth pressure with φ′ = 30°.<\/p><\/li>\n<li><p>Determine whether simplified analysis is applicable.<\/p><\/li>\n<li><p>Analyze each vehicle at its critical fill depth, which may be\nneither the maximum nor the minimum; 2 ft is often the most\nconservative.<\/p><\/li>\n<li><p>Check shear and soil-structure interaction as\napplicable.<\/p><\/li>\n<li><p>Use approved CTDOT tools or appropriate software and state\nlimitations clearly: CT-Fill for load distribution; CT-MPipe for metal\npipes and arches (not structural-plate boxes or perforations); CANDE\nLevel 3 with at least four load steps.<\/p><\/li>\n<\/ul>\n", "num": "LR 8.2", "home": ["lr", "other"], "old": "Q17"}, {"id": "u27", "title": "A low rating is driven by incomplete documentation or a conservative assumption. How do you proceed?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q18 and Q32 (with Appendix A-Q18, A-Q32, and\nthe Practice Session 1 debrief). Also asked as:<strong>\n<\/strong>“<strong>A low rating appears governed by a conservative\nassumption. How do you proceed?<\/strong>”<strong>\n<\/strong>Missing-information handling in general is <a class=\"xref\" href=\"#lr/ctdot/u22\" title=\"Q12 · How do you handle missing plans or uncertain material properties?\">LR 7.3<\/a>; the full\nlow-rating ladder is <a class=\"xref\" href=\"#pq/full/u84\" title=\"Prior Q4 · Unexpected or low load-rating results\">PQ 2.4<\/a>.<\/em><\/p>\n<p><strong>Key points to hit — sort it out before spending\nmoney<\/strong><\/p>\n<ul>\n<li><p>Separate what is known, assumed, and controlling.<\/p><\/li>\n<li><p>Validate the basis of the assumption against the available\ndocuments: prior rating, inspection reports, and plans. Verify that the\nresult is not driven by a records or modeling error.<\/p><\/li>\n<li><p>Quantify the assumption’s effect with a sensitivity analysis\nbefore any field work. If the rating barely moves, the field work is not\nneeded.<\/p><\/li>\n<li><p>Confirm the conservatism is not masking a genuine safety issue\nbefore refining it away, and communicate immediate safety concerns right\naway.<\/p><\/li>\n<li><p>Coordinate with CTDOT before proceeding, collect better\ninformation only if it may change the decision, and retain the\nconservative result until the refinement is validated.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — the most efficient next step<\/strong><\/p>\n<ul>\n<li><p>In order of cost: records research, field measurement, material\ntesting, refined analysis, instrumentation or load testing — or, if the\ndeficiency is real, posting or repair.<\/p><\/li>\n<li><p>Example: a bridge without design plans where reinforcement was\nassumed. Investigation progression: ground-penetrating radar for bar\ncount and spacing; limited destructive testing for bar size (GPR cannot\nestablish size); cores for concrete strength, optionally correlated to\nrebound-hammer or ultrasonic pulse velocity readings to extend results\nto untested locations. (Impact-echo finds delaminations, voids, and\nthickness; it does not give strength.)<\/p><\/li>\n<li><p>Load testing is the most definitive option: diagnostic testing\nnormally first when a reliable model can be built and calibrated, and\nproof testing when it cannot.<\/p><\/li>\n<\/ul>\n<p><strong>Terminology to keep straight<\/strong> (the spoken mock answer\ncrossed these)<\/p>\n<ul>\n<li><p>A diagnostic test places a known truck at known positions within\nthe elastic range to measure actual distribution, restraint, continuity,\nor composite action and calibrate the model.<\/p><\/li>\n<li><p>A proof test loads incrementally toward a target with\ninstrumentation (strain gauges, LVDTs) and stop criteria, monitoring for\nnonlinearity and residual deflection (permanent set) after unloading.\nThe rating is then established from the verified proof load under the\ngoverning MBE and CTDOT procedures. See <a class=\"xref\" href=\"#lr/low/u119\" title=\"TS-Q8 · What is the difference between diagnostic and proof load testing?\">LR 3.5<\/a>.<\/p><\/li>\n<\/ul>\n", "num": "LR 3.4", "home": ["lr", "low"], "old": "Q18"}, {"id": "u28", "title": "Design and Construction Questions", "kind": "ref", "html": "\n<p><em>v4: <a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a> (ABC) moved to <a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a>; <a class=\"xref\" href=\"#con/submittals/u40\" title=\"Q33 · A contractor proposes a change, an alternate construction sequence, or a submittal deviation that affects the load path. How do you review it?\">CN 1.3<\/a> now also covers <a class=\"xref\" href=\"#con/submittals/u40\" title=\"Q33 · A contractor proposes a change, an alternate construction sequence, or a submittal deviation that affects the load path. How do you review it?\">CN 1.3<\/a> and\n<a class=\"xref\" href=\"#con/submittals/u40\" title=\"Q33 · A contractor proposes a change, an alternate construction sequence, or a submittal deviation that affects the load path. How do you review it?\">CN 1.3<\/a>.<\/em><\/p>\n", "num": "VN 4.8", "home": ["vf", "about"], "old": "§4"}, {"id": "u29", "title": "Describe your approach to a bridge replacement or rehabilitation task order.", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q19.<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Confirm project purpose and need.<\/p><\/li>\n<li><p>Review condition and constraints.<\/p><\/li>\n<li><p>Establish alternatives and evaluation criteria.<\/p><\/li>\n<li><p>Coordinate structure, roadway, traffic, hydraulics, geotechnical,\nutilities, environmental, railroad, and public impacts.<\/p><\/li>\n<li><p>Incorporate constructability and maintenance of traffic\nearly.<\/p><\/li>\n<li><p>Develop plans, specifications, and estimates together.<\/p><\/li>\n<li><p>Update the load rating when capacity is affected and plan for\nDSDC before final design.<\/p><\/li>\n<\/ul>\n", "num": "PM 3.5", "home": ["pm", "delivery"], "old": "Q19"}, {"id": "u30", "title": "How do you decide between rehabilitation and replacement? Does CTDOT have a defined process?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q20 and PR-Q6 (both the question and its\npractice-prompt version), with Appendix A-Q20 and the Practice Session 1\ndebrief. Expanded in v5 with CTDOT’s two-level decision process. Also\nasked as:<strong> <\/strong>“<strong>A bridge has widespread but variable\ndeterioration, several prior repairs, and an acceptable current\nlegal-load rating. Is targeted rehabilitation, major rehabilitation, or\nreplacement appropriate?<\/strong>”<strong> <\/strong>and<strong>\n<\/strong>“<strong>How does CTDOT establish whether a bridge is\nrehabilitated or replaced?<\/strong>”<strong> <\/strong>The service life\nanalysis behind the decision is <a class=\"xref\" href=\"#rh/decide/u121\" title=\"TS-Q10 · How do you estimate remaining useful service life — the service life analysis behind a rehabilitation or replacement decision?\">RH 1.4<\/a>; durability of the repair itself\nis under <a class=\"xref\" href=\"#pq/full/u81\" title=\"Prior Q1 · Innovative materials, accelerated construction, service life, and maintenance\">PQ 2.1<\/a>.<\/em><\/p>\n<p><strong>Short answer:<\/strong> Yes. CTDOT decides at two levels.\nAsset management and life-cycle planning decide which bridges get\nprojects and roughly what kind of work; at the project level, the BRSDM\nrequires a documented Bridge Rehabilitation Study (or, for a new\nstructure, Structure Type Studies) that sets the scope. Service life\nanalysis links the two.<\/p>\n<p><strong>Level 1 — network level: asset management and life-cycle\nplanning<\/strong><\/p>\n<ul>\n<li><p>Federal law requires a risk-based Transportation Asset Management\nPlan (TAMP) for NHS bridges and pavements, built on life-cycle planning,\nrisk management, financial planning, and investment strategies (23 CFR\n515). FHWA defines life-cycle planning as estimating the cost of\nmanaging an asset class over its whole life while minimizing cost and\npreserving or improving condition.<\/p><\/li>\n<li><p>CTDOT’s TAMP premise: new bridges are designed to last at least\n75 years; components such as decks have shorter lives and are replaced\nperiodically; deferring preservation accelerates deterioration and can\nlead to costlier repairs, load restrictions, or closure. (The version\nreviewed is the 2018 FHWA-certified TAMP; check the current one before\nquoting targets.)<\/p><\/li>\n<li><p>Inputs: NBI and element-level inspection ratings (federal\ngood/fair/poor status is driven by the lowest of deck, superstructure,\nsubstructure, or culvert ratings), load rating and posting status,\nfracture-critical and scour-critical status, functional needs (width,\nclearance, railing), traffic, route importance, and risk.<\/p><\/li>\n<li><p>Output: a treatment on the preservation → repair → rehabilitation\n→ replacement ladder, which becomes a Capital Plan project with a stated\npurpose (for example, rehabilitation “to maintain a State of Good Repair\nand extend the life of the structure,” or superstructure\nreplacement).<\/p><\/li>\n<\/ul>\n<p><strong>Level 2 — project level: the BRSDM process<\/strong><\/p>\n<ul>\n<li><p>Where it sits in the submission sequence (BRSDM Vol. 1A):\nenvironmental review → hydrologic and preliminary hydraulic studies →\npreliminary design (30%) → scour analysis → <strong>Structure Type\nStudies or Rehabilitation Study Report<\/strong> → semi-final (60%) →\nfinal (90%).<\/p><\/li>\n<li><p>The BRSDM section “Structure Scoping: Bridge Rehabilitation\nStudy” requires a Bridge Rehabilitation Study on all projects during\nPreliminary Design. Its five elements: information collection; LRFD\nanalyses; the Rehabilitation Study Report (RSR); a presentation to\nCTDOT; and a Determination and Report of Meeting, which is the formal\ndecision record. Cite the BRSDM, not the superseded BDM.<\/p><\/li>\n<li><p>Work is classified into 13 rehabilitation sub-scopes (beam end\nrepair, deck replacement, parapet/railing modification to MASH,\nwidening, superstructure replacement, strengthening, or\npreservation/repair, substructure repair, strengthening, or replacement,\nbearing replacement, buried-structure rehabilitation, deck patching). A\nBRSDM table lists which components must be analyzed for each.<\/p><\/li>\n<li><p>Analyses by sub-scope: load rating (including beam ends and\nconstruction loading such as the CT-TLC), seismic restraint and seat\nlength, vehicle collision, hydraulics and scour, and other code force\neffects only for bridges CTDOT designates as critical.<\/p><\/li>\n<li><p>A new load rating is required when critical section loss is not\nreflected in the rating on file (As-Inspected rating), the rating on\nfile does not meet current BLRM live-load requirements, or dead load has\nbeen added.<\/p><\/li>\n<li><p><strong>The key structural gate:<\/strong> every vehicular bridge\non a rehabilitation or preservation project must meet the Design Loading\nStructural Capacity controlling criterion. If the scope cannot achieve\nit, the BRSDM requires the scope to be modified or a new project\ninitiated — often where a “rehab” becomes a superstructure or full\nreplacement. A design inventory rating alone cannot demonstrate the\ncriterion is met, and construction may never permanently reduce a\ndeficient bridge’s capacity.<\/p><\/li>\n<li><p>Vertical clearance and bridge width are also CTDOT controlling\ncriteria for bridges. Not meeting them requires a design exception\nrequested early in preliminary design; a vertical-clearance exception on\nI-84, I-91, I-95, or I-395 also needs military (SDDCTEA)\nconcurrence.<\/p><\/li>\n<li><p>If replacement is chosen, Structure Type Studies must include\nconstruction cost and a Life Cycle Cost Analysis for each structure\ntype, with contingencies and inflation, and CTDOT holds a meeting to\nselect the type.<\/p><\/li>\n<li><p>The BRSDM lists a Volume 3, Bridge Rehabilitation and\nPreservation; check whether it has been published before the\ninterview.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — what drives the decision<\/strong><\/p>\n<ul>\n<li><p>Begin with condition and CTDOT’s service-life, route, risk, and\ncost objectives rather than the acceptable legal rating alone.<\/p><\/li>\n<li><p>Separate local defects from system-wide deterioration, identify\nthe governing mechanism, and establish how fast it is\nprogressing.<\/p><\/li>\n<li><p>Condition and load-rating limitations; use the rating to identify\nconstraints and sensitivity to future deterioration.<\/p><\/li>\n<li><p>Remaining service life, and the deck is often the driver (method\nin <a class=\"xref\" href=\"#rh/decide/u121\" title=\"TS-Q10 · How do you estimate remaining useful service life — the service life analysis behind a rehabilitation or replacement decision?\">RH 1.4<\/a>).<\/p><\/li>\n<li><p>Code and loading changes over the structure’s life:\nrehabilitating the superstructure does not mean the substructure is\nadequate for current loads.<\/p><\/li>\n<li><p>Fatigue on heavily trafficked truck routes: tracking and\nretrofitting fatigue-prone details can make replacement the better\noption.<\/p><\/li>\n<li><p>Functional obsolescence: deficient width, substandard rail,\ninadequate vertical clearance, scour vulnerability, and hydraulic\ncapacity. Rehabilitation often cannot fix these, and they frequently\ndrive replacement.<\/p><\/li>\n<li><p>User impacts: closure duration, detour length, and traffic\ndisruption can outweigh the construction-cost difference.<\/p><\/li>\n<li><p>Constructability, environmental constraints, seismic needs,\nutilities, maintenance needs, resilience, risk, and life-cycle\nvalue.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — deciding<\/strong><\/p>\n<ul>\n<li><p>Develop comparable alternatives (targeted repair, major\nrehabilitation, replacement) with future loads, service-life extension,\nstaging, user impacts, maintenance, risk, cost, and\nuncertainty.<\/p><\/li>\n<li><p>Life-cycle rule of thumb (industry heuristic from the mock, not\nCTDOT policy): when rehabilitation approaches roughly 60 percent of\nreplacement cost, give serious consideration to replacement and\nresetting the clock on a 75-year (or extended) design life. Frame it as\na trigger for consideration, not a hard rule.<\/p><\/li>\n<li><p>Identify trigger points at which rehabilitation no longer\nprovides reliable value, and recommend a strategy with clear\nuncertainty.<\/p><\/li>\n<li><p>Document the recommendation in the RSR and present it so the\nDetermination and Report of Meeting records the decision.<\/p><\/li>\n<li><p>Close: rehabilitation only makes sense if it reliably addresses\nthe governing deficiency, including the Design Loading Structural\nCapacity criterion; otherwise cost comparisons are moot.<\/p><\/li>\n<\/ul>\n<p><strong>Soundbite:<\/strong> “CTDOT decides this at two levels. Asset\nmanagement and the TAMP’s life-cycle planning decide which bridges get\nprojects. At the project level, the BRSDM requires a Bridge\nRehabilitation Study on every project — information collection, LRFD\nanalyses and load rating by sub-scope, and a Rehabilitation Study\nReport, presented to CTDOT and closed out with a Determination and\nReport of Meeting. Our job is to give that decision a defensible basis:\ncomponent-by-component remaining life, alternatives compared on\nlife-cycle cost including user costs, and a clear view of whether\nrehabilitation can actually meet the Design Loading Structural Capacity\ncriterion and the functional needs. If it can’t, the cost comparison\ndoesn’t matter.”<\/p>\n<p><strong>Likely follow-up:<\/strong> How would an acceptable legal\nrating still lead to replacement? (Obsolescence, fatigue, substructure\nadequacy, deck life, the Design Loading Structural Capacity criterion,\nor user costs.)<\/p>\n<p><strong>Rehearsal requirement:<\/strong> Use one verified project\nexample, state the speaker’s personal role, and close with the specific\nbenefit to CTDOT.<\/p>\n<p><strong>Sources:<\/strong> BRSDM Release 1, Vol. 1A (design review\nsubmissions, controlling criteria, Structure Type Studies, Bridge\nRehabilitation Study); CTDOT Highway TAMP (2018, FHWA-certified); CTDOT\nFFY 2025–2029 Capital Plan project sheets.<\/p>\n", "num": "RH 1.2", "home": ["rh", "decide"], "old": "Q20"}, {"id": "u31", "title": "How will you review contractor submittals and RFIs?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q22. Submittals that change the load\npath or sequence are <a class=\"xref\" href=\"#con/submittals/u40\" title=\"Q33 · A contractor proposes a change, an alternate construction sequence, or a submittal deviation that affects the load path. How do you review it?\">CN 1.3<\/a>.<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Establish a responsibility matrix and confirm review\nscope.<\/p><\/li>\n<li><p>Check conformance with design intent and documents.<\/p><\/li>\n<li><p>Identify deviations explicitly and coordinate interdisciplinary\neffects.<\/p><\/li>\n<li><p>Track status and commitments and respond within required\ntimeframes and schedule.<\/p><\/li>\n<li><p>Maintain consistency among RFIs, revised details, record\ndocuments, and the final rating.<\/p><\/li>\n<li><p>Escalate changes affecting structural capacity or load\npath.<\/p><\/li>\n<\/ul>\n", "num": "CN 1.2", "home": ["con", "submittals"], "old": "Q22"}, {"id": "u32", "title": "Tell us about a construction-stage problem and how you resolved it.", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q23.<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Use the Summer Street bridge separation or Roosevelt Circle\nemergency response (story cards in <a class=\"xref\" href=\"#pm/you/u155\" title=\"§23 · Mario LoCoco — Personal Answer Bank\">PM 4.3<\/a>).<\/p><\/li>\n<li><p>Frame the story as Situation, Risk, Action, Result, and\nApplication to CTDOT.<\/p><\/li>\n<li><p>Be explicit about your personal role and technical\ndecisions.<\/p><\/li>\n<\/ul>\n", "num": "CN 2.1", "home": ["con", "stage"], "old": "Q23"}, {"id": "u33", "title": "Describe your experience with OpenBridge Modeler and CTDOT’s digital-delivery environment, and how it improves quality.", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q24 and PR-Q14 (with Appendix A-Q24). Also\nasked as:<strong> <\/strong>“<strong>Explain how OpenBridge, OpenRoads,\nanalytical models, and CTDOT’s digital environment improve coordination\nand quality, including ownership, versions, reviews, native\ndeliverables, and rating updates.<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — who and what<\/strong><\/p>\n<ul>\n<li><p>Name the hands-on people who will execute or supervise the work,\nwith specific practitioners, projects, deliverables, and quality checks\nrather than a general corporate statement.<\/p><\/li>\n<li><p>Confirm use of the required current CTDOT environment for each\nassignment.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — how it is controlled<\/strong><\/p>\n<ul>\n<li><p>Use a task-level digital execution plan covering model ownership,\nfile structure, and naming.<\/p><\/li>\n<li><p>Control versions, coordinate systems, units, references, and\nsoftware environments.<\/p><\/li>\n<li><p>Perform planned structural-roadway coordination and model checks,\nand review before electronic-engineering-data delivery.<\/p><\/li>\n<li><p>Link changes across models, plans, quantities, specifications,\nand load ratings so an update in one propagates to the others.<\/p><\/li>\n<li><p>Deliver usable native files and document versions and known\nissues.<\/p><\/li>\n<\/ul>\n<p><strong>Rehearsal requirement:<\/strong> Use one verified project\nexample, state the speaker’s personal role, and close with the specific\nbenefit to CTDOT.<\/p>\n", "num": "DE 9.1", "home": ["de", "digital"], "old": "Q24"}, {"id": "u34", "title": "How do you address software errors, version changes, or unexpected output — for example, a BrR upgrade that moves a rating by more than 10%?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q25 and N5 (with Appendix A-Q25). Also asked\nas:<strong> <\/strong>“<strong>A BrR upgrade changes a rating on file by\nmore than 10%. How do you handle and explain it?<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — controls<\/strong><\/p>\n<ul>\n<li><p>Verify approved and current versions at task start and document\nthe model version and analysis engine. Use only CTDOT’s accepted BrR\nversion (currently 7.6.1); ratings in newer versions will not be\naccepted.<\/p><\/li>\n<li><p>Review known software issues (including applicable Jira tickets),\nperform independent checks, and document workarounds; do not rely on\nunverified defaults.<\/p><\/li>\n<li><p>Reassess affected results after upgrades.<\/p><\/li>\n<li><p>Obtain CTDOT concurrence if another platform or multiple programs\nare needed.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — explaining a version-driven\nchange<\/strong><\/p>\n<ul>\n<li><p>Separate what changed in the software and code from what changed\nin the structure. ACEC and CTDOT have discussed that version changes in\nshear and lateral-torsional buckling alone have moved a large share of\nratings by more than 10%.<\/p><\/li>\n<li><p>Run the same model in both versions where possible and isolate\nthe provision causing the change.<\/p><\/li>\n<li><p>Document the cause in the Comments section of the methodology,\nand notify the LRS promptly if a legal or permit result drops below\n1.0.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — what changed for lateral-torsional\nbuckling (BrR 7.6 / 7.6.1, AASHTO LRFD 10th Edition)<\/strong><\/p>\n<ul>\n<li><p>Background from the ACEC minutes: consultants reported 25–30% of\nthe inventory changing by more than 10% between BrR versions, attributed\nto shear (7.3 to 7.5) and LTB (changed in every version since 7.6). Most\nstates moved to 7.6.1 because of the LTB changes, and 7.6.1 also changed\ncross-frame modeling and requirements, concrete development length,\ncontrol options, and Cb features.<\/p><\/li>\n<li><p>New moment-gradient modifier Cb: computed from moments at the\nquarter points of the unbraced length, replacing the older\nend-and-midpoint stress equation. BrR adds analysis points at quarter\npoints of every unbraced region.<\/p><\/li>\n<li><p>New control options that affect Cb: “consider concurrent moments”\n(quarter-point moments from the load pattern producing the maximum\nmoment) versus maximized envelope moments; and a compact-web alternate\nCb using AISC equation C-F1-5 for compact webs with a continuously\nbraced top flange in reverse curvature with no intermediate\nbottom-flange bracing (the negative-moment region of a continuous\ncomposite girder). Record which options were used — they are a new\nsource of variation between evaluators.<\/p><\/li>\n<li><p>Nonprismatic unbraced lengths: new Appendix D6.6 computes LTB\nresistance where the section changes within the unbraced length\n(typically over interior piers); BrR supports Method A and Method B and\nreverts to Method A when the modeled transitions don’t fit Method B. Cb,\nrt, and Fe are computed per 6.10.8.2.3b for prismatic and 6.10.8.2.3c\nfor nonprismatic lengths.<\/p><\/li>\n<li><p>Governing location: LTB resistance is evaluated at a single\npoint, where f_bu/(R_b R_h F_yc) is maximum (for Appendix A6, where\nM_u/(R_pc M_yc) is maximum), instead of pairing maximum action with\nminimum capacity anywhere in the unbraced length.<\/p><\/li>\n<li><p>Appendix A6 applicability: the A6 criteria must now be satisfied\nat every point in the unbraced length, so some girders lose the higher\nA6 flexural resistance.<\/p><\/li>\n<li><p>Net effect: quarter-point Cb, single-point evaluation, and the\nnonprismatic method generally recover capacity; stricter A6\napplicability and envelope-moment Cb can reduce it. Ratings can move\neither way depending on spans, bracing, and flange transitions — which\nis why CTDOT tests each version before accepting it.<\/p><\/li>\n<li><p>Verify article numbers against a licensed copy of the 10th\nEdition before quoting them. Source: AASHTOWare BrDR 7.6.1 tutorial\nSTL16 (LRFD 10th Edition LTB update), July 2025.<\/p><\/li>\n<\/ul>\n", "num": "LR 9.2", "home": ["lr", "software"], "old": "Q25"}, {"id": "u35", "title": "Staffing and Availability Questions", "kind": "ref", "html": "\n<p><em>v4: <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a> merged into <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a>.<\/em><\/p>\n", "num": "VN 4.9", "home": ["vf", "about"], "old": "§6"}, {"id": "u36", "title": "John McKenna is relatively new to HDR. How will you ensure continuity and internal support?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q27.<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Emphasize his direct CTDOT project background and technical\nfamiliarity.<\/p><\/li>\n<li><p>Explain Mario LoCoco’s role in established HDR delivery and\ntechnical continuity.<\/p><\/li>\n<li><p>Describe Principal-in-Charge oversight and support from\nestablished technical leads.<\/p><\/li>\n<li><p>Keep decisions, commitments, and task status documented rather\nthan dependent on one person.<\/p><\/li>\n<\/ul>\n", "num": "PM 2.3", "home": ["pm", "staffing"], "old": "Q27"}, {"id": "u37", "title": "What work will Mario LoCoco personally perform on this contract?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q28. Mario answers this one himself\n(Practice Session 1).<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Support the Project Manager in managing task orders.<\/p><\/li>\n<li><p>Lead or oversee load-rating and structural-analysis\nwork.<\/p><\/li>\n<li><p>Select and coordinate technical staff.<\/p><\/li>\n<li><p>Review scopes, assumptions, analysis approaches, and significant\nfindings.<\/p><\/li>\n<li><p>Coordinate complex-analysis specialists.<\/p><\/li>\n<li><p>Support QC and technical comment resolution.<\/p><\/li>\n<li><p>Communicate low ratings and risks promptly.<\/p><\/li>\n<li><p>Provide continuity across design, rating, and construction\nsupport.<\/p><\/li>\n<\/ul>\n", "num": "PM 2.4", "home": ["pm", "staffing"], "old": "Q28"}, {"id": "u38", "title": "Scenario Questions to Rehearse", "kind": "ref", "html": "\n<p><em>v4: <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a> merged into <a class=\"xref\" href=\"#pm/staffing/u12\" title=\"Q2 · How will you manage multiple concurrent task orders and guarantee the named team’s availability?\">PM 2.1<\/a>; <a class=\"xref\" href=\"#lr/qa/u16\" title=\"Q7 · How will you review load ratings prepared by others — including one you are asked to update, or one that looks wrong?\">LR 4.4<\/a> into <a class=\"xref\" href=\"#lr/qa/u16\" title=\"Q7 · How will you review load ratings prepared by others — including one you are asked to update, or one that looks wrong?\">LR 4.4<\/a>; <a class=\"xref\" href=\"#lr/low/u27\" title=\"Q18 · A low rating is driven by incomplete documentation or a conservative assumption. How do you proceed?\">LR 3.4<\/a> into <a class=\"xref\" href=\"#lr/low/u27\" title=\"Q18 · A low rating is driven by incomplete documentation or a conservative assumption. How do you proceed?\">LR 3.4<\/a>.<\/em><\/p>\n", "num": "VN 4.10", "home": ["vf", "about"], "old": "§7"}, {"id": "u39", "title": "Inspection information conflicts with the plans. Which do you use?", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q31.<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Determine whether the difference reflects undocumented\nconstruction, rehabilitation, deterioration, or inspection\nuncertainty.<\/p><\/li>\n<li><p>Reconcile using records, photos, historic documents,\nmeasurements, and site verification.<\/p><\/li>\n<li><p>Rate the actual current structure.<\/p><\/li>\n<li><p>Document the discrepancy, resolution, and sensitivity.<\/p><\/li>\n<\/ul>\n", "num": "LR 7.4", "home": ["lr", "ctdot"], "old": "Q31"}, {"id": "u40", "title": "A contractor proposes a change, an alternate construction sequence, or a submittal deviation that affects the load path. How do you review it?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q33, PR-Q9 (both the question and its\npractice-prompt version), and PR-Q12, with Appendix A-Q33. Also asked\nas:<strong> <\/strong>“<strong>Describe review of a contractor-proposed\nalternate sequence<\/strong>”<strong> <\/strong>and<strong>\n<\/strong>“<strong>A fabrication or erection submittal differs from the\ncontract plans but may improve schedule.<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — responsibilities<\/strong><\/p>\n<ul>\n<li><p>Clarify Engineer of Record and contractor means-and-methods\nresponsibilities while preserving design intent.<\/p><\/li>\n<li><p>Identify the deviation, who owns it, and which limit states,\ndurability, access, and interfaces it affects.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — technical review<\/strong><\/p>\n<ul>\n<li><p>Evaluate every structurally distinct temporary stage and the\npermanent condition: temporary restraint, wind, equipment loads, deck\nplacement, erection, tolerances, and stability limit states.<\/p><\/li>\n<li><p>Determine whether the change alters temporary stability,\npermanent stresses (including locked-in stresses), geometry,\nconnections, or the final rating.<\/p><\/li>\n<li><p>Require supporting calculations, assumptions, and revised details\nproportional to the change.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — managing it<\/strong><\/p>\n<ul>\n<li><p>Use focused multidisciplinary issue triage so a\nschedule-improving deviation gets a fast answer.<\/p><\/li>\n<li><p>Coordinate with the Engineer of Record and CTDOT.<\/p><\/li>\n<li><p>Require hold points, monitoring, and contingencies where\nwarranted.<\/p><\/li>\n<li><p>Document acceptance conditions and verify implementation in the\nfield.<\/p><\/li>\n<li><p>Update design documents and rating records if the change is\naccepted.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> What if the alternate sequence\nchanges locked-in stresses? (Analyze the revised sequence for final\nstresses and geometry, carry them into the As-Constructed rating, and\naccept only if permanent performance is not reduced.)<\/p>\n<p><strong>Rehearsal requirement:<\/strong> Use one verified project\nexample, state the speaker’s personal role, and close with the specific\nbenefit to CTDOT.<\/p>\n", "num": "CN 1.3", "home": ["con", "submittals"], "old": "Q33"}, {"id": "u41", "title": "CTDOT requests rapid turnaround, but information is incomplete.", "kind": "qa", "html": "\n<p><em>Merged in v4 with Appendix A-Q34.<\/em><\/p>\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Communicate missing information and risk immediately.<\/p><\/li>\n<li><p>Separate work that can proceed from decisions that\ncannot.<\/p><\/li>\n<li><p>Use interim assumptions only when defensible and\ndocumented.<\/p><\/li>\n<li><p>Consider staged deliverables.<\/p><\/li>\n<li><p>Prioritize information controlling the decision.<\/p><\/li>\n<li><p>Do not bypass independent review or safety\ncommunication.<\/p><\/li>\n<\/ul>\n", "num": "PM 3.2", "home": ["pm", "delivery"], "old": "Q34"}, {"id": "u42", "title": "Themes to work into multiple answers", "kind": "ref", "html": "\n<ul>\n<li><p>Local leadership owns delivery; specialized resources provide\ndepth and surge capacity.<\/p><\/li>\n<li><p>Load ratings should support posting, permits, repair\nprioritization, rehabilitation, construction staging, and asset\nmanagement.<\/p><\/li>\n<li><p>Model validation and engineering judgment matter more than\nsoftware operation.<\/p><\/li>\n<li><p>Communicate low ratings, critical findings, missing information,\nscope changes, schedule concerns, and contractor deviations\nearly.<\/p><\/li>\n<li><p>Deliver complete and reproducible packages.<\/p><\/li>\n<li><p>Integrate design, rating, inspection, and construction rather\nthan treating them as isolated services.<\/p><\/li>\n<\/ul>\n", "num": "IS 2.9", "home": ["strat", "messages"], "old": "§8"}, {"id": "u43", "title": "Areas where the panel may probe", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\"/>\n<col style=\"width: 50%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Potential Challenge<\/strong><\/th>\n<th><strong>Preparation Response<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Actual availability<\/td>\n<td>Prepare a precise staffing and backup plan tied to named\npersonnel.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Prime versus subconsultant split<\/td>\n<td>Show that HDR performs the majority of work and CHA has defined\nspecialty roles.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Local staffing<\/td>\n<td>Explain where production occurs and how daily direct supervision is\nmaintained.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hands-on OpenBridge experience<\/td>\n<td>Name practitioners, projects, deliverables, and checks.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Currency of governing requirements<\/td>\n<td>The attached load-rating manual is Version 2018.1.0. State that the\nteam will confirm current manuals, rating aids, approved software, user\nguides, vehicle files, directives, and bulletins at the start of every\nassignment.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Consistency of proposal claims<\/td>\n<td>Reconcile project counts, rankings, staff totals, years of\nexperience, software proficiency, dates, and responsibilities before the\ninterview.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "num": "IS 4.1", "home": ["strat", "probes"], "old": "§8"}, {"id": "u44", "title": "Recommended Response Formula", "kind": "ref", "html": "\n<p>Direct answer<\/p>\n<p>How the team will do it on this contract<\/p>\n<p>Specific, relevant example<\/p>\n<p>Benefit to CTDOT<\/p>\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 100%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Example response<\/strong> “We would begin by verifying\nwhether the initial low rating reflects actual structural behavior or an\navoidable conservative assumption. On this contract, Mario would lead\nthe technical verification with an independent QC reviewer, and we would\npromptly communicate any finding that could affect public safety. On the\nCommodore Hull assignment, the team identified modeling and input\nconcerns, used refined analysis and field data to understand the\nbehavior, and supported an implementable repair. That approach gives\nCTDOT timely information while maintaining analytical rigor.”<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div>\n<p><em>v3 note: <a class=\"xref\" href=\"#strat/delivery/u166\" title=\"§26.1 · Delivery and Format Notes\">IS 1.5<\/a> adds answer-length guidance (three to five\nminutes per question, about 400–650 spoken words) and a list of phrases\nto avoid.<\/em><\/p>\n", "num": "IS 1.6", "home": ["strat", "delivery"], "old": "§9"}, {"id": "u45", "title": "Five messages the panel should remember", "kind": "ref", "html": "\n<ul>\n<li><p>John McKenna and Mario LoCoco provide an experienced, locally\naccessible management team.<\/p><\/li>\n<li><p>The team can handle routine bridge replacements and ratings\nwithout overcomplicating them.<\/p><\/li>\n<li><p>The team can solve unusual or high-risk problems using refined\nanalysis, instrumentation, and specialists.<\/p><\/li>\n<li><p>Quality control is independent, documented, and proportionate to\ncomplexity and consequences.<\/p><\/li>\n<li><p>The team communicates early when findings affect safety, posting,\nschedule, cost, or construction.<\/p><\/li>\n<\/ul>\n", "num": "IS 2.5", "home": ["strat", "messages"], "old": "§9"}, {"id": "u46", "title": "Rehearsal Worksheet", "kind": "ref", "html": "\n<p>Prepare six two-minute project stories. Each story should identify\nthe speaker’s personal role and the direct benefit to CTDOT.<\/p>\n", "num": "IS 3.1", "home": ["strat", "rehearsal"], "old": "§10"}, {"id": "u47", "title": "Routine bridge design", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Situation / context<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Risk or technical challenge<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Personal role and action<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Result<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Application to CTDOT CSO 2522<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "num": "IS 3.2", "home": ["strat", "rehearsal"], "old": "§10"}, {"id": "u48", "title": "Complex load rating", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Situation / context<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Risk or technical challenge<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Personal role and action<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Result<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Application to CTDOT CSO 2522<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "num": "IS 3.3", "home": ["strat", "rehearsal"], "old": "§10"}, {"id": "u49", "title": "Low-rating refinement", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Situation / context<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Risk or technical challenge<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Personal role and action<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Result<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Application to CTDOT CSO 2522<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "num": "IS 3.4", "home": ["strat", "rehearsal"], "old": "§10"}, {"id": "u50", "title": "Emergency response", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Situation / context<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Risk or technical challenge<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Personal role and action<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Result<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Application to CTDOT CSO 2522<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "num": "IS 3.5", "home": ["strat", "rehearsal"], "old": "§10"}, {"id": "u51", "title": "DSDC or contractor-submittal issue", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Situation / context<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Risk or technical challenge<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Personal role and action<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Result<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Application to CTDOT CSO 2522<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "num": "IS 3.6", "home": ["strat", "rehearsal"], "old": "§10"}, {"id": "u52", "title": "Concurrent task-order management", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<thead>\n<tr class=\"header\">\n<th>Situation / context<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Risk or technical challenge<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Personal role and action<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Result<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Application to CTDOT CSO 2522<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "num": "IS 3.7", "home": ["strat", "rehearsal"], "old": "§10"}, {"id": "u53", "title": "Source Documents Reviewed (original)", "kind": "ref", "html": "\n<ul>\n<li><p>CSO 2522 Request for Letter of Interest-POST (2).pdf, dated June\n18, 2026.<\/p><\/li>\n<li><p>CSO#2522.HDR.pdf, HDR qualifications package for Task Order\nBridge Design and Load Rating Support Services.<\/p><\/li>\n<li><p>CTDOT Bridge Load Rating Manual, Version 2018.1.0, revised March\n29, 2018.<\/p><\/li>\n<li><p>CTDOT CONNECT DDE public webpage reviewed during preparation for\ncurrent digital-delivery context.<\/p><\/li>\n<\/ul>\n<p><strong>Important:<\/strong> Before the interview and before each\nassignment, confirm the current official CTDOT manuals, rating aids,\nsoftware requirements, vehicle libraries, directives, bulletins, and\ndigital-delivery requirements.<\/p>\n", "num": "VN 4.11", "home": ["vf", "about"], "old": "§10"}, {"id": "u54", "title": "Additional Sources Reviewed for v2", "kind": "ref", "html": "\n<ul>\n<li><p>CTDOT Bridge Load Rating Manual 2018.1.0, Rating Aids, and QA\nChecklist.<\/p><\/li>\n<li><p>CTDOT Bridge and Roadway Structures Design Manual, Release 1, and\nthe 2003 Bridge Design Manual (rev. 02/24), Section 14 Sign\nSupports.<\/p><\/li>\n<li><p>CTDOT/ACEC Liaison Committee load rating meeting minutes: August\n29, 2022; January 19, 2023; July 20, 2023; March 7, 2024; December 12,\n2024; July 17, 2025 (the file labeled January 15, 2026 duplicates July\n2025).<\/p><\/li>\n<li><p>CTDOT load rating correspondence on special-permit and\ncross-frame iteration procedure (2018); ACEC curved-deck study graph;\ncontractor paving train and MTV submittal (Project 0174-0455); paving\ntrain axle configurations (0063-703).<\/p><\/li>\n<li><p>CTDOT Load Rating web page, checked September 24, 2026 (manual\nversions, CTDOT programs, accepted software versions).<\/p><\/li>\n<\/ul>\n", "num": "VN 4.12", "home": ["vf", "about"], "old": "§10"}, {"id": "u55", "title": "General Load Rating and AASHTO MBE/LRFR Questions", "kind": "ref", "html": "\n<p><em>v4: Q40–Q41 merged into <a class=\"xref\" href=\"#lr/fund/u61\" title=\"Q39 · Explain Inventory, Operating, legal, and permit ratings — and why a bridge can fail Inventory but pass legal loads.\">LR 1.6<\/a>; Q43–Q44 into <a class=\"xref\" href=\"#lr/fund/u60\" title=\"Q38 · Explain the LRFR rating-factor equation and the role of the condition and system factors.\">LR 1.5<\/a>; <a class=\"xref\" href=\"#lr/steel/u21\" title=\"Q11 · How do you account for deterioration and section loss — for example, on a deteriorated steel-girder bridge?\">LR 5.7<\/a> into <a class=\"xref\" href=\"#lr/steel/u21\" title=\"Q11 · How do you account for deterioration and section loss — for example, on a deteriorated steel-girder bridge?\">LR 5.7<\/a>; <a class=\"xref\" href=\"#lr/fund/u67\" title=\"Q50 · What is the significance of ADTT, and how do you determine the appropriate live-load factor?\">LR 1.12<\/a>\ninto <a class=\"xref\" href=\"#lr/fund/u67\" title=\"Q50 · What is the significance of ADTT, and how do you determine the appropriate live-load factor?\">LR 1.12<\/a>; <a class=\"xref\" href=\"#lr/software/u14\" title=\"Q5 · How do you determine whether to use BrR or a refined finite-element model, and when is refinement worth the cost?\">LR 9.1<\/a> into <a class=\"xref\" href=\"#lr/software/u14\" title=\"Q5 · How do you determine whether to use BrR or a refined finite-element model, and when is refinement worth the cost?\">LR 9.1<\/a>; <a class=\"xref\" href=\"#pq/full/u85\" title=\"Prior Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a> into <a class=\"xref\" href=\"#pq/full/u85\" title=\"Prior Q5 · Complex load rating using MIDAS or LARSA — and validating the model\">PQ 2.5<\/a>; <a class=\"xref\" href=\"#lr/ctdot/u22\" title=\"Q12 · How do you handle missing plans or uncertain material properties?\">LR 7.3<\/a> into <a class=\"xref\" href=\"#lr/ctdot/u22\" title=\"Q12 · How do you handle missing plans or uncertain material properties?\">LR 7.3<\/a>; <a class=\"xref\" href=\"#lr/low/u23\" title=\"Q13 · What is your approach to material testing, strain gauging, load testing, and instrumentation?\">LR 3.3<\/a> into <a class=\"xref\" href=\"#lr/low/u23\" title=\"Q13 · What is your approach to material testing, strain gauging, load testing, and instrumentation?\">LR 3.3<\/a>;\n<a class=\"xref\" href=\"#lr/steel/u25\" title=\"Q16 · How do you handle critical connections and gusset plates, and when must they be rated?\">LR 5.9<\/a> into <a class=\"xref\" href=\"#lr/steel/u25\" title=\"Q16 · How do you handle critical connections and gusset plates, and when must they be rated?\">LR 5.9<\/a>.<\/em><\/p>\n<p>These questions expand the guide with fundamentals that may be used\nto test whether the interview team understands the engineering\nphilosophy behind a rating, not just the operation of rating software.\nAnswers should distinguish general AASHTO MBE/LRFR concepts from\nCTDOT-specific policy and should confirm the current governing editions\nand owner requirements at the start of each assignment.<\/p>\n", "num": "LR 1.13", "home": ["lr", "fund"], "old": "§11"}, {"id": "u56", "title": "LRFR Concepts to Keep Straight", "kind": "ref", "html": "\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 50%\"/>\n<col style=\"width: 50%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Concept<\/strong><\/th>\n<th><strong>Interview-Level Explanation<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rating factor<\/td>\n<td>A ratio-type measure comparing factored available resistance, after\npermanent-load effects, with factored live-load effect for the vehicle\nand limit state being evaluated.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Inventory level<\/td>\n<td>A design-load rating level associated with loads that can be carried\non a continuing basis under the applicable evaluation criteria.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Operating level<\/td>\n<td>A higher design-load rating level representing the maximum\npermissible loading level under the applicable evaluation criteria.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Legal rating<\/td>\n<td>Evaluation of vehicles permitted to operate under applicable\nlegal-weight provisions; low results may lead to posting\nevaluation.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Permit rating<\/td>\n<td>Evaluation supporting decisions for overweight vehicles, considering\npermit type, traffic conditions, and owner policy.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Condition factor<\/td>\n<td>An LRFR resistance modifier reflecting the member-specific condition\nof an existing component.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>System factor<\/td>\n<td>An LRFR resistance modifier reflecting structural redundancy and\nsystem behavior at strength limit states.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Refined analysis<\/td>\n<td>An analysis selected when simplified methods do not adequately\nrepresent distribution, geometry, restraint, staged behavior, or another\ncontrolling mechanism.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Source basis:<\/strong> AASHTO Manual for Bridge Evaluation\noverview and the attached CTDOT Bridge Load Rating Manual. Exact\nfactors, vehicles, and procedures must follow the current governing\ndocuments and CTDOT direction.<\/p>\n", "num": "LR 1.14", "home": ["lr", "fund"], "old": "§11"}, {"id": "u57", "title": "What is the purpose of a bridge load rating?", "kind": "qa", "html": "\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Determine the safe live-load carrying capacity of an existing\nstructure in its current or proposed condition.<\/p><\/li>\n<li><p>Support decisions involving posting, permit vehicles,\nrehabilitation, replacement, repair prioritization, and asset\nmanagement.<\/p><\/li>\n<li><p>Provide a consistent and reproducible engineering record that can\nbe updated when conditions or loads change.<\/p><\/li>\n<li><p>Satisfy applicable federal and owner requirements.<\/p><\/li>\n<\/ul>\n", "num": "LR 1.2", "home": ["lr", "fund"], "old": "Q35"}, {"id": "u58", "title": "What is the difference between load rating and bridge design?", "kind": "qa", "html": "\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Design establishes a new or rehabilitated structure using\nprescribed design loads, load combinations, resistance factors,\ndetailing rules, and service-life objectives.<\/p><\/li>\n<li><p>Load rating evaluates the capacity of an existing or proposed\nstructure using its actual geometry, materials, condition,\ndeterioration, dead load, and owner-required vehicles.<\/p><\/li>\n<li><p>A satisfactory design check does not automatically replace all\nowner-required legal, permit, emergency-vehicle, or condition-based\nrating evaluations.<\/p><\/li>\n<li><p>Rating requires close integration with inspection records and\ncurrent field condition.<\/p><\/li>\n<\/ul>\n<p><strong>Possible follow-up or distinction:<\/strong> Be prepared to\nexplain why nominal design capacity and current in-service capacity can\ndiffer.<\/p>\n", "num": "LR 1.3", "home": ["lr", "fund"], "old": "Q36"}, {"id": "u59", "title": "What is LRFR and why is it used?", "kind": "qa", "html": "\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Load and Resistance Factor Rating applies a reliability-based,\nlimit-state framework to bridge evaluation.<\/p><\/li>\n<li><p>It uses calibrated load and resistance factors to address\nvariability and uncertainty in loads, resistance, condition, and system\nbehavior.<\/p><\/li>\n<li><p>It provides a common framework for design-load, legal-load,\npermit-load, and other evaluations required by the owner.<\/p><\/li>\n<li><p>The governing result remains dependent on accurate inputs,\napplicable owner policies, and sound engineering judgment.<\/p><\/li>\n<\/ul>\n", "num": "LR 1.4", "home": ["lr", "fund"], "old": "Q37"}, {"id": "u60", "title": "Explain the LRFR rating-factor equation and the role of the condition and system factors.", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q38, Q43, Q44, and TS-Q3 (with Appendix B-Q3).\nAlso asked as:<strong> <\/strong>“<strong>How do condition factors differ\nfrom section-loss adjustments?<\/strong>”<strong> <\/strong>and<strong>\n<\/strong>“<strong>What is a system factor, and when does it\nmatter?<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — the equation, term by term<\/strong><\/p>\n<ul>\n<li><p>Start with factored component resistance, modified by the\nresistance, condition, and system factors.<\/p><\/li>\n<li><p>Subtract the factored effects of permanent loads (dead load,\nwearing surface) and other applicable loads.<\/p><\/li>\n<li><p>Divide the remaining available capacity by the factored live-load\neffect, including dynamic allowance where applicable. Dead-load and\nlive-load factors modify demand; resistance, condition, and system\nfactors modify capacity.<\/p><\/li>\n<li><p>Evaluate it for each required vehicle, member, location,\nmechanism, and limit state.<\/p><\/li>\n<li><p>A rating factor below 1.0 means the factored demand exceeds the\navailable factored capacity for that specific evaluation case.<\/p><\/li>\n<li><p>Explain what each term physically represents rather than reciting\nthe equation.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — condition factor versus section\nloss<\/strong><\/p>\n<ul>\n<li><p>Section loss changes the physical geometry and nominal resistance\nof the component.<\/p><\/li>\n<li><p>The condition factor accounts for uncertainty and member-specific\ncondition within the LRFR framework; it is not a substitute for\nmeasurements.<\/p><\/li>\n<li><p>Under CTDOT policy the condition factor is used in addition to\nreduced section properties, and it is based on the individual member’s\ncondition rather than automatically applying the overall element\ncondition to every member (BLRM 4.1.2; <a class=\"xref\" href=\"#lr/ctdot/u127\" title=\"§17.3 · Key BLRM Provisions for Quick Recall\">LR 7.17<\/a>).<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — system factor<\/strong><\/p>\n<ul>\n<li><p>The system factor modifies resistance to reflect redundancy, load\npath, and system behavior.<\/p><\/li>\n<li><p>Nonredundant systems generally warrant different treatment from\nredundant systems because consequences and alternate load paths\ndiffer.<\/p><\/li>\n<li><p>It is applied at the applicable strength limit states.<\/p><\/li>\n<li><p>Selection must reflect the actual structural system, connection\nbehavior, and owner-specific modifications (for example, CTDOT’s 1.20\nfor diaphragms and cross-frames in straight girder bridges with no\nbracing distress, BLRM 4.1.3.4).<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> When might a condition factor of\n1.0 still be inappropriate even if section loss is measured? (When\ndeterioration is active and unarrested, or the measurements do not\ncapture the governing location.)<\/p>\n", "num": "LR 1.5", "home": ["lr", "fund"], "old": "Q38"}, {"id": "u61", "title": "Explain Inventory, Operating, legal, and permit ratings — and why a bridge can fail Inventory but pass legal loads.", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q39, Q40, Q41, and TS-Q2 (with Appendix B-Q2).\nAlso asked as:<strong> <\/strong>“<strong>What is the difference between\ndesign, legal, and permit load ratings?<\/strong>”<strong>\n<\/strong>and<strong> <\/strong>“<strong>Why can a bridge have a low\ndesign Inventory rating but acceptable legal ratings?<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — the four levels<\/strong><\/p>\n<ul>\n<li><p>Inventory and Operating are design-load rating levels associated\nwith HL-93, used for evaluation and reporting. Inventory represents the\ncontinuing-use level; Operating represents a higher maximum permissible\nlevel under the applicable criteria.<\/p><\/li>\n<li><p>Legal-load ratings evaluate the owner-required legal, specialized\nhauling, and emergency vehicles allowed by applicable weight laws, and\nthey support posting decisions.<\/p><\/li>\n<li><p>Permit-load ratings evaluate a specific vehicle exceeding normal\nlegal limits, under a defined operating condition and permit provisions,\nand depend on permit type.<\/p><\/li>\n<li><p>Legal and permit evaluations are not reported as\nInventory/Operating pairs, and Inventory/Operating results are not a\nsubstitute for required legal and permit vehicle evaluations.<\/p><\/li>\n<li><p>Different load factors, lane assumptions, multiple-presence\ntreatment, and limit states may apply to each category.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — why Inventory can fail while legal\npasses<\/strong><\/p>\n<ul>\n<li><p>The design load model and a particular legal vehicle do not\ncreate the same load effect.<\/p><\/li>\n<li><p>Design Inventory and legal evaluations use different rating\nlevels, load models, and factors.<\/p><\/li>\n<li><p>Span arrangement, influence-line shape, axle spacing, lane\nloading, distribution, and the controlling limit state affect each\nresult differently.<\/p><\/li>\n<li><p>Each required vehicle must therefore be evaluated rather than\ninferred from HL-93 or another rating.<\/p><\/li>\n<\/ul>\n", "num": "LR 1.6", "home": ["lr", "fund"], "old": "Q39"}, {"id": "u62", "title": "What limit states are typically considered in LRFR — and why can Service II govern an older steel girder?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q42 and TS-Q5. Also asked as:<strong>\n<\/strong>“<strong>Why can Service II govern an older steel-girder\nrating?<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — limit states<\/strong><\/p>\n<ul>\n<li><p>Strength limit states address member strength and\nstability.<\/p><\/li>\n<li><p>Service limit states address behaviors such as permanent\ndeformation of steel (Service II) or prestressed-concrete cracking\n(Service III), as applicable.<\/p><\/li>\n<li><p>Fatigue evaluates fatigue-prone details and remaining life where\nrequired.<\/p><\/li>\n<li><p>The required checks depend on material, component, vehicle\ncategory, rating level, and owner policy. CTDOT’s manual requires\noptional checks identified by the governing evaluation provisions to be\nperformed.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — Service II on older steel<\/strong><\/p>\n<ul>\n<li><p>Service II can govern when service-level flange stress or\npermanent-deformation criteria become more restrictive than factored\nstrength, particularly for older composite girders with significant dead\nload or limited section properties.<\/p><\/li>\n<li><p>Confirm actual composite behavior and negative-moment\nassumptions.<\/p><\/li>\n<li><p>Check flange stress, yielding, buckling, deterioration, and deck\nreinforcement.<\/p><\/li>\n<li><p>Report the governing result, but explain that a service\ndeficiency has different implications from a strength\ndeficiency.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> Would you recommend posting based\nonly on a Service II result? (Report it and explain it; posting is\ndriven by verified strength results and is CTDOT’s decision — see\n<a class=\"xref\" href=\"#lr/legal/u72\" title=\"Q61 · What rating result triggers posting, and how does a posting evaluation differ from simply reporting a rating factor below 1.0?\">LR 2.4<\/a>.)<\/p>\n", "num": "LR 1.7", "home": ["lr", "fund"], "old": "Q42"}, {"id": "u63", "title": "How do you select the controlling rating result?", "kind": "qa", "html": "\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Evaluate all required vehicles, limit states, members, locations,\nand failure mechanisms.<\/p><\/li>\n<li><p>Identify the lowest applicable rating factor for the reporting\ncategory.<\/p><\/li>\n<li><p>Confirm that the reported control is not a software artifact,\nmodeling error, or inappropriate assumption.<\/p><\/li>\n<li><p>Report the controlling vehicle, member, span, location, limit\nstate, and failure mechanism clearly.<\/p><\/li>\n<li><p>Also identify other low results that may be important to posting,\nrepair, or future deterioration.<\/p><\/li>\n<\/ul>\n", "num": "LR 1.8", "home": ["lr", "fund"], "old": "Q46"}, {"id": "u64", "title": "What is the role of live-load distribution in rating?", "kind": "qa", "html": "\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Live-load distribution determines how vehicle effects are shared\namong structural components.<\/p><\/li>\n<li><p>Simplified distribution factors may be appropriate for regular\nstructures within their range of applicability.<\/p><\/li>\n<li><p>Skew, curvature, unusual spacing, diaphragms, deck behavior,\nstaged construction, deterioration, or complex framing may require\nrefined analysis.<\/p><\/li>\n<li><p>Any simplified or refined method should be checked for\nconsistency with the expected load path.<\/p><\/li>\n<\/ul>\n", "num": "LR 1.9", "home": ["lr", "fund"], "old": "Q47"}, {"id": "u65", "title": "How do multiple-presence factors affect a rating?", "kind": "qa", "html": "\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Multiple-presence treatment accounts for the probability and\neffect of simultaneous loaded lanes.<\/p><\/li>\n<li><p>The treatment depends on the load model and the applicable\ndesign, legal, or permit evaluation provisions.<\/p><\/li>\n<li><p>When approximate distribution equations already include\nmultiple-presence assumptions, avoid applying the effect twice.<\/p><\/li>\n<li><p>For permit evaluations, follow the specific MBE and owner\nprovisions for traffic conditions and lane loading.<\/p><\/li>\n<\/ul>\n", "num": "LR 1.10", "home": ["lr", "fund"], "old": "Q48"}, {"id": "u66", "title": "How is dynamic load allowance treated in a rating?", "kind": "qa", "html": "\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Dynamic load allowance accounts for the additional effect\nassociated with vehicle-bridge interaction compared with a static\nvehicle.<\/p><\/li>\n<li><p>Apply it to the load components and structure types required by\nthe governing criteria.<\/p><\/li>\n<li><p>Do not reduce it based on observed riding-surface condition\nunless the governing owner provisions expressly allow that\ntreatment.<\/p><\/li>\n<li><p>Buried structures may use different treatment based on depth of\nfill and applicable provisions.<\/p><\/li>\n<\/ul>\n", "num": "LR 1.11", "home": ["lr", "fund"], "old": "Q49"}, {"id": "u67", "title": "What is the significance of ADTT, and how do you determine the appropriate live-load factor?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q50 and Q51. Also asked as:<strong>\n<\/strong>“<strong>How do you determine the appropriate live-load\nfactor?<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — ADTT<\/strong><\/p>\n<ul>\n<li><p>Average Daily Truck Traffic affects live-load factors and fatigue\nevaluation under the applicable provisions.<\/p><\/li>\n<li><p>Use the owner-specified traffic source and directional/lane\ntreatment; confirm whether the available value is total, directional, or\nlane-specific before using it. CTDOT uses one-directional ADTT = 55% of\nbidirectional unless site data exist, with growth of 0.75% (urban) or\n1.50% (rural).<\/p><\/li>\n<li><p>Document the source, year, truck percentage, directional\nassumption, and any growth treatment required by owner policy.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — live-load factor<\/strong><\/p>\n<ul>\n<li><p>Identify the rating category, vehicle, limit state, traffic\ncondition, and ADTT inputs required by the governing\nprovisions.<\/p><\/li>\n<li><p>Use the current MBE and owner-specific modifications rather than\nsoftware defaults. CTDOT does not allow site-specific live-load\nfactors.<\/p><\/li>\n<li><p>For permits, confirm whether the vehicle is routine, mixed with\ntraffic, or escorted, because the operating condition changes the\nevaluation.<\/p><\/li>\n<li><p>Check that the selected factor and multiple-presence treatment\nare consistent with the model and distribution method.<\/p><\/li>\n<\/ul>\n", "num": "LR 1.12", "home": ["lr", "fund"], "old": "Q50"}, {"id": "u68", "title": "How do you address fatigue in a steel-bridge load rating, and how is fatigue life evaluated and communicated?", "kind": "qa", "html": "\n<p><em>Merged in v4 from Q56 and TS-Q12. Also asked as:<strong>\n<\/strong>“<strong>How is fatigue life evaluated and\ncommunicated?<\/strong>”<\/em><\/p>\n<p><strong>Key points to hit — evaluation<\/strong><\/p>\n<ul>\n<li><p>Identify fatigue-prone details, detail categories, stress ranges,\ntraffic inputs, and the applicable evaluation level.<\/p><\/li>\n<li><p>Use the appropriate fatigue truck and load-distribution\nprovisions, with effective stress range, cycles, ADTT, and\ngrowth.<\/p><\/li>\n<li><p>Check infinite-life criteria first where required (CTDOT:\nCategory C and lower), then evaluate remaining life if the criterion is\nnot satisfied; distinguish mean, evaluation, and minimum life where\napplicable.<\/p><\/li>\n<li><p>Verify the actual detail, weld termination, prior repair,\npotential stress concentration, and distortion-induced\nbehavior.<\/p><\/li>\n<li><p>Integrate known cracking, repairs, and inspection\nreliability.<\/p><\/li>\n<\/ul>\n<p><strong>Key points to hit — communication<\/strong><\/p>\n<ul>\n<li><p>Communicate fatigue as a remaining-life and inspection/repair\nissue, not automatically as an immediate posting issue.<\/p><\/li>\n<li><p>Recommend inspection, monitoring, repair, or replacement actions\ntied to the result, and coordinate with inspection findings.<\/p><\/li>\n<\/ul>\n<p><strong>Likely follow-up:<\/strong> What would make fatigue the\ngoverning remaining-life mechanism? (Low-category details such as\ncover-plate ends or distortion-prone connections on a high-ADTT route,\nespecially with prior cracking.)<\/p>\n", "num": "LR 5.10", "home": ["lr", "steel"], "old": "Q56"}, {"id": "u69", "title": "How do you evaluate a prestressed-concrete member that is controlled by Service III?", "kind": "qa", "html": "\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Confirm section properties, prestress force, losses, composite\nbehavior, material strengths, environmental exposure, and tensile-stress\nlimits.<\/p><\/li>\n<li><p>Check whether assumptions about strand type, release strength,\nloss method, and deck placement age are supported.<\/p><\/li>\n<li><p>Distinguish a Service III cracking result from a strength\ndeficiency.<\/p><\/li>\n<li><p>Explain the implication clearly so the owner does not equate\nevery rating factor below 1.0 with the same posting\nconsequence.<\/p><\/li>\n<li><p>Follow CTDOT reporting treatment for Service III\nresults.<\/p><\/li>\n<\/ul>\n", "num": "LR 6.4", "home": ["lr", "concrete"], "old": "Q57"}, {"id": "u70", "title": "How do you handle shear ratings for concrete members?", "kind": "qa", "html": "\n<p><strong>Key points to hit<\/strong><\/p>\n<ul>\n<li><p>Perform the required shear checks for applicable rating levels\nand vehicles.<\/p><\/li>\n<li><p>Use the permitted simplified procedure when its applicability\nrequirements are met.<\/p><\/li>\n<li><p>If simplified shear gives a low result, evaluate whether the\ngoverning provisions require or permit the general procedure.<\/p><\/li>\n<li><p>Confirm reinforcement details, effective depth, material\nproperties, deterioration, and longitudinal reinforcement\nrequirements.<\/p><\/li>\n<li><p>Document assumptions where plans or reinforcement information are\nincomplete.<\/p><\/li>\n<\/ul>\n", "num": "LR 6.5", "home": ["lr", "concrete"], "old": "Q58"}, {"id": "u71", "title": "Beam ends with section loss are driving the rating. How do you evaluate them?", "kind": "qa", "html":
