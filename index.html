and foundation stay fixed;\nbearings take translation; only the new backwall rides with the deck\ninto the fill.<\/li>\n<li><strong>Semi-integral checks.<\/strong> Bearing movement capacity,\nseat room for travel, backwall-to-deck connection, approach slab,\ndrainage.<\/li>\n<li><strong>Not fully decoupled (Mario’s point).<\/strong> Existing beams\noften don’t reach past the stem face, so the backwall is extended and\nheavier: added dead load, possible eccentricity on the stem, and some\npassive pressure path. Usually checkable, not a showstopper.<\/li>\n<li><strong>Interior piers.<\/strong> Link slabs over simple-span\ngirders; confirm bearings allow the rotation and translation.<\/li>\n<\/ul>\n", "num": "RH 3.2", "home": ["rh", "joints"], "old": "§27.13"}, {"id": "u184", "title": "Coating removal, containment and recoating", "kind": "tp", "html": "\n<p>The contractor designs the containment; the designer sets the limits\nit must respect.<\/p>\n<ul>\n<li><strong>Baseline.<\/strong> Full encapsulation, negative-air\ncontainment, full blast clean, three-coat system; environmental cost set\nas a clear owner expectation.<\/li>\n<li><strong>Blast cleaning reveals hidden section loss.<\/strong> Include\nrepair details, pay items and a field quantification mechanism, or every\nfinding becomes a change order.<\/li>\n<li><strong>Wind on containment.<\/strong> Rarely a global capacity issue\non a multi-girder bridge. Sometimes local or stability: fascia girders,\nbracing, out-of-plumb rockers. Attachment to thin or corroded flanges is\nwhere damage happens.<\/li>\n<li><strong>Contract documents should give:<\/strong> max load per\nattachment point; permitted locations (stiffeners, bearing points, not\nmid-panel web); no welding or drilling without approval; excluded\ndeteriorated areas; sealed containment design submitted with wind\ncriteria; load paths through deteriorated members checked against\ncurrent condition.<\/li>\n<li><strong>Wind criteria source.<\/strong> AASHTO <em>Guide Design\nSpecifications for Bridge Temporary Works<\/em> and ASCE 37 (reduced\nconstruction-period wind). SSPC classifies containment leak tightness,\nnot structural load.<\/li>\n<li><strong>Reduced wind speed ⇒ mandatory removal.<\/strong> Pair it\nwith a required tarp-removal procedure, forecast wind trigger and lead\ntime (“required,” not “allowed”).<\/li>\n<li><strong>Cold weather.<\/strong> Low-temperature systems\n(moisture-cured urethanes) cure where zinc/epoxy/urethane stalls;\ndeparture from CTDOT’s standard system needs department concurrence.\nHumidity-dependent cure inside dehumidified containment. Get the\napproved alternate up front.<\/li>\n<\/ul>\n", "num": "RH 4.1", "home": ["rh", "steel"], "old": "§27.14"}, {"id": "u185", "title": "Bridge widening", "kind": "tp", "html": "\n<p>The hard part is tying a new, still-moving structure to an old one\nthat has finished moving.<\/p>\n<ul>\n<li><strong>Superstructure.<\/strong> The old exterior girder becomes\ninterior: higher distribution factor, loses the overhang/lever-rule\nadvantage. Older ASD/LFD bridges may have lighter exteriors; verify from\nplans. Often the controlling check.<\/li>\n<li><strong>Distribution factors vs. the capacity floor.<\/strong> DFs =\nanalysis of what the girder actually sees. The LRFD\nexterior-not-weaker-than-interior rule (2.5.2.7.1) = design floor. Both\nneeded.<\/li>\n<li><strong>Time-dependent effects.<\/strong> Old concrete done\ncreeping/shrinking; new deck isn’t → cracking along the closure.<\/li>\n<li><strong>Differential settlement.<\/strong> Existing foundations have\nsettled; new ones will.<\/li>\n<li><strong>Substructure.<\/strong> Extending pier caps/abutments, new\nfoundations next to old, connection detail, work under traffic.<\/li>\n<li><strong>Staged construction<\/strong> alongside the live bridge.<\/li>\n<li><strong>Alternative.<\/strong> Separate with a longitudinal joint:\nindependent movement, no load sharing, but a maintenance liability\ndripping on fascia girders and bearings. Tie in if foundations are firm\nand existing capacity allows.<\/li>\n<\/ul>\n", "num": "RH 3.3", "home": ["rh", "joints"], "old": "§27.15"}, {"id": "u186", "title": "Substructure repair: pier caps", "kind": "tp", "html": "\n<p>Diagnose the cause by crack location before choosing a repair.<\/p>\n<ul>\n<li><strong>Read the location.<\/strong> Vertical cracking on a\ncantilever = flexural tension face (structural, or top-steel corrosion).\nSpalling at bearing seats = leaking joint plus local bearing\nstress.<\/li>\n<li><strong>Strut-and-tie.<\/strong> Older caps designed sectionally can\nbe light on tie steel; refined STM may explain overstress cracking.<\/li>\n<li><strong>Crack widths and activity.<\/strong> Fine, stable,\nnon-corroding cracks may need nothing; wide, growing or rust-stained\nchanges everything.<\/li>\n<li><strong>Monitoring.<\/strong> Wired gauges capture live load and\nthermal response (working crack → possible tie deficiency). Periodic\ncomparator readings capture long-term growth (corrosion, settlement).\nStart with dated comparator readings; escalate if moving. Monitoring\nshows behavior, not capacity; analysis still needed.<\/li>\n<li><strong>Repair.<\/strong> Fix the joint; remove unsound concrete;\nsupplement steel; added cover/thickening adds load to check.<\/li>\n<\/ul>\n", "num": "RH 5.1", "home": ["rh", "sub"], "old": "§27.16"}, {"id": "u187", "title": "Bearing replacement", "kind": "tp", "html": "\n<p>Elastomeric bearings transfer shear force into the substructure that\nrockers never did.<\/p>\n<ul>\n<li><strong>Design.<\/strong> Elastomer shear stiffness puts thermal\nforce into the substructure; check it.<\/li>\n<li><strong>Height.<\/strong> Elastomeric assemblies are thinner than\nrockers; add build-up plates so there’s no differential across the\nwidth.<\/li>\n<li><strong>Jacking under traffic.<\/strong> Jacks carry dead plus live\nload; design jacking corbels/brackets; check whether the substructure\ncan take eccentric jacking load; limit jack lift.<\/li>\n<li><strong>Girder at the jack.<\/strong> Web crippling and local\nyielding, especially with beam-end corrosion; add jacking stiffeners if\nneeded.<\/li>\n<li><strong>Before removal.<\/strong> Record rocker tilt; it shows the\nbridge’s real thermal position.<\/li>\n<\/ul>\n", "num": "RH 5.2", "home": ["rh", "sub"], "old": "§27.17"}, {"id": "u188", "title": "Sign and ancillary structures", "kind": "tp", "html": "\n<p>Bridge fatigue is truck-load driven; sign structure fatigue is wind\ndriven. Lead with that.<\/p>\n<ul>\n<li><strong>Governing spec.<\/strong> AASHTO LRFD Specifications for\nStructural Supports for Highway Signs, Luminaires, and Traffic Signals:\nits own fatigue categories and importance factors.<\/li>\n<li><strong>Fatigue loads.<\/strong> Natural wind gusts, truck-induced\ngusts, galloping, vortex shedding. Structures are flexible, lightly\ndamped, see millions of cycles.<\/li>\n<li><strong>Cracked cantilever post-to-base-plate weld.<\/strong>\nNotoriously poor detail (older fillet welds worst). It’s fatigue, so a\nlike-for-like weld repair buys limited time; change the detail or\nstiffness, or replace. Notify, restrict/close lanes below as needed, NDE\n(MT/PT) to define the crack.<\/li>\n<li><strong>Full-span VMS truss.<\/strong> Wind and area drive design;\nreduced dead-load factor with wind can govern (uplift/reversal). VMS\ndepth adds lift and torsion; sign eccentricity below the truss adds\ntorsion. Catwalk live load, access door, extra weight and area, all\neccentric.<\/li>\n<li><strong>Importance.<\/strong> A VMS over four lanes typically gets\nthe highest fatigue importance category (verify the category name).<\/li>\n<\/ul>\n", "num": "DE 6.1", "home": ["de", "signs"], "old": "§27.18"}, {"id": "u189", "title": "Culverts", "kind": "tp", "html": "\n<p>Scour → leg settlement → negative moment overstress at the corner is\nthe causal chain to name.<\/p>\n<ul>\n<li><strong>Three-sided frame.<\/strong> Positive moment at midspan,\nnegative at the top slab/leg corners.<\/li>\n<li><strong>Verify and quantify settlement,<\/strong> analyze with\nsettlement-induced load, then stabilize. Jacking a leg means excavating\nfill; avoid if possible.<\/li>\n<li><strong>Fix the scour regardless<\/strong> of what the cracking turns\nout to be.<\/li>\n<li><strong>Invert slab vs. natural bottom.<\/strong> An invert closes\nthe frame into a box and stiffens it, but CT DEEP and the Army Corps\npush natural substrate and aquatic organism passage. Compromise: buried\ninvert with streambed material placed over it (costs opening and\nexcavation). Or stay three-sided with countermeasures, underpinning or\ndeeper footings.<\/li>\n<li><strong>Unknowns.<\/strong> Precast units with unverifiable bar\nsizes: plans or scanning. Corner cracks leaking = corrosion of the\nnegative moment steel.<\/li>\n<li><strong>Name permitting<\/strong> as a driver.<\/li>\n<\/ul>\n", "num": "LR 8.1", "home": ["lr", "other"], "old": "§27.19"}, {"id": "u190", "title": "Retaining walls (MSE)", "kind": "tp", "html": "\n<p>Bulging plus rust staining at joints means corroding reinforcement or\nconnections, and MSE walls don’t fail gracefully.<\/p>\n<ul>\n<li><strong>Root cause is usually drainage.<\/strong> Salt-laden water\nbehind the wall through joints or a failed drain.<\/li>\n<li><strong>Investigation is hard.<\/strong> Reinforcement is buried;\nexhume sample straps for section loss; check the original corrosion\nallowance and galvanizing thickness.<\/li>\n<li><strong>Immediate action.<\/strong> Survey targets on panels with a\nbaseline within days; movement decides it.<\/li>\n<li><strong>Lane shift is structural, not just caution.<\/strong> Moving\ntraffic off the top removes surcharge from the wall and protects the\npublic. Case by case, but don’t hesitate if movement is real.<\/li>\n<\/ul>\n", "num": "RH 6.1", "home": ["rh", "scour"], "old": "§27.20"}, {"id": "u191", "title": "Construction administration (support role)", "kind": "tp", "html": "\n<p>Mario supports on CA questions; be decisive on the interim step and\ndocument the same day.<\/p>\n<ul>\n<li><strong>RFI: shoring conflict with 48-hr demand.<\/strong> Stop\nshoring work in that area; split what can be answered fast from what\nneeds analysis. The contractor’s alternate is a <strong>temporary works\ndesign<\/strong> with sealed calcs; you review for conformance, you don’t\ndesign it. The <strong>substructure allowable-reaction envelope<\/strong>\nis the designer’s to give and often deliverable inside 48 hr. Document\ndelay position in writing the same day; flag out-of-scope with\nCTDOT.<\/li>\n<li><strong>Deck pour: loads past max time, unauthorized water.<\/strong>\nDon’t let it finish as if nothing happened. Flag to contractor QC in\nreal time; water changes w/c → permeability → service life, which\ncylinders can’t settle. Cast extra cylinders from affected loads and map\nwhich loads went where. Ticket discrepancy = contractor QC failure →\ndaily report and CTDOT same day.<\/li>\n<\/ul>\n", "num": "CN 1.1", "home": ["con", "submittals"], "old": "§27.21"}, {"id": "u192", "title": "Seismic design and evaluation in Connecticut", "kind": "tp", "html": "\n<p>Low seismicity is not zero seismicity; the category is computed from\nS_D1, never assumed from the state.<\/p>\n<ul>\n<li><strong>CT context.<\/strong> Most sites SDC A, occasionally B on\npoor soils. Soft soil amplifies and can push a site up a category.<\/li>\n<li><strong>SDC A still requires two things.<\/strong> Connection forces\n(acceleration coefficient times tributary permanent load), and minimum\nsupport length N — a geometry formula driven by span length, pier height\nand skew. Existing bridges frequently fail the seat length check. No\ncapacity design or ductility detailing in A.<\/li>\n<li><strong>Seven-step process.<\/strong> (1) Site hazard — PGA, S_S, S_1\nfrom AASHTO maps or USGS, 7% in 75 years, roughly a 1,000-year return.\n(2) Site class A–F from shear wave velocity or SPT in the upper 100 ft;\nclass F needs site-specific study. (3) Site factors give S_DS and S_D1.\n(4) SDC from S_D1 — roughly below 0.15 is A, to 0.3 is B, to 0.5 is C,\nabove that D. (5) Fundamental period from stiffness and mass; read the\ndesign spectrum at that period. (6) Analysis method by category and\nregularity: single span exempt; A is connection forces and seat length\nonly; B and C uniform load or single-mode if regular, multimode if\nirregular; D adds displacement-based checks. (7) Capacity and\ndisplacement checks.<\/li>\n<li><strong>C_s<\/strong> is the dimensionless elastic seismic response\ncoefficient. Base shear equals C_s times seismic weight; divide by R for\nsubstructure design forces where inelastic behavior is allowed.<\/li>\n<li><strong>Force vs. displacement.<\/strong> Force is the story in A and\nB. In B and above displacement demand matters as much as force; above\nthat, displacement dominates.<\/li>\n<li><strong>“Single span” means no intermediate support<\/strong>, not\n“not continuous.” One pier makes it multi-span and the exemption is gone\nregardless of continuity. Support length still applies even to\nsingle-span bridges.<\/li>\n<li><strong>Continuity does not reduce seismic load — it redistributes\nit.<\/strong> Total lateral force is set by mass and spectral\nacceleration. Continuity couples the substructure units into one system\nwith a single displacement; they share force by relative stiffness, so a\nstiff squat pier or abutment can attract disproportionate force. Simple\nspans aren’t “even” either — distribution depends on bearings, friction\nand frozen rockers. Continuity makes distribution knowable, not\nsmaller.<\/li>\n<li><strong>Continuity is still usually right<\/strong> — joint\nelimination is the biggest durability win in CT. Seismic becomes a\ncheck, not a claimed benefit.<\/li>\n<li><strong>Isolation bearings control where force goes<\/strong>, not\nonly how much.<\/li>\n<li><strong>Mass check on superstructure replacement.<\/strong> Heavier\nor lighter than the old superstructure changes demand directly; steel to\nconcrete increases it on unchanged substructure.<\/li>\n<li><strong>Seat width options.<\/strong> Widen with a bolster or\npedestal, add restrainers or shear keys, or reduce demand with isolation\nbearings. The choice depends on whether the substructure can take the\nrestrained force.<\/li>\n<li><strong>Before committing to substructure reuse:<\/strong> foundation\nrecords — pile type, capacity, embedment, as-builts. Missing borings\nmeans recommending subsurface investigation before the reuse premise\ngoes into a fee proposal. This is the point that earns the job.<\/li>\n<\/ul>\n", "num": "DE 4.1", "home": ["de", "seismic"], "old": "§27.22"}, {"id": "u193", "title": "Deck overlays and rehabilitation materials", "kind": "tp", "html": "\n<p>Overlays are chloride barriers, not remediation. Sealing over active\ncorrosion produces a surprise in year eight.<\/p>\n<ul>\n<li><strong>Test before committing.<\/strong> Compressive strength is\nrarely the issue. From cores you want chloride profiles by depth and\npetrographic examination (paste soundness, ASR, freeze-thaw).<\/li>\n<li><strong>The two surveys answer different questions.<\/strong>\nDelamination survey (sounding or IR) shows damage already done.\nHalf-cell potential shows active corrosion where nothing has spalled —\nfuture damage. The second number drives a 20-year decision: 12%\ndelaminated with quiet potentials is a repair candidate; 12% with\nwidespread active corrosion means the next 12% is already coming.<\/li>\n<li><strong>LMC and PPC are LOW permeability.<\/strong> Do not say highly\npermeable — it inverts the argument.<\/li>\n<li><strong>PPC vs. LMC on a busy route.<\/strong> PPC cures in hours\n(overnight lane opening) and bonds to a shot-blasted surface with\nprimer. LMC needs wet cure and a longer closure. At 18,000–22,000 ADT\nthat difference often decides it.<\/li>\n<li><strong>Thickness governs material choice, not hydrodemolition\nitself.<\/strong> Removal to just below the top mat (about 1.5–2.5 in.)\nmakes LMC or PPC entirely appropriate; PPC typical placement is 3/4 in.\nto about 2 in., and at 3 in. you are outside its comfortable range on\nheat and shrinkage. Deeper removal (3–4 in. and more) is rebuilding deck\nsection, so HPC or microsilica concrete.<\/li>\n<li><strong>Thin deck during construction is a construction-stage check,\nnot a permanent one.<\/strong> Removing 3 in. of an 8 in. deck leaves 5\nin. carrying traffic and construction loads during staging; the section\nis restored afterward.<\/li>\n<li><strong>Middle option, often the right answer at 12%\ndamage.<\/strong> Partial-depth patches with HPC only where contaminated,\nthen a thin polymer overlay across the whole deck as the barrier. Two\nmaterials each doing what it is good at, without removing 3 in.\neverywhere.<\/li>\n<li><strong>Mill then hydrodemolition.<\/strong> Milling accelerates\nremoval; hydrodemolition preserves, cleans and preps the reinforcing.\nSaying this shows site experience.<\/li>\n<li><strong>Incipient anode problem.<\/strong> Galvanic anodes at patch\nperimeters — the repaired area becomes cathodic and drives corrosion in\nadjacent chloride-contaminated concrete left in place. Mechanism-level\npoint most people cannot articulate.<\/li>\n<li><strong>Underside efflorescence near joints means the leak path is\nthe joints.<\/strong> Joint replacement belongs in the same contract or\nyou have rebuilt the surface while water keeps entering at the\nends.<\/li>\n<li><strong>Weight check.<\/strong> Deep removal and replacement changes\ndeck dead load; confirm on an older girder, especially if the overlay\nadds thickness above the original profile.<\/li>\n<li><strong>Always run LCCA against deck replacement.<\/strong> Twenty\nyears from an overlay on a 50-year-old deck may cost more per year than\nreplacing it once traffic impacts are counted.<\/li>\n<li><strong>Pell Bridge experience.<\/strong> HDR ran a full\ninvestigation and study on the proposed deck replacement; it ended with\nmill plus hydrodemolition and HPC replacement, with embedded cathodic\nprotection anodes. Pre-empt the follow-up of why HPC there and PPC here:\ndepth and structural role — Pell removal was deep enough to be\nreconstruction, not surfacing.<\/li>\n<\/ul>\n", "num": "RH 2.1", "home": ["rh", "deck"], "old": "§27.23"}, {"id": "u194", "title": "Steel beam-end repair", "kind": "tp", "html": "\n<p>Shear is not the only limit state; name the whole family and repair\nwhichever governs.<\/p>\n<ul>\n<li><strong>Limit states.<\/strong> Web crippling, web local yielding,\nbearing stiffener capacity, shear. Re-rate using current field\nmeasurements and the CTDOT CT-BeamEnd spreadsheet with BrR output.<\/li>\n<li><strong>Fix the joint first.<\/strong> Otherwise the rating only gets\nworse, and corrosion at beam ends is non-linear.<\/li>\n<li><strong>Connection detailing.<\/strong> Bolted plating is the default\n— welding to a corroded web of unknown weldability and toughness in\n1960s steel is a real concern. Bolting means checking net section\nthrough holes in a web that may already have lost 40%, and confirming\nedge distances in remaining sound material. Sometimes the sound steel is\nnot there, which forces a larger repair than planned.<\/li>\n<li><strong>Load path during repair.<\/strong> Replacing a bearing\nstiffener means unloading the bearing: jacking corbels or brackets,\nsubstructure checked for eccentric load, and the girder checked for web\ncrippling at the jack point — ironic given the web is why you are\nthere.<\/li>\n<li><strong>Check whether the bearings still function.<\/strong> A frozen\nbearing at a leaking joint is common and changes the thermal force story\nonce everything is restored.<\/li>\n<li><strong>Restore original capacity, or only the capacity\nneeded<\/strong> to avoid posting? Often a smaller repair.<\/li>\n<li><strong>Verify as-built material properties.<\/strong> Likely A36 in\nthat era, but the rating hinges on it.<\/li>\n<li><strong>Blast cleaning exposes section loss the inspector could not\nsee<\/strong> — hidden by paint, pack rust, back rust. An allowance alone\nis not enough. You need the mechanism: generic repair details applicable\nanywhere rather than only location-specific ones, unit price pay items\n(plating by pound or square foot), a requirement that the contractor\nnotify and the engineer inspect after blast cleaning and before repair,\nand a defined engineer turnaround so it does not become a delay claim on\nthe critical path.<\/li>\n<\/ul>\n", "num": "LR 5.3", "home": ["lr", "steel"], "old": "§27.24"}, {"id": "u195", "title": "Scour, Item 113 and Plans of Action", "kind": "tp", "html": "\n<p>When a question says something is missing from the file, that absence\nis usually the answer they are fishing for.<\/p>\n<ul>\n<li><strong>Item 113 code of 3 means scour critical<\/strong> — the\nbridge is vulnerable to the design scour event and field review\nindicates action is required. It does not mean the footing is currently\nundermined to failure. Exposed footings on a 1950s spread-footing bridge\nmay have been exposed for decades and stable. Do not open with immediate\nclosure; save closure for what you find.<\/li>\n<li><strong>The missing POA is the deliverable.<\/strong> A scour\ncritical bridge is required to have a Plan of Action under the NBIS. It\ncovers monitoring protocol, flood-event inspection triggers, and closure\ncriteria — at what stage or discharge the bridge closes. You are writing\ndown in advance what the district otherwise has to improvise during a\nstorm.<\/li>\n<li><strong>A scour evaluation, not just a site visit.<\/strong>\nHydraulic analysis for contraction scour and local scour at the piers,\ncomputed for the 100-year and the 500-year check flood, compared against\nfooting elevation and founding material. The site visit gives current\ncondition; the analysis gives the design event.<\/li>\n<li><strong>Spread footing vs. pile supported changes\neverything<\/strong> — confirm from plans.<\/li>\n<li><strong>Countermeasures.<\/strong> Riprap and articulated block are\nthe common first answer. Underpinning and grouting where there is actual\nundermining (riprap cannot fill a void under a footing). Anything placed\nin the river needs permitting, which drives schedule more than the\nengineering does.<\/li>\n<\/ul>\n", "num": "RH 6.2", "home": ["rh", "scour"], "old": "§27.25"}, {"id": "u196", "title": "Historic concrete rigid frames", "kind": "tp", "html": "\n<p>The historic constraint is a process, not an aesthetic\npreference.<\/p>\n<ul>\n<li><strong>Section 106.<\/strong> With federal funding, the State\nHistoric Preservation Office effectively becomes a design reviewer.\nRepair materials and surface finish need to match — formliners or\nexposed aggregate — and shotcrete over the whole face may not be\nallowed. A real schedule driver that belongs in the fee.<\/li>\n<li><strong>Smooth bar vs. deformed.<\/strong> A 1930s frame sits right\non the transition. Smooth bar changes development and bond assumptions\nsubstantially, and exposed bar with section loss may have lost bond as\nwell as area. It also complicates splicing new bar in. If plans do not\nshow bar type, you find out by exposure in the field.<\/li>\n<li><strong>Rate it as a frame.<\/strong> Legs and deck slab act\ntogether; do not rate components independently. Deterioration at the\nlegs near the waterline is remote from the corner, so it is a capacity\nand stability issue more than a frame action issue — but say you are\nmodeling the frame. Confirm whether the old rating used working stress;\nthe method matters as much as the date.<\/li>\n<li><strong>Name the cause.<\/strong> Waterline deterioration is wet-dry\ncycling plus chloride draining from the roadway above. Repair without\nfixing drainage means being back in fifteen years.<\/li>\n<li><strong>Delamination is a spall that has not happened yet.<\/strong>\nContract documents need generic repair details, unit price pay items and\nan allowance, because chipping reveals more than the inspection\nshowed.<\/li>\n<\/ul>\n", "num": "LR 6.2", "home": ["lr", "concrete"], "old": "§27.26"}, {"id": "u197", "title": "Work over active railroads — outages and shielding", "kind": "tp", "html": "\n<p>The outages are for installing and removing the shielding, not for\ndoing the work.<\/p>\n<ul>\n<li><strong>Reframe the outage question.<\/strong> Anything over the\ntracks requires either a track outage or flagging protection. Once the\nshielding is up and inspected by the railroad, you can work above it\nwith the track open. So two outages is plenty if that is all they are\nfor. This reframes the whole staging discussion.<\/li>\n<li><strong>The shielding design is the project.<\/strong> On a through\ngirder the deck sits between the girders, and the shielding must catch\neverything from a full-depth deck demolition, including hydrodemolition\nslurry if used. It is a real structure: load capacity for falling\ndebris, watertight if there is slurry, hung from the existing girders —\nwhich then need checking for the hanging load.<\/li>\n<li><strong>Vertical clearance.<\/strong> About 23 ft is the typical\nAREMA desirable; 22 ft is generous enough to hang shielding without\nencroaching. The constraint to flag instead is horizontal clearance to\nthe girders and whether crash walls or pier protection are\nrequired.<\/li>\n<li><strong>Schedule.<\/strong> Railroad review periods of a month or\nmore, built into the design schedule early. Sealed erection procedures\nand temporary works submitted months ahead.<\/li>\n<li><strong>Cost items usually underestimated.<\/strong> Railroad\ninsurance requirements, flagging costs billed to the project, and the\nrailroad’s own review fees.<\/li>\n<li><strong>Differentiator to state.<\/strong> HDR’s working\nrelationships with New England railroads and named railroad coordination\nstaff on the org chart.<\/li>\n<\/ul>\n", "num": "DE 5.2", "home": ["de", "rail"], "old": "§27.27"}, {"id": "u198", "title": "Culvert replacement and stream simulation", "kind": "tp", "html": "\n<p>Replacement in kind is not permittable on a cold water fishery — say\nthat before the fee is set, not at 90% design.<\/p>\n<ul>\n<li><strong>The governing requirement is stream simulation.<\/strong> An\nopen-bottom or embedded structure with natural streambed continuous\nthrough it, sized so the channel is not constricted. With documented\ntrout habitat, CT DEEP Inland Fisheries will treat a closed-bottom\nreplacement in kind as a non-starter.<\/li>\n<li><strong>The sizing criterion<\/strong> commonly used is spanning at\nleast 1.2 times bankfull width (on the verify list, but it is the number\nthat sets the structure size).<\/li>\n<li><strong>Invert scour is the tell.<\/strong> It means the culvert is\nalready perched or heading there — a fish passage barrier by itself, and\nevidence the velocity is too high. Not merely a repair item.<\/li>\n<li><strong>Overtopping history makes it a hydraulic upgrade\ntoo.<\/strong> Run the analysis against current criteria; if it is a FEMA\nmapped stream, a no-rise certification or map revision is its own\nschedule item.<\/li>\n<li><strong>Structure options.<\/strong> Three-sided frame or precast\narch on spread footings or wall stems, with an embedded natural bottom —\nthat is what makes it permittable. Stay-in-place steel form systems with\nreinforcement built in (e.g. the inQuik-type products) are a good ABC\npoint; land why it matters here — shorter closure on a state route\noffsetting higher structure cost.<\/li>\n<li><strong>Do not forget traffic.<\/strong> Full closure and detour, or\nstaged construction with a temporary bypass. On a state route that is a\nreal cost, and it is often what makes an ABC system worth the\npremium.<\/li>\n<li><strong>Tone with the district.<\/strong> Acknowledge the cost\ndriver, then explain that heading down a replacement-in-kind design\nrisks being halted at permitting.<\/li>\n<\/ul>\n", "num": "DE 7.1", "home": ["de", "culverts"], "old": "§27.28"}, {"id": "u199", "title": "MSE walls — diagnosis and repair", "kind": "tp", "html": "\n<p>The structure is the soil mass, not the face; MSE walls are not\nrepairable the way a concrete wall is.<\/p>\n<ul>\n<li><strong>Three failure modes to triage between.<\/strong> External\nstability (whole block sliding or overturning — wall leans, top moves);\ninternal stability (straps corroding or pulling out — bulging with the\ntop still in line); facing connection failure (local).<\/li>\n<li><strong>Say the inspection limitation out loud<\/strong> — you can\nonly see the face — because it drives the next step: expose straps at a\nfew locations to measure section loss.<\/li>\n<li><strong>Steel strip vs. geosynthetic splits the diagnosis.<\/strong>\nGalvanized steel strip means corrosion, and you can measure it. Geogrid\nmeans corrosion is not the mechanism; you are looking at connection\nfailure or pullout.<\/li>\n<li><strong>Water ties the symptoms together.<\/strong> Discharge through\nthe joints means water is moving through the reinforced zone —\naccelerating strip corrosion and carrying fines out, which is the\ndifferential settlement. The opened joints and the bulging may be one\nproblem, not two.<\/li>\n<li><strong>Survey the face to quantify the bulge and establish a\nbaseline, then monitor.<\/strong> One observation says it is deformed;\nthe second says whether it is moving, and that decides repair versus\nreplacement.<\/li>\n<li><strong>Lane shift is structural, not just caution<\/strong> — it\nremoves surcharge as well as protecting the public.<\/li>\n<li><strong>Repair menu.<\/strong> Soil nails or ground anchors through\nthe face picking up load beyond the reinforced zone; a new structural\nfacing with its own foundation; or rebuilding the section. If the\nreinforcement itself is failing, nothing done at the face fixes what is\nhappening 12 ft back.<\/li>\n<li><strong>Why you cannot patch a 10 ft section.<\/strong> Reinforcement\nruns continuously back about 70% of wall height (roughly 14 ft on a 20\nft wall). Replacing it means excavating the reinforced zone, removing\nthe roadway above, and disturbing fill the adjacent sections rely\non.<\/li>\n<li><strong>At the ends of the excavation:<\/strong> lay back a temporary\nslope (about 1.5:1 in granular backfill, checked for temporary\nstability) — but at the top of a 20 ft wall that extends roughly 30 ft\nlaterally at the surface, cutting through far more reinforcement than\nintended. Or cut vertically with temporary shoring (soldier piles and\nlagging, or a sheeted box), keeping the footprint to the damaged length\nplus working room. On a highway you shore, because the lay-back version\ntakes out multiple lanes.<\/li>\n<li><strong>New reinforcement must tie into the existing<\/strong> —\nsplicing geogrid layer by layer at the matching existing elevations.\nThat connection detail is where these repairs get fussy.<\/li>\n<\/ul>\n", "num": "RH 6.3", "home": ["rh", "scour"], "old": "§27.29"}, {"id": "u200", "title": "Rating limit states by material", "kind": "tp", "html": "\n<p>Strength One is the common backbone; the service-level checks differ\nby material because the failure modes differ.<\/p>\n<ul>\n<li><strong>Strength One vs. Strength Two.<\/strong> Same dead load\nfactors, same general form — the difference is which live load acts and\nits factor. Strength One is the basic combination for the design vehicle\nand legal loads. Strength Two is for owner-specified special vehicles\nand permit vehicles. In design, 1.75 vs. 1.35; the lower factor reflects\na known, controlled vehicle rather than a statistical envelope of the\ntruck population. For rating, permit live load factors come from MBE\nTable 6A.4.5.4.2a-1 and vary by permit type, GVW and ADTT — routine\nhighest, single-trip escorted lowest.<\/li>\n<li><strong>Steel: Strength One plus Service Two.<\/strong> Service Two\ncontrols permanent deformation from yielding and slip of slip-critical\nbolted connections under vehicular load. Limit is 0.95 F_y for composite\nsections, 0.80 F_y non-composite. On older steel bridges, particularly\nnon-composite, Service Two frequently governs the inventory rating — so\nwhen a report shows a low inventory RF, the first diagnostic is which\nlimit state produced it.<\/li>\n<li><strong>Prestressed concrete: Strength One plus Service Three (and\nService One).<\/strong> Service Three is the tension check in the\nprecompressed tensile zone and typically governs inventory. Service One\nis the compression check, rarely governing on an existing bridge.\nStrength One usually governs operating.<\/li>\n<li><strong>The fingerprint.<\/strong> A prestressed girder with strand\nloss or bottom flange cracking shows a dramatic drop in inventory while\noperating stays reasonable — that gap indicates a service-controlled\nrating.<\/li>\n<li><strong>Reinforced concrete.<\/strong> Generally no service-level\nrating check; Strength One only, which is why RC ratings tend to be\nsimpler.<\/li>\n<li><strong>Permit ratings still apply the service checks<\/strong>, with\nthe live load factor at 1.0 rather than the design value — you are not\nasking the permit vehicle to cross ten thousand times.<\/li>\n<li><strong>Why the service checks exist.<\/strong> A member can be safe\nagainst collapse while being damaged by everyday traffic. Yielded steel\ndoes not come back; cracked prestressed concrete lets chlorides at the\nstrands.<\/li>\n<li><strong>Fatigue sits outside the rating levels<\/strong> — a separate\nevaluation under MBE Section 7, not a reported rating factor.<\/li>\n<li><strong>CTDOT fatigue practice (LRM §6.2).<\/strong> Required for\nfatigue-prone details, Category C and below; initial check is infinite\nlife, and if it fails you go to finite life and remaining life per MBE\nSection 7 at Evaluation 1 or 2. Triggers: fatigue-prone details,\nobserved cracking, changed loading history. Refined methods (MBE\n7.2.7.2.2) need Load Rating Supervisor approval first. Verify current\nsection numbering before quoting it.<\/li>\n<\/ul>\n", "num": "LR 1.1", "home": ["lr", "fund"], "old": "§27.30"}, {"id": "u201", "title": "Bridge widening — additions", "kind": "tp", "html": "\n<ul>\n<li><strong>The strongest argument against partial deck replacement is\nthe joint, not the condition.<\/strong> Replacing only the widened\nportion creates a longitudinal construction joint running the full\nlength of the bridge, in or near the wheel path, on a 40-year-old deck.\nIt leaks — chlorides straight down onto the fascia girder and bearings.\nFull-depth replacement gives a continuous deck with no longitudinal\njoint.<\/li>\n<li><strong>Staging and construction-stage load path.<\/strong> Cutting\ninto an existing deck under traffic means the remaining width carries\nlive load through every stage, and the deck overhang created when you\nsaw-cut the fascia may not work.<\/li>\n<li><strong>Independent widening as the presented alternative.<\/strong>\nIts own foundations, tied only at the deck with a closure pour — the\nanswer when existing bearings and substructure cannot take the new load.\nTrade-off is the longitudinal joint you were trying to avoid. Present it\nup front.<\/li>\n<\/ul>\n", "num": "RH 3.4", "home": ["rh", "joints"], "old": "§27.31"}, {"id": "u202", "title": "Bearing replacement — additions", "kind": "tp", "html": "\n<ul>\n<li><strong>A tipped rocker beyond design rotation is a stability issue,\nnot only durability.<\/strong> Rockers fail by rolling off, and one at\nthe end of its travel in a cold snap can go unstable and drop the\ngirder. Frame it as a condition finding to be addressed. (Mario’s\ncounter-framing, also defensible: severity depends on how far beyond\ndesign rotation — a condition finding rather than an emergency.)<\/li>\n<li><strong>A frozen bearing has been doing something to the\nsubstructure.<\/strong> Thermal movement locked for years goes into the\npier as a longitudinal force it was not designed for. Before replacing,\ncheck piers and pier caps for cracking at the top and the bearing seats\nfor damage. Fixing bearings without checking what the frozen ones did is\nthe classic miss.<\/li>\n<li><strong>Seat height governs the replacement type.<\/strong> Rockers\nare tall, elastomeric assemblies are short, so you need a pedestal or\ntaller bolster — and on some older bridges there is not room without\nlowering the girder or rebuilding the seat. That is what decides between\nplain elastomeric, laminated, and pot or disc bearings where rotation\ndemands are high.<\/li>\n<li><strong>Deck off is the cheapest time to replace bearings<\/strong> —\nbut say “substantially reduced load,” not “very little load.” Girder\nself-weight is still there and is not trivial for jacking design.<\/li>\n<\/ul>\n", "num": "RH 5.3", "home": ["rh", "sub"], "old": "§27.32"}, {"id": "u203", "title": "Answer delivery — format and timing", "kind": "tp", "html": "\n<ul>\n<li><strong>The format.<\/strong> 35 minutes for five multi-part\nquestions, shared with a PM who opens for 30–60 seconds and hands off,\nand sometimes another presenter after. That is about seven minutes per\nquestion total, so 3–5 minutes is the right target for Mario’s\nportion.<\/li>\n<li><strong>The real risk is not running long — it is never reaching\npart three.<\/strong> Multi-part questions punish depth on part one.\nObserved twice: the widening answer never reached staging, and the load\nrating answer never reached the permit vehicle.<\/li>\n<li><strong>The fix: name the parts up front.<\/strong> “There are three\nthings driving this — the deck decision, the load path in the existing\ngirders, and how we stage it under traffic” — then work through them.\nThe panel hears completeness immediately, and if you run short on the\nthird they still have the map. It also makes the handoff cleaner, since\nyou can deliberately leave one part for the next speaker.<\/li>\n<li><strong>Reference point.<\/strong> The widening answer ran about 480\nwords, roughly 3.5 minutes of speaking — on target for this format, with\nroom for one more substantive point.<\/li>\n<\/ul>\n", "num": "IS 1.2", "home": ["strat", "delivery"], "old": "§27.33"}, {"id": "u204", "title": "Sign structures — additions from the reframed question", "kind": "tp", "html": "\n<ul>\n<li><strong>Sequencing.<\/strong> Cracking through a weld toe at the base\nof a 50 ft cantilever over an interstate is not a\nwait-for-the-site-visit item. Notify CTDOT immediately, recommend the\ndistrict consider taking it out of service or at minimum removing the\nVMS to drop dead load and wind area, then go look. Notify first, analyze\nsecond.<\/li>\n<li><strong>“Can it stay in service through the winter” is the\ntrap.<\/strong> Winter brings the highest wind events, and an existing\ncrack in propagation has no dependable remaining-life number. You cannot\nanswer yes honestly without instrumentation or fracture mechanics\nassessment, and neither happens fast enough to matter. The right answer\nis that the question cannot be answered safely in the form it is\nasked.<\/li>\n<li><strong>Initiation vs. propagation.<\/strong> The crack has\ninitiated; it is now propagating, and that is not linear. Surviving\nsince the 1990s says nothing about the next 20 years.<\/li>\n<li><strong>Say why the detail is inadequate.<\/strong> A 1998 structure\npredates the 2001 AASHTO sign support spec, so it was almost certainly\ndesigned without galloping and vortex-shedding fatigue provisions at\nall. That is the root cause — and it means every similar structure in\nthat district is a candidate for screening. That last sentence is what\ngets you hired.<\/li>\n<\/ul>\n", "num": "DE 6.2", "home": ["de", "signs"], "old": "§27.34"}, {"id": "u205", "title": "QA of rating packages — the near-1.0 fracture critical case", "kind": "tp", "html": "\n<ul>\n<li><strong>As prime you are responsible for the deliverable.<\/strong>\nYou do not re-perform the sub’s QC, but verifying that it happened and\nwas adequate is squarely yours. Do not say checking their QC is not your\nresponsibility.<\/li>\n<li><strong>RF = 1.02 on a fracture critical tension member is within\nthe noise of modeling assumptions.<\/strong> First question: which\nassumptions are carrying it — distribution factor, section loss\nidealization, composite action, wearing surface. A conservatism you\nwould normally accept becomes decisive here.<\/li>\n<li><strong>Fracture critical changes the consequence, not the\narithmetic.<\/strong> Two-girder system, no redundancy; ask what happens\nif it is wrong. That justifies more review hours than the fee allows,\nwhich is a conversation with CTDOT, not something you absorb.<\/li>\n<li><strong>Actions.<\/strong> Verify against the inspection report\nyourself; confirm a fatigue and fracture evaluation was done, not just\nstrength; check whether the member is in the NSTM inspection program\nwith current findings; raise it to CTDOT proactively rather than\ndelivering it buried in a package of 22.<\/li>\n<li><strong>Put this in the transmittal:<\/strong> a 1.02 today with an\nactive corrosion mechanism is below 1.0 at the next cycle.<\/li>\n<\/ul>\n", "num": "LR 4.2", "home": ["lr", "qa"], "old": "§27.35"}, {"id": "u206", "title": "Load rating a deteriorated beam end with a permit request", "kind": "tp", "html": "\n<p>The permit rating and the beam-end deterioration are usually the same\nproblem, not two problems.<\/p>\n<ul>\n<li><strong>Field measurements first.<\/strong> Inspection reports often\nlack the precision beam-end rating needs. A sensitivity analysis can\ntell you how much precision is required, but ideally you measure it\nyourself.<\/li>\n<li><strong>Method.<\/strong> BrR for force effects and reactions,\nimported into the CTDOT CT-BeamEnd spreadsheet, which handles web\nyielding, web crippling and bearing.<\/li>\n<li><strong>The joint is the actual deliverable.<\/strong> You can rate\nall day, but if the joint still leaks the rating only gets worse, and\nbeam-end corrosion is not linear.<\/li>\n<li><strong>Do not say HL-93 loading is less than a 140 kip\ncrane.<\/strong> HL-93 is a notional load, not a truck — design truck or\ntandem plus 0.64 kip/ft lane load over a continuous bridge produces very\nsubstantial force effects, particularly negative moment. A permit\nvehicle has concentrated axles but no lane load behind it, so which\ngoverns depends on span length and whether you are checking moment or\nshear. A rating supervisor on the panel will catch the loose\nversion.<\/li>\n<li><strong>Permit ratings are checked at Strength Two with lower load\nfactors than legal ratings<\/strong>, because the load is known and\ncontrolled. A bridge failing at legal loads does not automatically fail\nthe permit check.<\/li>\n<li><strong>On a two-span continuous bridge<\/strong>, a heavy permit\nvehicle is often governed by negative moment over the pier — the same\nlocation as the beam-end section loss. Say that connection out\nloud.<\/li>\n<li><strong>Routine annual permit means repeated unescorted crossings\nover the permit year.<\/strong> Beyond strength, ask whether repeated\ncrossings drive a fatigue concern, and whether the section loss will\nprogress across that year. A permit approved in March on January\nmeasurements may not be valid by December if the joint still leaks. That\nis the argument for tying the permit decision to the repair\nschedule.<\/li>\n<li><strong>Real deliverable options:<\/strong> deny, restrict to a\nspecific lane position, or require escort with no other vehicles on the\nspan.<\/li>\n<\/ul>\n", "num": "LR 2.3", "home": ["lr", "legal"], "old": "§27.36"}, {"id": "u207", "title": "Joint elimination on a 1960s–70s continuous steel bridge (practiced 10/1)", "kind": "tp", "html": "\n<p>Scenario: 1972 four-span continuous steel plate girder, deck rated 4,\nleaking joints, section loss at girder ends over the interior piers.\nEliminate joints and go integral, or replace in kind?<\/p>\n<p>What worked: separating the pier joints from the abutment joints and\ntreating them differently; link slabs vs. making the girders continuous\nfor live load with splice plates (seen in New Hampshire — more complex\nbut real); bearings likely due for replacement anyway because of the\nleak; full integral retrofit geometrically unlikely on an existing\nabutment, so semi-integral is the realistic option (reuse the stem,\nsuperstructure spans over, approach slab ties into the integral end\ndiaphragm); and the closing move — if the steel is in poor condition and\nyou are looking at strengthening plus major deck work, superstructure\nreplacement may be more economical than rehab.<\/p>\n<p>Three additions:<\/p>\n<ul>\n<li><strong>Say the hierarchy out loud early.<\/strong> The abutment\njoints are the ones damaging the beam ends. If budget forces a choice,\nthe money goes to the abutments. On a four-span continuous bridge there\nmay be no joints at the piers at all.<\/li>\n<li><strong>A deck rated 4 answers the link slab question.<\/strong> Link\nslabs want a sound deck to tie into. If the deck is coming out anyway,\nyou are not retrofitting continuity, you are designing a new continuous\ndeck — cleaner and cheaper than it sounds.<\/li>\n<li><strong>Name the semi-integral force path, not just “modern\nloading.”<\/strong> The superstructure now pushes directly on the\nbackwall with thermal movement, so you check the existing stem and\nfooting for cyclic passive pressure they were never designed for, plus\napproach slab settlement.<\/li>\n<\/ul>\n", "num": "RH 3.5", "home": ["rh", "joints"], "old": "§27.38"}, {"id": "u208", "title": "Scope growth plus a low rating in the same 48 hours (practiced 10/1)", "kind": "tp", "html": "\n<p>Scenario: 14 bridges in 10 weeks; three weeks in CTDOT adds two and\nasks whether the date holds; simultaneously a rater flags RF below 1.0\non one of the original 14.<\/p>\n<p><strong>Diagnosis:<\/strong> the workload half ran long and read as\ncapability pitch; the rating half is where the panel wanted the time.\nReverse the proportions.<\/p>\n<p><strong>Fix the workload half with a number, not a posture.<\/strong>\nTwo on fourteen is roughly a 15% scope increase with seven weeks left,\nso the question is whether the original fourteen are front-loaded or\nevenly spread. If field work and model builds are done on most of them,\ntwo more is absorbable. If not, propose the two new bridges come in a\nsecond submission two weeks later rather than quietly putting the whole\npackage at risk. Panels want to hear you would renegotiate the date\nrather than miss it. Keep the HDR depth (700+ bridge engineers\nnationally, CHA on the team) to one sentence — support, not the\nanswer.<\/p>\n<p><strong>The notification question — Mario was right and corrected\nClaude.<\/strong> The NBIS clock starts when a rating is finalized and\nsubmitted, not when a preliminary number comes out of a model. Internal\nresults in progress are not a determination. Say it in those terms,\nbecause it makes the early phone call <em>valuable rather than\nobligatory<\/em>: you give CTDOT a heads-up before the clock exists, so\nthey can help decide what the number means instead of receiving a\nfinished product that forces their hand.<\/p>\n<p><strong>Threshold for making that call<\/strong> — judgment driven by\nADT, emergency/detour routes, school bus routes, overall condition. Plus\none more factor worth naming: <strong>whether the low number is driven\nby section loss or by analysis assumptions.<\/strong> 0.95 from a\nconservative distribution factor is a modeling conversation. 0.95 from a\nbeam end that has lost 40% of its web is a bridge actively getting\nworse, and the number will be lower next cycle. Same RF, completely\ndifferent urgency. (The Niantic point in reverse — refine when the\ndeficiency might not be real; refinement buys nothing when the\ndeficiency is corrosion you can see.)<\/p>\n", "num": "PM 3.1", "home": ["pm", "delivery"], "old": "§27.39"}, {"id": "u209", "title": "\"Tell us about a time you disagreed with a client\" (practiced 10/1 — use the Summer Street saw cut)", "kind": "tp", "html": "\n<p>The first attempt had no story in it, only generalities about\ncollaboration and licensure. A panel that asks for <em>a time<\/em> hears\nthe gap. Lead with the incident, no preamble.<\/p>\n<p><strong>The story — Summer Street Bridge, Boston, during\nconstruction.<\/strong> The contractor had significant difficulty saw\ncutting the longitudinal joint separating the two structures. The\ncutting was means and methods; HDR reviewed and agreed with the\ncontractor’s work plan. The saw kept hitting the chamfer at the top\ncorners of the box beams and deflecting, so the resulting gap was\nnarrower than the contract documents required. Massport was watching\nschedule closely and pushed to accept it. HDR held: the joint has to be\nfree draining, and a clogged joint holds moisture against adjacent box\nbeams — a bridge type known for brittle failure modes. We explained why\nthe minimum width was what it was. The owner understood the concern and\nthe future maintenance obligation, and made the call to accept the\nas-built cut. <strong>We documented the concern and the as-built\ncondition in writing (email record), so it is in the record for the next\ninspection cycle.<\/strong><\/p>\n<p>Why it is the right story: <strong>you were overruled and you tell it\nanyway.<\/strong> Far more credible than a disagreement you won.<\/p>\n<p>Three delivery notes:<\/p>\n<ul>\n<li>Open with the stakes in one sentence — a longitudinal joint the full\nlength of the deck that has to drain, and a saw cut that came up\nshort.<\/li>\n<li>Name <em>why<\/em> you held: not “that’s what the plans said,” but\nthat water on the beams undoes the year of work that had just gone into\nmodifying them.<\/li>\n<li><strong>Fix the ending inversion.<\/strong> Do not say the client’s\nfunds and interests are paramount and then say public safety is\nparamount — two paramounts cancel, and the panel remembers the last one.\nUse: “We work for the Department, and in this case it was their call to\nmake. Where I won’t flex is public safety — that’s what the license is\nfor.”<\/li>\n<\/ul>\n<p><strong>Second example to develop:<\/strong> Niantic, framed as an\ninternal disagreement — your own model said post it, and you argued for\nspending more money on analysis before accepting that. Panels count “I\npushed back on my own first answer” as the same virtue.<\/p>\n", "num": "PM 4.1", "home": ["pm", "you"], "old": "§27.40"}, {"id": "u210", "title": "Rating a 1955 riveted built-up bridge with no rating on file (practiced 10/1)", "kind": "tp", "html": "\n<p>Scenario: three-span continuous riveted steel, pack rust at built-up\nmember connections, heavy section loss at stringer ends, no existing\nrating.<\/p>\n<p>Strong material: pack rust and beam-end loss from leaking joints are\nthe New England norm; with no prior rating there is nothing to confirm\nagainst; inspection reports often lack the detail a rating needs — they\ndo not always scrape pack rust, or not in the locations that matter\n(cover plate transitions), and remaining rivet head condition matters\nbecause lost heads mean deducting area from the connected plates.\nRiveted cover plates do not carry the fatigue penalty of welded cover\nplate ends, but fatigue details still need review.<\/p>\n<p><strong>The tooling answer, which is the differentiator:<\/strong>\nAASHTOWare BrR handles the line girder analysis and web section loss for\nshear yield, but <strong>BrR does not do beam-end web crippling, local\nyielding, or bearing checks.<\/strong> Export the force effects from BrR\nand run the beam ends through CTDOT’s rating spreadsheet (CT-BeamEnd).\nSeparately, recommend joint repair in a rehab package — corrosion is not\nlinear, and once initiated it accelerates.<\/p>\n<p>Two additions:<\/p>\n<ul>\n<li><strong>Name the material question.<\/strong> 1955 with no rating on\nfile means no record of what the steel is — A7 or A373 territory. The\nMBE gives default yield values by year of construction when there is no\nmill certificate. That one assumption moves every rating factor on the\nbridge, so say you would check whether CTDOT has plans before\ndefaulting. Caution for the team: 1955 is near the transition, and if\nplans specify A7 the yield is lower than a junior rater’s habit of 36\nksi.<\/li>\n<li><strong>Pack rust is expansion, not just loss.<\/strong> Corrosion\nproduct occupies several times the volume of the steel it came from, so\nit pries the plates apart, can shear rivet heads and distort angles. On\na riveted built-up girder the connections are what make the section act\ntogether — a connection capacity question, not only a member one.<\/li>\n<\/ul>\n", "num": "LR 5.4", "home": ["lr", "steel"], "old": "§27.41"}, {"id": "u211", "title": "Prestressed fascia girder with a longitudinal crack and rust staining (practiced 10/1)", "kind": "tp", "html": "\n<p>Scenario: 1960s two-span continuous PS concrete I-girders over a\nriver; upstream fascia has a ~15 ft longitudinal crack along the bottom\nflange with rust staining near midspan; rest of the bridge looks\nfine.<\/p>\n<p>Good instincts: positive moment region; longitudinal crack with rust\nstaining points to corroding strand; seven-wire strand at high stress\ncorrodes rapidly once exposed; the crack is now the moisture path and\nadjacent strands follow. Then the right scoping move — <strong>run a\nrating with the strand neglected to size the problem.<\/strong> That\ntells you whether it is a structural problem or a durability problem\nbefore anyone spends money.<\/p>\n<p>Two additions:<\/p>\n<ul>\n<li><strong>Ask where the water comes from.<\/strong> Upstream fascia\nover a river, bottom flange — that is not a joint leak. It is splash,\nspray, and possibly deck-edge runoff with deicing chemicals. The\nexposure is ongoing, and the other fascia probably has the beginnings of\nthe same thing. Look before declaring the rest of the bridge fine.<\/li>\n<li><strong>A prestressed girder with corroding strand does not warn you\nthe way steel does.<\/strong> That is the fracture critical conversation\nwithout the terminology. Alongside the rating, recommend monitoring or\nNDE, and ask whether the bridge is on a 24-month cycle or has gone\nlonger.<\/li>\n<\/ul>\n<p><strong>On coring:<\/strong> correct to refuse. A core large enough\nfor meaningful material testing is a bad idea in a heavily reinforced\nprestressed beam. But have the middle ground ready — <strong>chipping a\nsmall area of cover concrete at the crack to visually expose the strand\nand assess section loss.<\/strong> Technically destructive, but local and\nrepairable, and on a girder where everything else is inference, actually\nseeing the strand is what settles it. The sequence: visual and sounding\n→ non-destructive screening → targeted inspection opening only if the\nrating sensitivity says it matters.<\/p>\n", "num": "LR 6.3", "home": ["lr", "concrete"], "old": "§27.42"}, {"id": "u212", "title": "Bascule span slow to seat, locks will not drive home (practiced 10/1)", "kind": "tp", "html": "\n<p>Scenario: operators report the span takes longer to seat and locks\noccasionally miss on the first try; mechanical consultants say the\nmachinery checks out.<\/p>\n<p>The strongest idea, and the hardest one: <strong>forcing the locks\nimposes a displacement-induced load at the tip of the\ncantilever<\/strong> — you are pushing the leaf down or pulling it up\ndepending on which side is off. That is a demand nobody designed for,\nand the locks are telling you something. Driving them home with more\nforce buries the symptom.<\/p>\n<p>Two diagnostics to add, in order:<\/p>\n<ul>\n<li><strong>Counterweight balance.<\/strong> Bascules drift out of\nbalance over decades — new deck, new railings, accumulated paint and\ndebris, water in the counterweight pit. An out-of-balance leaf changes\nthe force the machinery must deliver at the end of travel. A balance\ntest with strain gauges on the operating machinery is the standard\ndiagnostic, and it is a structural question, not a mechanical one.<\/li>\n<li><strong>Support settlement or pier movement.<\/strong> Slight\nsettlement of the rear pier changes the geometry at the lock bar with\nnothing wrong mechanically. Survey the leaf tip in both open and closed\npositions, and determine whether the misalignment is vertical or\nlateral.<\/li>\n<\/ul>\n<p><strong>And say this in the room:<\/strong> “I’d bring our movable\nbridge group in on this.” Naming the boundary of your expertise reads as\nsenior, not weak.<\/p>\n", "num": "RH 7.1", "home": ["rh", "special"], "old": "§27.43"}, {"id": "u213", "title": "Composite or non-composite after a deck replacement (practiced 10/1)", "kind": "tp", "html": "\n<p>Scenario: two-span continuous steel; 1968 plans show non-composite,\nno shear connectors; as-built drawings from a deck replacement 15 years\nago show shear studs installed; no distress.<\/p>\n<p><strong>The deciding check:<\/strong> verify the studs were installed\nfor composite action, not bracing — studs do get added purely to brace\nthe top flange. <strong>Composite studs are spaced by shear flow;\nbracing studs are not.<\/strong> Screen them for strength and fatigue.\nAASHTO does not recognize partial composite action the way building\ncodes do, so if the studs do not qualify, neglect them entirely, treat\nthe flange as braced, and rate non-composite as originally designed.<\/p>\n<p><strong>The staging nuance, and the correction Mario made.<\/strong>\nAt <strong>Strength I<\/strong> you do not track load history — the\nsection reaches its plastic or yield capacity and you compare total\nmoment against composite capacity. Mario was right to push back. Where\nstaging <em>does<\/em> matter is <strong>Service II<\/strong>, a stress\ncheck that frequently governs inventory on older steel: accumulate\nstresses stage by stage — non-composite stresses on the steel section\n(including the new deck weight, since studs do not engage until the\nconcrete cures), superimposed dead load on the long-term composite\nsection at 3n, live load on the short-term section at n. So composite\naction earns capacity for wearing surface, barriers and trucks, and BrR\nhandles it if the stages are built correctly.<\/p>\n", "num": "LR 5.5", "home": ["lr", "steel"], "old": "§27.44"}, {"id": "u214", "title": "Non-redundant two-girder bridge rating 1.15 — \"is that good enough?\" (practiced 10/1)", "kind": "tp", "html": "\n<p><strong>The direct answer, and it should come first:<\/strong> yes,\nand the reason you are comfortable is that <strong>1.15 already carries\nthe non-redundancy — the system factor has reduced capacity before you\ngot to that number.<\/strong> A redundant bridge with the same steel\nwould rate higher. You are not applying the penalty twice.<\/p>\n<p>Then the follow-ons: the girders and, depending on stringer\nconfiguration and span, the floor beams are fracture critical /\nnon-redundant steel tension members; riveted connections generally\nbehave better than welded ones but still need a fatigue look and a check\nfor distortion-induced cracking.<\/p>\n<p><strong>The sentence worth memorizing:<\/strong> <em>the rating\nanswers load, the inspection answers fracture.<\/em> A non-redundant\nmember can have a perfectly good rating factor and still fail from a\ncrack that grew from a detail, because fracture is not a rating limit\nstate. That is why the hands-on regime exists alongside the rating, and\nwhy you would want to know what the last inspection found before signing\noff on “good enough.”<\/p>\n", "num": "LR 3.2", "home": ["lr", "low"], "old": "§27.45"}, {"id": "u215", "title": "Fatigue evaluation — the full sequence (walked through 10/1)", "kind": "tp", "html": "\n<p>No rating factor comes out of this. It is a stress check, then a life\ncalculation. <strong>Three gates, each a chance to stop.<\/strong><\/p>\n<p><strong>Gate 1 — the ADTT screen.<\/strong> The MBE gives limiting\nADTT values by detail category. Below the threshold the detail is\ntreated as having infinite life regardless of stress range, because it\nwill never see enough cycles. Table lookup, no model run. <em>Caution:\nthis is a good argument on a rural bridge; do not lead with it if CTDOT\nasks about a detail on a route with real truck traffic.<\/em><\/p>\n<p><strong>Gate 2 — Fatigue I, the infinite life check.<\/strong> Run the\nfatigue truck, get the moment range at the detail and the stress range\nfrom it, apply the <strong>1.75<\/strong> load factor, and compare\nagainst the constant amplitude fatigue threshold for the detail category\n(C, D, E, E′ each have their own). Below the threshold, infinite life,\ndone.<\/p>\n<p><strong>Gate 3 — Fatigue II, finite life.<\/strong> Load factor drops\nto <strong>0.80<\/strong>, because you are now using an effective stress\nrange rather than the maximum one. Cycles to failure = detail constant A\ndivided by stress range cubed. Convert cycles to years using ADTT in the\nsingle lane, cycles per truck passage (depends on span length and member\ntype), and a traffic growth rate. Output is <strong>years of remaining\nfatigue life<\/strong>, in three flavors with different load factors —\nmean life (50% failure point), evaluation life, and minimum life (the\nconservative one). The Department decides which they want.<\/p>\n<p><strong>Why the factors differ, as a one-liner:<\/strong> Fatigue I\nuses the higher factor because you are asking whether the worst truck\nthat ever crosses can start a crack. Fatigue II uses the lower one\nbecause you are asking what the average truck does over millions of\ncycles.<\/p>\n<p><strong>LRFD vs. MBE ADTT tables.<\/strong> LRFD Table 6.6.1.2.3-2\ngives the 75-year ADTT equivalent to infinite life — a <em>design<\/em>\ntable built on a 75-year design life, therefore more conservative. The\nMBE version is for <em>evaluation<\/em>, where the structure has a known\nage and known traffic, so you use the actual ADTT. Similar in form, but\n<strong>for a rating you cite the MBE.<\/strong><\/p>\n", "num": "LR 5.6", "home": ["lr", "steel"], "old": "§27.46"}, {"id": "u216", "title": "MBE 4th Edition — released late September 2026", "kind": "tp", "html": "\n<p>AASHTO released the <strong>Manual for Bridge Evaluation, 4th\nEdition<\/strong> on approximately <strong>September 25, 2026<\/strong> —\nabout a week before the interview. Confirmed by search.<\/p>\n<p><strong>How to use this in the room.<\/strong> Do not claim to know\nits contents. Say: <em>“I’m aware the 4th Edition just came out, and I’d\nwant to confirm which edition the Department is working to before we set\nup ratings under this task order.”<\/em> Most states run a lag while they\nupdate their own manual and their AASHTOWare configuration, so CTDOT is\nalmost certainly still on the 3rd with 2020 and 2022 interims. Asking\nthe question reads as current and careful; pretending to know what\nchanged is the trap.<\/p>\n", "num": "LR 7.1", "home": ["lr", "ctdot"], "old": "§27.47"}, {"id": "u217", "title": "Codes beyond AASHTO — building codes and the SE (added October 3)", "kind": "tp", "html": "\n<p>Scoring criterion 2c names AASHTO, PCI, ACI, ASTM and AISC. <a class=\"xref\" href=\"#de/codes/u131\" title=\"§18 · Familiarity with Codes, Standards, Manuals, and Specifications\">DE 8.2<\/a> has the reference table; this subsection is the personal and project\nlayer that makes it credible. Lead with real work under those codes,\nthen show you know where they differ from AASHTO.<\/p>\n<ul>\n<li><strong>HDR works under building codes routinely, not\noccasionally.<\/strong> HDR serves facilities clients, and its Building\nEngineering Services group works specifically on non-bridge structures.\nThe transportation structural group also carries many projects governed\nby building codes rather than AASHTO — stations, platforms, canopies,\nsupport buildings.<\/li>\n<li><strong>The CTDOT example is the one to name: the Waterbury Branch\nLine stations.<\/strong> That work is for CTDOT and follows the\nConnecticut State Building Code, with ACI, ASCE, AISC and PCI underneath\nit. It shows the Department already sees HDR working on both sides of\nthe line. <span class=\"verify\">VERIFY which edition of the CT State Building Code and which\nIBC edition it adopts before quoting it.<\/span><\/li>\n<li><strong>Mario just earned his SE.<\/strong> The SE exam is heavily\nweighted to building codes — ASCE 7 loads and lateral design, ACI 318,\nAISC 360, masonry and wood — so the preparation meant studying those\ndocuments thoroughly, alongside AASHTO. Say it as the reason you know\nthe differences, not as a credential to list.<\/li>\n<li><strong>The steel example — same equations, different\nfactors.<\/strong> AISC 360 and AASHTO LRFD Section 6 share the same\nphysics: the column curve is the same form, and flexural and\nlateral-torsional buckling follow the same basic approach. The\ndifference is mostly on the factor side. AISC uses φ = 0.90 for flexure\nand compression; AASHTO uses φ_f = 1.00 for flexure and φ_c = 0.95 for\ncompression — because AASHTO’s load factors and live load model carry\nmore of the uncertainty. AASHTO also adds terms buildings rarely need:\nhybrid girder (R_h) and web load-shedding (R_b) factors, and a much more\ndeveloped fatigue treatment. <span class=\"verify\">VERIFY the φ values against current AISC\n360 and LRFD Section 6 before quoting numbers.<\/span><\/li>\n<li><strong>Terminology to get right.<\/strong> In both AISC and AASHTO,\nφ is a <em>resistance factor<\/em>. <em>Strength reduction factor<\/em> is\nACI 318’s term. Using each body’s own word is a small signal of\nfluency.<\/li>\n<li><strong>Concrete has a sharper contrast.<\/strong> ACI 318 uses φ =\n0.75 for shear with a simplified Vc approach; AASHTO uses φ = 0.90 for\nshear with a different model — sectional MCFT or the simplified β = 2\nmethod. Different φ for a different shear model, not just a different\nnumber for the same check. <span class=\"verify\">VERIFY<\/span><\/li>\n<li><strong>Why the systems cannot be mixed.<\/strong> Each code’s\nresistance factors are calibrated against its own load factors and\ntarget reliability — ASCE 7 combinations (1.2D + 1.6L) on a 50-year\nbasis versus AASHTO Strength I (1.25DC + 1.75LL with dynamic allowance\nand multiple presence) on a 75-year basis. Taking AASHTO loads and AISC\nφ, or the reverse, produces a check with no defined reliability. That is\nthe error to say you guard against on mixed projects like stations,\nwhere a platform may sit under the building code while an adjacent\nbridge or wall sits under AASHTO or AREMA.<\/li>\n<li><strong>Where the line sits on a single project.<\/strong> On a\nstation or platform job, decide and document at scoping which elements\nare governed by which code — building structure, platform, canopy,\nretaining walls, any bridge or railroad-adjacent element — so the design\nbasis is clear before calculations start. Same discipline as CTDOT’s own\nlines on PCI (accepted for NEXT beam distribution, not for prestress\nlosses in rating).<\/li>\n<li><strong>Seismic is a good bridge between the two.<\/strong> Buildings\nuse ASCE 7 seismic design categories and R factors; bridges use AASHTO’s\nSDC A–D approach (see <a class=\"xref\" href=\"#de/seismic/u192\" title=\"§27.22 · Seismic design and evaluation in Connecticut\">DE 4.1<\/a>). Similar inputs, different frameworks and\nperformance objectives — worth one sentence if the panel asks about\nConnecticut seismicity.<\/li>\n<\/ul>\n<p><strong>Suggested answer (about 45 seconds):<\/strong> “AASHTO governs\nthe bridge, but a lot of what CTDOT asks for sits under building codes.\nHDR works there every day — we have a Building Engineering Services\ngroup for non-bridge structures, and our transportation group carries\nbuilding-code work too. For CTDOT specifically, our Waterbury Branch\nLine stations follow the Connecticut State Building Code with ACI, ASCE,\nAISC and PCI. Personally, I just earned my SE, which is largely a\nbuilding-code exam, so I know where those codes line up with AASHTO and\nwhere they don’t — the steel buckling equations are nearly identical,\nbut the resistance factors differ because each is calibrated to its own\nload factors. That’s why we set the governing code for each element at\nscoping and never mix one code’s loads with another’s resistance.”<\/p>\n", "num": "PM 4.2", "home": ["pm", "you"], "old": "§27.48"}, {"id": "u218", "title": "Project Evidence — Mario’s Project Stories", "kind": "ref", "html": "\n<p>New in v6. Six projects written up as interview stories (five\nrecounted October 1, 2026; Pell Bridge is in <a class=\"xref\" href=\"#rh/deck/u193\" title=\"§27.23 · Deck overlays and rehabilitation materials\">RH 2.1<\/a>). Kept together\nrather than scattered into topic sections because each is cross-cutting\nevidence used across many answers. The Summer Street construction-stage\ndisagreement story (behavioral question) is in 27.40.\n<strong>Note:<\/strong> the “CTDOT tub girder project” flagged as open in\n<a class=\"xref\" href=\"#vf/verify/u167\" title=\"§26.2 · Items to Verify Before the Interview (Added This Session)\">VN 1.2<\/a> and <a class=\"xref\" href=\"#vf/verify/u161\" title=\"§25 · Verify before the interview\">VN 1.1<\/a> is the Niantic River Bridge (<a class=\"xref\" href=\"#pr/niantic/u221\" title=\"§28.2 · Niantic River Bridge (CTDOT) — refined analysis to resolve a low rating\">PR 3.1<\/a>).<\/p>\n", "num": "PR 1.2", "home": ["pr", "how"], "old": "§28"}, {"id": "u219", "title": "How to bring experience into an answer", "kind": "tp", "html": "\n<p>A panel can tell when a project is being retrofitted onto a question,\nand it costs more than the credential gains. The fix is the entry point:\ndon’t say “this is similar to a project I did.” Say what the question\nmade you think of — “the reason I’d check that is that on Summer Street\nwe found…” The project arrives as the reason for the answer, not as a\ncredential bolted on.<\/p>\n<p>Two stories stretch across many questions because of what they are\nabout, not what structure type they involve:<\/p>\n<ul>\n<li><strong>Summer Street<\/strong> is a story about modifying a\nstructure that was never designed to be modified. Fits widening, staged\nconstruction, closure pours, prestressed concrete, rehab\nvs. replacement, and most construction-stage analysis questions.<\/li>\n<li><strong>Niantic River<\/strong> is a story about whether a deficiency\nis real. Fits refined analysis, load rating, posting decisions, QA of\nratings, and any question about when to spend more analysis effort.<\/li>\n<\/ul>\n", "num": "PR 1.1", "home": ["pr", "how"], "old": "§28.0"}, {"id": "u220", "title": "Summer Street Bridge, Boston — shortening a post-tensioned prestressed box beam bridge", "kind": "tp", "html": "\n<ul>\n<li><strong>The structure.<\/strong> Single span, roughly 70 ft, but\nnearly 100 ft wide — adjacent prestressed box beams, transversely\npost-tensioned. Mario did much of the refined analysis himself and led a\nsmall team of bridge engineers on supporting tasks, reviewing their\nwork. Presented at the International Bridge Conference, Pittsburgh,\n2022.<\/li>\n<li><strong>The driver.<\/strong> A new hotel needed to occupy the same\nspace as one corner of the bridge — about 20 ft of length and 30 ft of\nwidth clipped off at that corner. Nine beams were cut short; roughly 36\nremained full length.<\/li>\n<li><strong>New support.<\/strong> A new steel bent was constructed under\nthe shortened beams, which meant cutting off the prestressing anchorage\nzone and building new end diaphragms — and internal diaphragms, since\nthe boxes are hollow.<\/li>\n<li><strong>Why the bridge had to become two bridges.<\/strong> Two\ndifferent span lengths in one structure means two different stiffnesses\nand incompatible deflections. The nine shortened beams had to be\nstructurally separated from the remaining beams with a longitudinal\njoint. That diagnosis — a system problem, not a member problem — is the\nquick version of the story.<\/li>\n<li><strong>The post-tensioning work.<\/strong> Transverse\npost-tensioning runs through interior diaphragms, which are not\naccessible. The sequence was: demo an access hole through the top\nflange, hydrodemolish the interior diaphragms, reach the PT ducts,\nrelieve tension, cut the strands, and re-post-tension the two structures\nindependently.<\/li>\n<li><strong>The hard part.<\/strong> Cutting the top flange of a\nprestressed beam carrying very high compression. Proving that was safe\nrequired construction-stage time history analysis in a finite element\nmodel carrying stresses from beam fabrication forward, including\nlong-term creep and shrinkage, to demonstrate the section stayed within\ncode stress limits at every stage.<\/li>\n<li><strong>Why it carries weight in an interview.<\/strong> Anyone can\nsay they checked the construction stages. This lets Mario say what the\nmodel actually had to contain and why — the stage analysis had teeth\nbecause the structure was already stressed before anyone touched\nit.<\/li>\n<\/ul>\n", "num": "PR 2.1", "home": ["pr", "summer"], "old": "§28.1"}, {"id": "u221", "title": "Niantic River Bridge (CTDOT) — refined analysis to resolve a low rating", "kind": "tp", "html": "\n<ul>\n<li><strong>The structure.<\/strong> Movable main span (double leaf\nbascule) with steel tub girder approach spans — two steel box girders,\nthree-span continuous units. Mario was the load rating engineer, rating\nthe whole bridge under CTDOT requirements as part of a\nrehabilitation.<\/li>\n<li><strong>The finding.<\/strong> The original design set the bottom\nflange plate transitions using the dead load moment diagram — dead load\npositive regions treated as positive moment regions, dead load negative\nregions as negative. But at the dead load inflection point, live load\nstill produces significant negative moment. So the thin, unstiffened\nwide bottom plate extended into regions that do see compression under\nlive load, where plate buckling is a real limit state. The negative\nmoment regions had WT stiffeners on the bottom flange; these transition\nregions did not.<\/li>\n<li><strong>Why it matters.<\/strong> In a wide thin bottom plate,\ntension is forgiving and compression is not. The HL-93 moment envelope\nshows negative moment along essentially the entire span line, so\n“negligible dead load moment” is not the same as “no compression.” This\nis a limit state a rating can miss if you only follow the original\ndesign’s region labels.<\/li>\n<li><strong>The refinement.<\/strong> A 3D analysis in MIDAS Civil was\ndone regardless, and it produced low ratings. Rather than accept them,\nMario investigated why — and in discussion with the Department concluded\nthat the splice plates and the adjacent heavily stiffened negative\nmoment flange provide restraint to the plate in question. Capturing that\nrequired nonlinear buckling analysis, including geometric imperfections,\nmaterial nonlinearity and residual stresses.<\/li>\n<li><strong>Imperfections were measured, not assumed.<\/strong> The team\nwent to the bridge with a level and measured actual bowing in the\nflange. The measured values turned out close to negligible; a\nconservative value was used. Going and measuring is the part panels\nremember.<\/li>\n<li><strong>Validation.<\/strong> Several iterations, plus independent\nsimplified hand calculations on plate buckling to confirm the model\nresults were reasonable. Never present a refined model result without an\nindependent check.<\/li>\n<li><strong>Result.<\/strong> The analysis demonstrated the plate would\nnot buckle under legal loads, bringing the rating to just above 1.0.\nHonest ending — refinement bought a real but not unlimited margin.<\/li>\n<li><strong>Why refine rather than post or retrofit.<\/strong> Retrofit\nwas undesirable on cost. The bridge had been in service many years with\nlimited to no signs of distress, which is itself evidence worth weighing\nagainst the numbers. And it is on a school bus route, so posting carried\nsignificant operational disruption.<\/li>\n<li><strong>The judgment line.<\/strong> The Department did not want the\nproblem calculated away — they wanted to know whether the deficiency was\nreal. Refined analysis is for resolving whether a deficiency is real,\nnot for making a number go away. A load rating supervisor on the panel\nwill respond to that.<\/li>\n<li><strong>Documentation.<\/strong> The analysis lives in the bridge\nfile and can be referenced at future rating cycles, which will otherwise\nrun into the same apparent deficiency.<\/li>\n<\/ul>\n", "num": "PR 3.1", "home": ["pr", "niantic"], "old": "§28.2"}, {"id": "u222", "title": "GRS-IBS, Massachusetts (URS, early career) — ABC and new technology", "kind": "tp", "html": "\n<ul>\n<li><strong>The project.<\/strong> A single span bridge on deck beams, a\nmodest superstructure, on a geosynthetic reinforced soil integrated\nbridge system substructure. Believed to be the first GRS-IBS in\nMassachusetts; MassDOT wanted to trial the system. Mario was on the\ndesign team doing calculations and plan development, not designer of\nrecord. Say that plainly if asked; accuracy about an early-career role\ncosts nothing and protects against a probe.<\/li>\n<li><strong>Where it fits.<\/strong> ABC and new technology questions,\nnot the retaining wall section — GRS-IBS is a bridge system, not a\nwall.<\/li>\n<li><strong>Get ahead of the date.<\/strong> Roughly 15 years ago reads\nas dated unless framed: being first in the state meant designing it\nwithout state guidance or local precedent to lean on, which is a harder\nproblem than building one today. That is the more interesting claim, and\nit is true.<\/li>\n<li><strong>Why the technology exists<\/strong> — the credible detail. No\nfooting excavation, no formwork, no reinforcing, no concrete cure time\non the critical path. Substructure construction collapses from weeks to\ndays, with ordinary equipment and granular fill rather than specialty\ntrades.<\/li>\n<li><strong>Honest limits if pressed.<\/strong> Suits modest single spans\nwith good foundation soils and manageable bearing pressures; it is not\nthe answer everywhere.<\/li>\n<\/ul>\n", "num": "PR 4.1", "home": ["pr", "grs"], "old": "§28.3"}, {"id": "u223", "title": "Powder Point Bridge, Duxbury MA — replacement with a stakeholder-driven hybrid", "kind": "tp", "html": "\n<ul>\n<li><strong>The structure.<\/strong> Over 2,000 ft long, more than 100\nspans, entirely timber — timber piles and timber superstructure.\nCurrently in design for replacement.<\/li>\n<li><strong>The conflict.<\/strong> Not formally historic, but the town\ntreats it as such and does not want to lose it. For MassDOT it is a\nmaintenance headache, with continual pile repairs and significant decay\nin many piles. <span class=\"verify\">VERIFY — believed to carry a 10-ton posting; confirm\nbefore stating it to a rating panel.<\/span><\/li>\n<li><strong>The solution.<\/strong> Replace the vehicular structure with\nsteel pipe piles supporting NEXT beams in several continuous units, and\ncarry two sidewalks, one each side, as independent timber\nsuperstructures on the same substructure — 60 ft glulam spans matching\nthe 60 ft NEXT beam spans.<\/li>\n<li><strong>Why this is the point worth making.<\/strong> It separates\nthe durability problem from the character problem. The town gets the\ntimber bridge experience people actually see and touch; the Department\ngets a vehicular structure with a real service life and no recurring
